# Ripasso Uni — concept curriculum (BACKBONE, fonte di verità per le lezioni giornaliere)
# Escluso: matematica pura (Analisi, Geometria, Mat. Applicata, Fisica, Elettrotecnica, Elettronica, Controlli).
# Ogni "topic" = una lezione giornaliera.
#
# SPEC LEZIONE (regole di Cristina — gold standard fissato in lessons/001):
#  - spiegazione "come all'uni" (ancorata alle sue slide quando esistono) + versione più chiara/completa;
#  - DETTAGLIO: spiega COME funzionano algoritmi/strategie; DEFINISCI ogni acronimo/termine al primo uso
#    (niente gergo lasciato lì, es. "indici/read-replica/sharding" vanno spiegati per esteso);
#  - COMPLETENESS CHECK: verifico la lezione e INTEGRO ciò che manca (le slide a volte sono scarne);
#  - PIÙ esempi concreti (meglio se legati al suo lavoro) + un case study reale;
#  - NOTABLE USE CASE di grandi aziende quando esistono (es. "come lo fa Netflix/Google/…");
#  - SCHEMI: includi diagrammi SVG/immagini dove chiariscono (architetture, flussi, matrici come il BMC);
#  - in fondo: FONTI (siti) + CONCETTI ADIACENTI (anche non trattati all'uni, es. system design);
#  - QUIZ ~10 domande, TUTTE rispondibili SOLO col contenuto della lezione (mai chiedere dati non spiegati);
#    risposte lavorate a scomparsa; se fallito, il topic torna in coda (spaced repetition).
#  - ESERCIZI (sezione "## Esercizi" PRIMA del "## Quiz"): 2-4 compiti PRATICI da svolgere (non domande a
#    risposta aperta): scrivere una funzione/query, disegnare uno schema, calcolare una complessità, modellare
#    un caso. Numerati 1., 2., …; le soluzioni in un blocco <details><summary>Soluzioni</summary> con la stessa
#    numerazione (codice, ragionamento, complessità). Servono a FARE, non solo a ricordare.
#  - grounding pesca sia da argomenti STUDIATI sia da ADIACENTI rilevanti per il lavoro.
#  - TAGLIO PRATICO per i temi AI/ML (vettorializzazione, embedding, indicizzazione, retrieval,
#    architetture di chatbot): spiega COME si costruisce e con QUALI tool reali, più che la matematica;
#    la formula si mette solo se serve all'intuizione (es. coseno), mai come cuore della lezione.
#
# POLITICA DI MIX (come comporre ogni buffer settimanale — richiesta esplicita di Cristina):
#  - OBIETTIVO n.1 = prepararsi a possibili LAVORI → privilegia il PRATICO e l'applicabile.
#  - "UN PO' DI TUTTO": ruota tra le aree, non fare settimane monotematiche. Mix tipico su 6 giorni:
#    ~AI/ML + ~SWE/craft + ~business/gestionale + ~ripassi generali UNIBO (Sistemi Operativi, Reti/
#    telecomunicazioni, Basi di Dati, Architetture…) + ~DSA/interview. Bilancia colloquio-first con cultura.
#  - APPROFONDIMENTI: ogni tanto includi anche una lezione meno utile nell'immediato ma formativa
#    (es. un tema di Sistemi Operativi o Telecomunicazioni), per fare cultura da ingegnere completo.
#  - NIENTE matematica pura NON applicabile (Analisi, ecc.). MA i temi matematici CON applicazione nel
#    suo ambito SÌ (es. Big-O/complessità è applicabile → si fa; probabilità per ML se serve, ecc.).
#  - TONO: "professore onnisciente" — spiega tutto, collega le materie, dai il quadro grande.

