const DATA={"lessons": [{"day": 1, "topic_id": "xc-sd-basics", "title": "System Design — fondamenti (scalabilità, load balancing, caching, CDN, scaling del DB)", "course": "System Design", "area": "cross-cutting", "adjacent": ["cloud-arch", "db-index", "xc-sd-data", "xc-sd-async"], "body": "# System Design — fondamenti\n\n> **Perché oggi:** non l'hai fatto all'uni, ma è **adiacente** (tocca Reti, Sistemi Operativi, Basi di Dati, Cloud) ed è **rilevante per il lavoro** e per i colloqui. L'esempio perfetto di \"tangente ma prezioso\".\n\n## Il problema che risolve\nUn sistema che funziona per 100 utenti spesso si rompe a 100.000: la stessa architettura non regge il carico. **System design** è decidere *come strutturare un sistema perché regga la scala, resti veloce e non cada quando qualcosa si rompe.* Prima un acronimo che useremo: **QPS = Queries Per Second**, richieste al secondo — la misura base del carico.\n\n<figure style=\"margin:18px 0;text-align:center\">\n<svg viewBox=\"0 0 680 250\" style=\"max-width:100%;height:auto;font-family:inherit\">\n  <defs><marker id=\"ar\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.4\"/></marker></defs>\n  <g font-size=\"12.5\" fill=\"var(--ink)\" text-anchor=\"middle\">\n   <rect x=\"8\" y=\"103\" width=\"92\" height=\"40\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"54\" y=\"127\">Client</text>\n   <rect x=\"142\" y=\"103\" width=\"124\" height=\"40\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/><text x=\"204\" y=\"127\">Load Balancer</text>\n   <rect x=\"308\" y=\"26\" width=\"112\" height=\"36\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"48\">App server</text>\n   <rect x=\"308\" y=\"103\" width=\"112\" height=\"36\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"125\">App server</text>\n   <rect x=\"308\" y=\"180\" width=\"112\" height=\"36\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"202\">App server</text>\n   <rect x=\"462\" y=\"40\" width=\"126\" height=\"36\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/><text x=\"525\" y=\"62\">Cache (Redis)</text>\n   <rect x=\"462\" y=\"150\" width=\"104\" height=\"36\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"514\" y=\"172\">DB primary</text>\n   <rect x=\"600\" y=\"150\" width=\"74\" height=\"36\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"637\" y=\"172\">Replica</text>\n  </g>\n  <g stroke=\"var(--muted)\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#ar)\">\n   <path d=\"M100,123 L140,123\"/>\n   <path d=\"M266,118 L306,46\"/><path d=\"M266,123 L306,121\"/><path d=\"M266,128 L306,196\"/>\n   <path d=\"M420,44 L460,56\"/><path d=\"M420,121 L460,60\"/>\n   <path d=\"M420,127 L460,162\"/><path d=\"M420,198 L460,170\"/>\n   <path d=\"M566,168 L598,168\"/>\n  </g>\n</svg>\n<figcaption style=\"font-size:12px;color:var(--muted);margin-top:4px\">Le quattro leve in uno schema: Client → Load Balancer → App server (stateless, scalati orizzontalmente) → Cache + DB (con read-replica).</figcaption>\n</figure>\n\n---\n\n## 1. Scalabilità: verticale vs orizzontale\n\n**Scalare** = aumentare la capacità del sistema. Due modi:\n\n- **Verticale (scale up):** dai alla *stessa* macchina più risorse (CPU, RAM). Semplice (non cambi architettura), ma ha due difetti: c'è un **tetto fisico** (la macchina più grossa che esiste) e resta un **single point of failure** (SPOF) = un unico punto che, se si rompe, butta giù tutto.\n- **Orizzontale (scale out):** metti *più* macchine che lavorano in parallelo. Nessun tetto pratico (ne aggiungi altre) e **tolleranza ai guasti** (se una cade, le altre reggono). Il prezzo: devi (a) **distribuire le richieste** tra le macchine (→ load balancer, sezione 2) e (b) gestire lo **stato**.\n\n**Stateless — il concetto chiave.** Un server è *stateless* (\"senza stato\") se **non tiene in memoria informazioni sull'utente tra una richiesta e l'altra** (es. la sessione di login). Perché conta? Perché con lo scale out una richiesta dell'utente può finire su un server diverso ogni volta: se lo stato fosse nella memoria di *un* server, andrebbe perso. Soluzione: i server restano stateless e lo **stato si mette in uno store condiviso** che tutti raggiungono (una cache tipo Redis, o il database). Così ogni server è **intercambiabile**. Regola pratica dei sistemi moderni: **stateless + scale out**.\n\n---\n\n## 2. Load balancing\n\nUn **load balancer (LB)** è un componente che sta *davanti* a N server e smista ogni richiesta a uno di loro. Fa tre lavori: **spalma il carico**, **toglie dal giro i server morti** (li controlla con degli *health check*, piccole richieste periodiche \"sei vivo?\"), e permette di **rilasciare nuove versioni senza downtime** (togli un server, aggiorni, rimetti).\n\n**Come sceglie a quale server mandare (gli algoritmi):**\n- **Round-robin:** a turno, uno dopo l'altro (server 1, 2, 3, 1, 2, 3…). Semplice; presuppone che i server siano equivalenti.\n- **Least-connections:** manda la richiesta al server che in quel momento ha **meno connessioni attive** (cioè il più scarico). Meglio quando le richieste durano tempi molto diversi.\n- **IP-hash (sticky sessions):** calcola una funzione (*hash*) sull'IP dell'utente e usa il risultato per scegliere *sempre lo stesso* server per quell'utente. Serve se il server tiene stato locale — ma è una toppa: meglio essere stateless (sez. 1).\n\n**Due livelli di LB (dai livelli di rete che hai visto in Reti):**\n- **L4** (livello trasporto, TCP/UDP): smista guardando solo IP e porta. Velocissimo, ma \"cieco\" al contenuto.\n- **L7** (livello applicativo, HTTP): legge la richiesta HTTP, quindi può instradare **per contenuto** (es. `/api/*` a un gruppo di server, `/static/*` a un altro). Più intelligente, un po' più lento.\n\n---\n\n## 3. Caching\n\n**Cache** = una copia dei dati tenuta *vicino e veloce da leggere*, per **non rifare ogni volta un lavoro costoso** (una query pesante, una risposta di un LLM, un calcolo). \"Vicino\" e \"veloce\" perché tipicamente la cache sta in RAM (Redis, Memcached), leggere dalla RAM è ordini di grandezza più rapido che interrogare un DB su disco.\n\n**Dove si mette (dal più vicino all'utente al più lontano):** browser → CDN (sez. 4) → **cache applicativa** (Redis/Memcached, condivisa tra i server) → cache interna del DB.\n\n**Il problema vero è l'invalidazione:** quando il dato originale cambia, la copia in cache diventa **vecchia** (*stale*). Chi legge dalla cache rischia un dato non aggiornato. Le tre strategie classiche:\n- **TTL (Time To Live):** dai a ogni voce una **scadenza** (es. 60 secondi). Dopo, viene buttata e ricaricata dalla sorgente. Semplice; accetti che il dato possa essere vecchio *al massimo* di quel tempo.\n- **Write-through** (\"scrivi attraverso\"): ogni volta che scrivi un dato, lo scrivi **in cache E nel DB nello stesso momento**. La cache è **sempre fresca**, ma ogni scrittura è un po' più lenta (fa due scritture).\n- **Cache-aside** (\"cache di lato\", la più comune): l'app **legge prima dalla cache**; se il dato c'è (*cache hit*) lo usa; se non c'è (*cache miss*) lo legge dal DB e **riempie la cache** per la prossima volta. Semplice, ma il **primo** accesso è lento (miss) e, se un dato cambia nel DB, la cache può restare vecchia finché non scade il TTL.\n- (Cenno: **write-back** = scrivi solo in cache subito e nel DB dopo, in differita. Velocissimo in scrittura, ma se la cache muore prima di scaricare, **perdi dati**. Si usa solo dove la perdita è tollerabile.)\n\n**Hit ratio — la metrica della cache.** È la **frazione di richieste servite dalla cache** invece che dalla sorgente lenta:\n> **hit ratio = cache hit / (cache hit + cache miss)**\n\nEsempio: su 100 richieste, 90 trovano il dato in cache (hit) e 10 no (miss) → hit ratio = 90/100 = **0,90 (90%)**. Alto = la cache sta lavorando (meno carico sul DB, meno latenza); basso = la cache serve a poco (dati troppo vari o TTL troppo corto).\n\n---\n\n## 4. CDN (Content Delivery Network)\n\n**CDN** = una **rete di server distribuiti geograficamente** che tengono copie dei contenuti **statici** (immagini, JS, CSS, video) e li servono dal nodo **più vicino** all'utente. Se l'origine è a Francoforte e l'utente a São Paulo, il file arriva dal nodo CDN di São Paulo, non da Francoforte → **meno latenza** (meno strada da fare) e **meno carico sull'origine**. È concettualmente caching, ma su scala **geografica**.\n\n---\n\n## 5. Scaling del database (qui muore quasi sempre il sistema)\n\nIl DB è spesso il **collo di bottiglia**: i server web li scali facilmente, il DB no. Tre rimedi, **in ordine di quando li applichi**:\n\n1. **Indici (index).** Un indice è una **struttura dati aggiuntiva** (di solito un B-tree) che il DB tiene su una colonna per **trovare le righe senza scorrere tutta la tabella**. Senza indice, cercare \"utente con email X\" su 10 milioni di righe le legge *tutte* (scan completo, lentissimo); con un indice sull'email, ci arriva in pochi passi (come l'indice analitico di un libro). **Primo rimedio, quasi gratis.**\n2. **Read-replica (replica di lettura).** Una **copia del database** che riceve in continuazione gli aggiornamenti dal DB principale (*primary*) e serve **solo le letture**. Le app leggono dalle repliche e scrivono sul primary → alleggerisci il primary quando le letture sono molte più delle scritture (il caso tipico). Costo: le repliche sono aggiornate con un **piccolo ritardo** (*replication lag*), quindi una lettura potrebbe non vedere l'ultimissima scrittura.\n3. **Sharding (partizionamento).** Quando *un* DB non basta più nemmeno per le scritture, **spezzi i dati su più database** in base a una chiave (*shard key*): es. utenti A-M sul DB 1, N-Z sul DB 2. Ogni shard regge una fetta del carico. Potente ma **complesso** (le query che attraversano più shard diventano difficili) → **ultima spiaggia**, non la prima mossa.\n\nEcco perché la frase \"prima indici e read-replica, poi (se serve) sharding\" ha un senso preciso: sono tre rimedi di **costo/complessità crescente**, e li applichi in quest'ordine.\n\n---\n\n## Esempi concreti\n\n**Esempio A — il tuo bot preventivi (Glacom) diventa virale, 500 QPS.** Nell'ordine:\n1. App **stateless** dietro **load balancer**, scale out a 3-4 istanze.\n2. Le risposte/documenti già generati li **cachi** (cache-aside + TTL): stesso input → stessa risposta, niente ricomputo del LLM.\n3. Statici (loghi, template) su **CDN**.\n4. Il DB rallenta → **indici** sulle colonne cercate, poi **read-replica** per le letture; **sharding** solo se davvero esplode.\n\n**Esempio B — un feed di notizie letto da tutti (poche scritture, moltissime letture).** Qui il **caching** e le **read-replica** fanno il 90% del lavoro: la stessa home page servita a migliaia di utenti si calcola una volta e si mette in cache (hit ratio altissimo).\n\n**Esempio C — una chat in tempo reale.** Il caching serve meno; contano di più i **WebSocket** (connessione persistente, → topic adiacente `xc-sd-async`) e i server stateless con lo stato della sessione in Redis.\n\n## Case study reale\n**Instagram agli inizi:** 3 ingegneri, milioni di utenti. La ricetta era esattamente questa — servizi **stateless** dietro **load balancer**, **caching** aggressivo (Memcached, hit ratio altissimo), **CDN** per le foto, **Postgres con read-replica** e poi sharding. Niente magia: le leve di sopra, applicate nell'ordine giusto.\n\n## Completeness check (integrato da me)\nOltre alle leve: a un colloquio di system design il **metodo** conta quanto le nozioni. Passi: (1) **chiarisci requisiti e stime** (quanti QPS? quanti dati? read-heavy o write-heavy?), (2) disegna lo **schema alto** (client → LB → server → cache → DB), (3) approfondisci i **colli di bottiglia**, (4) discuti i **trade-off**. Non esiste \"la\" risposta giusta: esistono scelte **motivate** dai trade-off (es. read-replica = scali le letture *ma* accetti replication lag).\n\n## Fonti\n- **System Design Primer** — github.com/donnemartin/system-design-primer (riferimento gratuito più usato)\n- **Designing Data-Intensive Applications**, Martin Kleppmann (il libro di riferimento su dati/scala)\n- **AWS Well-Architected Framework** — aws.amazon.com/architecture/well-architected\n- **High Scalability** — highscalability.com (case study reali)\n\n## Concetti adiacenti (dove andare dopo)\n- `xc-sd-data` — Dati a scala: sharding, replicazione, **CAP theorem** (collegato a Basi di Dati → transazioni/ACID)\n- `xc-sd-async` — Code, messaging, WebSocket (collegato a OS → IPC)\n- `cloud-arch` — Architetture cloud e scalabilità\n- `db-index` — Indici e ottimizzazione query (approfondimento del punto 5.1)", "quiz": [{"q": "Cosa significa **QPS**?", "a": "**Queries Per Second**, richieste al secondo: la misura base del carico."}, {"q": "Scaling **verticale** vs **orizzontale**: definisci entrambi e di' quale tollera il guasto di una macchina, e perché.", "a": "**Verticale** = più risorse alla stessa macchina; **orizzontale** = più macchine in parallelo. **L'orizzontale** tollera il guasto: se una macchina cade le altre reggono; la verticale ha un unico punto di guasto (SPOF)."}, {"q": "Cosa vuol dire che un server è **stateless**, e *dove* si mette allora lo stato dell'utente?", "a": "Stateless = **non tiene in memoria info sull'utente tra una richiesta e l'altra**. Lo stato si mette in uno **store condiviso** (cache tipo Redis, o il DB), così ogni server è intercambiabile."}, {"q": "A cosa serve un **load balancer** e come fa a evitare di mandare richieste a un server morto?", "a": "Smista le richieste tra N server (spalma il carico, deploy senza downtime). Evita i server morti con gli **health check**: controlli periodici \"sei vivo?\"; se un server non risponde, lo toglie dal giro."}, {"q": "Differenza tra load balancer **L4** e **L7**?", "a": "**L4** guarda solo IP+porta (livello trasporto): veloce ma cieco al contenuto. **L7** legge l'HTTP (livello applicativo): può instradare per path/header, più intelligente e un po' più lento."}, {"q": "Algoritmo **round-robin** vs **least-connections**: come scelgono il server?", "a": "**Round-robin**: a turno, uno dopo l'altro. **Least-connections**: al server con **meno connessioni attive** in quel momento (il più scarico)."}, {"q": "Scrivi la **formula dell'hit ratio** e calcolalo se su 200 richieste 150 sono hit.", "a": "**hit ratio = hit / (hit + miss)**. Con 150 hit su 200 richieste (50 miss): 150/200 = **0,75 (75%)**."}, {"q": "**Write-through** vs **cache-aside**: come funziona ciascuna e qual è il difetto di ciascuna?", "a": "**Write-through**: a ogni scrittura scrivi in **cache e DB insieme** → cache sempre fresca, ma scrittura più lenta. **Cache-aside**: leggi dalla cache, se manca (miss) leggi dal DB e riempi la cache → semplice, ma primo accesso lento e dato potenzialmente vecchio fino al TTL."}, {"q": "Cos'è un **indice** su un database e perché rende le query più veloci?", "a": "È una **struttura dati aggiuntiva** (B-tree) su una colonna che permette di **trovare le righe senza scorrere tutta la tabella** (come l'indice di un libro): da uno scan completo a pochi passi."}, {"q": "Metti in ordine di **costo/complessità crescente**: sharding, indici, read-replica. Spiega in una riga cosa fa ciascuno.", "a": "In ordine crescente: **indici** (struttura per query veloci, quasi gratis) → **read-replica** (copia del DB che serve le letture, alleggerisce il primary, ha replication lag) → **sharding** (spezzi i dati su più DB per chiave, regge anche le scritture ma è complesso: ultima spiaggia)."}]}, {"day": 2, "topic_id": "bp-canvas", "title": "Business Model Canvas — descrivere un modello di business su una pagina", "course": "Business Planning / Imprenditorialità", "area": "management", "adjacent": ["bp-market", "bp-financials", "inn-npd", "strat-frameworks"], "body": "# Business Model Canvas\n\n> **Perché oggi:** è lo strumento di base per **ragionare un business** (l'hai usato per MaiCare e per Samec). Serve a mettere su **una pagina** *come* un'azienda crea, consegna e cattura valore — e a vedere i buchi prima di costruire.\n\n## Cos'è\nIl **Business Model Canvas (BMC)** è un framework, ideato da **Alexander Osterwalder**, che descrive un modello di business con **9 blocchi** su un unico foglio. Non è un business plan (documento lungo): è una **mappa visiva** per progettare, discutere e iterare velocemente. Idea chiave: un modello di business si può disegnare, non solo raccontare.\n\n## I 9 blocchi (ognuno spiegato)\n\n**Lato destro = il mercato/valore. Lato sinistro = l'infrastruttura/costo. In mezzo, la value proposition.**\n\n1. **Customer Segments (segmenti di clientela):** *per chi* crei valore. Chi sono i gruppi distinti di clienti/utenti. Un modello può servire più segmenti (es. un marketplace serve *compratori* e *venditori* — mercato \"a due lati\").\n2. **Value Propositions (proposte di valore):** *quale problema risolvi* o quale bisogno soddisfi, e perché il cliente sceglie te. È il cuore: il pacchetto di prodotti/servizi che crea valore per un segmento (es. \"risparmio di tempo\", \"prezzo più basso\", \"meno ansia\").\n3. **Channels (canali):** *come raggiungi e consegni* al cliente — vendita, distribuzione, comunicazione (sito, app, negozio, forza vendita, partner).\n4. **Customer Relationships (relazioni con i clienti):** *che tipo di rapporto* stabilisci (self-service, assistenza dedicata, community, automazione) e come acquisisci/mantieni i clienti.\n5. **Revenue Streams (flussi di ricavo):** *come fai i soldi*. I meccanismi con cui il valore diventa denaro: vendita una tantum, **subscription** (abbonamento ricorrente), pay-per-use, licenza, commissione, pubblicità.\n6. **Key Resources (risorse chiave):** *cosa ti serve avere* per far funzionare il modello — asset fisici (impianti), intellettuali (brevetti, dati, brand), umani (talento), finanziari.\n7. **Key Activities (attività chiave):** *cosa devi saper fare* — le attività più importanti (produzione, sviluppo software, gestione di una piattaforma, R&S).\n8. **Key Partnerships (partnership chiave):** *chi ti aiuta da fuori* — fornitori e partner che forniscono risorse o attività che non fai internamente (per ridurre rischio/costo o accedere a competenze).\n9. **Cost Structure (struttura dei costi):** *quanto e cosa ti costa* far girare tutto. Si distingue tra **cost-driven** (minimizzare i costi, es. low-cost) e **value-driven** (puntare sul valore anche a costi alti), e tra **costi fissi** (non cambiano col volume) e **variabili** (crescono col volume).\n\n**Come si legge insieme:** i blocchi di destra (segmenti, value proposition, canali, relazioni, ricavi) dicono *cosa offri e a chi e come guadagni*; quelli di sinistra (risorse, attività, partner, costi) dicono *cosa serve per erogarlo*. Un modello sano: i ricavi (5) coprono i costi (9), e ogni value proposition (2) è agganciata a un segmento reale (1).\n\n## Esempio concreto\n**MaiCare (la tua startup), in forma BMC:**\n- *Segmenti:* pazienti con patologie gineco-pelviche croniche **+** medici/cliniche (due lati). *Value prop:* per le pazienti, tracciare sintomi e portare dati ordinati alla visita; per i medici, uno strumento di fidelizzazione e dati aggregati per ricerca. *Canali:* app + partnership con cliniche. *Ricavi:* subscription freemium (pazienti) + sponsorizzazione medici + partnership dati (modello **B2B2C**). *Risorse chiave:* la piattaforma e i dati. *Attività:* sviluppo software, gestione compliance. *Partner:* cliniche, centri di ricerca. *Costi:* sviluppo, infrastruttura, regolamentazione.\n\n## Notable use cases (grandi aziende)\n- **Netflix:** *ricavi* = subscription ricorrente (non vendita di singoli film); *risorse/attività chiave* = contenuti (licenze + produzione originale) e l'algoritmo di raccomandazione; *value prop* = \"tutto quello che vuoi, quando vuoi, senza pubblicità\". Il modello a abbonamento è ciò che lo distingue dal noleggio classico.\n- **Airbnb:** *mercato a due lati* (host e ospiti); *partner chiave* = gli host (che forniscono l'\"inventario\" senza che Airbnb possieda immobili); *ricavi* = commissione su ogni prenotazione; *risorsa chiave* = la piattaforma e la fiducia (recensioni).\n- **Ryanair:** *cost structure* estrema (cost-driven): tolgono tutto il superfluo per tenere i prezzi bassi; *ricavi* = biglietto basso + ancillary (bagagli, priorità); *value prop* = \"volare al prezzo più basso\".\n\n## Completeness check (integrato da me)\nIl BMC descrive *com'è* un modello, non *se funziona*: va accoppiato con (a) la **Value Proposition Canvas** (zoom sul fit tra ciò che offri e i \"job/pain/gain\" del cliente — l'hai usata per Samec), (b) i **numeri** (i ricavi coprono i costi? → lezione `bp-financials`), e (c) la **validazione** sul campo (interviste, non ipotesi). Un BMC bello ma senza clienti reali è un disegno, non un business.\n\n## Fonti\n- **Strategyzer** — strategyzer.com (i creatori del canvas, template gratuiti)\n- **Business Model Generation**, Osterwalder & Pigneur (il libro di riferimento)\n- **Value Proposition Design**, stessi autori (il complemento sul fit valore-cliente)\n\n## Concetti adiacenti\n- `bp-market` — Market analysis (TAM/SAM/SOM): dimensiona il segmento\n- `bp-financials` — Financial modeling: verifica che ricavi > costi\n- `inn-npd` — New Product Development\n- `strat-frameworks` — Strategia (il BMC descrive il \"come\", la strategia il \"perché vinci\")", "quiz": [{"q": "Chi ha ideato il Business Model Canvas e quanti blocchi ha?", "a": "**Alexander Osterwalder**; **9** blocchi."}, {"q": "Qual è la differenza tra un Business Model Canvas e un business plan?", "a": "Il **BMC** è una **mappa visiva su una pagina** per progettare/iterare velocemente; il **business plan** è un documento lungo e dettagliato. Il canvas serve a ragionare e trovare i buchi, non a scrivere tutto."}, {"q": "Nel BMC, cosa descrive il blocco **Value Propositions**?", "a": "Il **problema che risolvi / bisogno che soddisfi** per un segmento, cioè perché il cliente sceglie te (il pacchetto di prodotti/servizi che crea valore)."}, {"q": "Cosa sono i **Revenue Streams** e fai due esempi di meccanismi di ricavo diversi.", "a": "I **flussi di ricavo** = come il valore diventa denaro. Esempi: **subscription** (abbonamento ricorrente) e **vendita una tantum** (o pay-per-use, commissione, licenza, pubblicità)."}, {"q": "Cosa significa che un mercato è \"a due lati\"? Fai un esempio dai casi visti.", "a": "Un mercato in cui servi **due segmenti distinti che si servono a vicenda** tramite te (es. Airbnb: host e ospiti; MaiCare: pazienti e medici)."}, {"q": "Differenza tra costi **fissi** e **variabili**?", "a": "**Fissi** = non cambiano col volume di produzione/vendita (es. affitto). **Variabili** = crescono col volume (es. materie prime per unità)."}, {"q": "Cost structure **cost-driven** vs **value-driven**: spiega entrambe.", "a": "**Cost-driven:** minimizzi i costi il più possibile (modello low-cost, es. Ryanair). **Value-driven:** punti sul valore/qualità anche accettando costi alti (es. un premium)."}, {"q": "Nel modello di Netflix, qual è il flusso di ricavo principale e perché lo distingue dal noleggio classico?", "a": "La **subscription ricorrente**: paghi un abbonamento per accesso illimitato, non il singolo film. È ciò che lo distingue dal noleggio (pay-per-title) classico."}, {"q": "Perché per Airbnb gli **host** sono un *key partner* e non un *key resource* posseduto?", "a": "Perché Airbnb **non li possiede**: gli host forniscono l'inventario (le case) dall'esterno → sono un partner che porta risorse, non un asset di proprietà dell'azienda."}, {"q": "Cosa aggiunge la **Value Proposition Canvas** rispetto al BMC?", "a": "Fa lo **zoom sul fit** tra ciò che offri e i **job / pain / gain** del cliente — verifica che la value proposition risponda davvero a bisogni reali, dettaglio che il BMC da solo non approfondisce."}]}], "order": [{"id": "prog-oop", "name": "Principi OOP (incapsulamento, ereditarietà, polimorfismo, astrazione)", "course": "Programmazione & OOP (Fondamenti + Sistemi Software a Oggetti)", "area": "computer-science"}, {"id": "prog-ds", "name": "Strutture dati (liste, mappe, alberi, hash)", "course": "Programmazione & OOP (Fondamenti + Sistemi Software a Oggetti)", "area": "computer-science"}, {"id": "prog-algo", "name": "Algoritmi e complessità (Big-O, sorting, ricerca)", "course": "Programmazione & OOP (Fondamenti + Sistemi Software a Oggetti)", "area": "computer-science"}, {"id": "prog-testing", "name": "Testing e qualità del codice (unit test, JUnit)", "course": "Programmazione & OOP (Fondamenti + Sistemi Software a Oggetti)", "area": "computer-science"}, {"id": "logic-bool", "name": "Algebra booleana e porte logiche", "course": "Reti Logiche (concettuale)", "area": "computer-science"}, {"id": "logic-seq", "name": "Reti combinatorie vs sequenziali, FSM", "course": "Reti Logiche (concettuale)", "area": "computer-science"}, {"id": "arch-isa", "name": "CPU, ISA, ciclo fetch-decode-execute, assembly (DLX)", "course": "Architetture dei Calcolatori", "area": "computer-science"}, {"id": "arch-pipeline", "name": "Pipelining e hazard", "course": "Architetture dei Calcolatori", "area": "computer-science"}, {"id": "arch-mem", "name": "Gerarchia di memoria, cache, località", "course": "Architetture dei Calcolatori", "area": "computer-science"}, {"id": "os-processes", "name": "Processi e thread", "course": "Sistemi Operativi", "area": "computer-science"}, {"id": "os-scheduling", "name": "Scheduling della CPU", "course": "Sistemi Operativi", "area": "computer-science"}, {"id": "os-memory", "name": "Gestione memoria e memoria virtuale (paging)", "course": "Sistemi Operativi", "area": "computer-science"}, {"id": "os-concurrency", "name": "Concorrenza e sincr // mini markdown → html
function md(s){
 const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
 function inline(t){return esc(t)
   .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g,"$1<i>$2</i>")
   .replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank">$1</a>');}
 const lines=s.split("\n");let out=[],i=0;
 while(i<lines.length){let l=lines[i];
  const hb=l.match(/^\s*<(svg|figure|div|table|img|pre)\b/i);
  if(hb){const tag=hb[1].toLowerCase();let buf=[];
    while(i<lines.length){buf.push(lines[i]);
      if(new RegExp("</"+tag+">","i").test(lines[i])||(tag==="img"&&/>/.test(lines[i]))){i++;break;}i++;}
    out.push(buf.join("\n"));continue;}
  if(/^###\s/.test(l)){out.push("<h3>"+inline(l.slice(4))+"</h3>");i++;continue;}
  if(/^##\s/.test(l)){out.push("<h2>"+inline(l.slice(3))+"</h2>");i++;continue;}
  if(/^#\s/.test(l)){out.push("<h1>"+inline(l.slice(2))+"</h1>");i++;continue;}
  if(/^---\s*$/.test(l)){out.push("<hr>");i++;continue;}
  if(/^>\s?/.test(l)){let b=[];while(i<lines.length&&/^>\s?/.test(lines[i])){b.push(inline(lines[i].replace(/^>\s?/,"")));i++;}out.push("<blockquote>"+b.join("<br>")+"</blockquote>");continue;}
  if(/^\s*[-*]\s/.test(l)){let b=[];while(i<lines.length&&/^\s*[-*]\s/.test(lines[i])){b.push("<li>"+inline(lines[i].replace(/^\s*[-*]\s/,""))+"</li>");i++;}out.push("<ul>"+b.join("")+"</ul>");continue;}
  if(/^\s*\d+\.\s/.test(l)){let b=[];while(i<lines.length&&/^\s*\d+\.\s/.test(lines[i])){b.push("<li>"+inline(lines[i].replace(/^\s*\d+\.\s/,""))+"</li>");i++;}out.push("<ol>"+b.join("")+"</ol>");continue;}
  if(l.trim()===""){i++;continue;}
  out.push("<p>"+inline(l)+"</p>");i++;}
 return out.join("\n");}

function statusOf(tid){return (ST[tid]||{}).status||"todo";}
function renderNav(){
 const nav=document.getElementById("nav");let done=0;
 const AREAS={"computer-science":"Informatica","management":"Gestionale","cross-cutting":"Trasversale"};
 let out="",last=null;
 DATA.order.forEach(t=>{const s=statusOf(t.id);if(s==="mastered")done++;
   if(t.area!==last){out+=`<li class="grp">${AREAS[t.area]||t.area}</li>`;last=t.area;}
   const has=byId[t.id];const cls=(s==="mastered"?"done":s==="to-repeat"?"rep":"")+(cur===t.id?" on":"");
   const icon=s==="mastered"?"✓":s==="to-repeat"?"↻":has?"•":"·";
   out+=`<li class="${cls}" ${has?`onclick="openLesson('${t.id}')"`:""} title="${t.course}"><span class="st">${icon}</span><span>${t.name}</span></li>`;
 });
 nav.innerHTML=out;
 document.getElementById("prog").textContent=`${done}/${DATA.total} padroneggiati · ${DATA.lessons.length} lezioni pronte`;
 document.getElementById("barfill").style.width=(done/DATA.total*100)+"%";}

let cur=null;
function openLesson(tid){cur=tid;const l=byId[tid];const m=document.getElementById("main");
 if(!l){m.innerHTML='<p class="empty">Lezione non ancora generata.</p>';return;}
 let q=l.quiz.map((x,idx)=>`<div class="qcard" id="q${idx}"><div class="qq">${idx+1}. ${md(x.q).replace(/^<p>|<\/p>$/g,"")}</div>
   <div class="qa">${md(x.a)}</div>
   <div class="qbtns"><button class="rev" onclick="reveal(${idx})">Mostra risposta</button>
   <button class="ok" onclick="mark(${idx},1)">✓ la sapevo</button>
   <button class="no" onclick="mark(${idx},0)">✗ non la sapevo</button></div></div>`).join("");
 m.innerHTML=`<div class="crumb">${l.area} · ${l.course}${l.day?" · Giorno "+l.day:""}</div>
   <div class="lesson">${md(l.body)}</div>
   <div class="quiz"><h2>Quiz</h2>${q}<div id="res"></div></div>`;
 window.scrollTo(0,0);renderNav();grade();}
function reveal(i){document.getElementById("q"+i).classList.add("open");}
window._marks={};
function mark(i,ok){const c=document.getElementById("q"+i);c.classList.add("open");
 c.querySelector(".ok").classList.toggle("sel",ok===1);c.querySelector(".no").classList.toggle("sel",ok===0);
 window._marks[i]=ok;grade();}
function grade(){const l=byId[cur];const tot=l.quiz.length;const ansd=Object.keys(window._marks).length;
 const res=document.getElementById("res");if(!res)return;
 if(ansd<tot){res.innerHTML=`<div class="result">Rispondi a tutte (${ansd}/${tot}) per chiudere la lezione.</div>`;return;}
 const score=Object.values(window._marks).reduce((a,b)=>a+b,0);const pct=Math.round(score/tot*100);
 const pass=pct>=70;
 res.innerHTML=`<div class="result"><b>${score}/${tot} (${pct}%)</b> — ${pass?"padroneggiato ✅":"da ripassare ↻ (torna tra qualche giorno)"}.
   <div class="done-btn"><button onclick="finish(${pass?1:0})">${pass?"Segna completata":"Segna da ripassare"}</button></div></div>`;}
function finish(pass){ST[cur]={status:pass?"mastered":"to-repeat",score:Object.values(window._marks).reduce((a,b)=>a+b,0),ts:Date.now()};
 save();window._marks={};renderNav();
 // go to newest unseen lesson
 const next=DATA.lessons.slice().reverse().find(l=>statusOf(l.topic_id)==="todo");
 if(next)openLesson(next.topic_id);else openLesson(cur);}
// start: newest not-mastered lesson, else the last one
function start(){const todo=DATA.lessons.slice().reverse().find(l=>statusOf(l.topic_id)!=="mastered");
 openLesson((todo||DATA.lessons[DATA.lessons.length-1]||{}).topic_id);}
renderNav();
if(DATA.lessons.length){start();}else{document.getElementById("main").innerHTML='<p class="empty">Nessuna lezione ancora. Genera la prima con il loop.</p>';}
</script></body></html>
