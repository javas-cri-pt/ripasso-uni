dai requisiti si passa all'analisi e alla modellazione del sistema (le classi, i comportamenti).\n- **se-process** — i modelli di processo (a cascata, iterativo, Agile) che dicono *quando* e *quanto spesso* si fa l'analisi dei requisiti.\n- **xc-pm-prd** — il PRD (Product Requirements Document) e le user story: come i requisiti si scrivono nel mondo prodotto/Agile.\n- **is-bpmn** — la modellazione dei processi di business (BPMN): serve a capire il dominio e i flussi prima di fissare i requisiti.", "quiz": [{"q": "Cos'è un **requisito**? E perché un errore nei requisiti scoperto tardi costa così tanto?", "a": "Un **requisito** è una **proprietà o un servizio che il sistema deve avere/offrire**. Un errore nei requisiti scoperto tardi costa **ordini di grandezza** in più perché si **propaga**: ci costruisci sopra analisi, design, codice e test; corretto in analisi cambi una riga (costa poco), corretto in produzione devi disfare e rifare tutto ciò che ci hai costruito sopra (costa tantissimo)."}, {"q": "Qual è la differenza tra requisito **funzionale** e **non funzionale**? Fai un esempio di ciascuno preso da Signal.", "a": "**Funzionale** = **cosa** fa il sistema (le funzioni): es. Signal *\"l'utente può effettuare una segnalazione con posizione\"*. **Non funzionale** = **come** deve farlo, cioè qualità e vincoli (prestazioni, sicurezza, usabilità, affidabilità, privacy): es. Signal i **requisiti di protezione dei dati (GDPR)**."}, {"q": "Quali sono le **quattro attività** dell'analisi dei requisiti, in ordine?", "a": "**Raccolta (elicitation) → Analisi (del dominio, con glossario) → Specifica → Validazione.**"}, {"q": "Quali sono le **cinque proprietà** di un buon requisito?", "a": "Un buon requisito è **chiaro, non ambiguo, verificabile, tracciabile, consistente**."}, {"q": "Che differenza c'è tra **validazione** e **verifica**?", "a": "**Validazione** = stiamo scrivendo i requisiti **giusti**? (il *sistema giusto*, lo giudica il **cliente/committente**). **Verifica** = stiamo costruendo il sistema **secondo i requisiti**? (il *sistema costruito bene*, si giudica rispetto alla specifica). In breve: validazione = bersaglio giusto; verifica = bersaglio centrato."}, {"q": "Cos'è un **attore** e cos'è un **caso d'uso**? Fai gli esempi di Signal.", "a": "**Attore** = un **ruolo esterno** che interagisce col sistema (in Signal: **Utente/Cittadino** e **Amministratore**). **Caso d'uso** = una **funzionalità dal punto di vista dell'attore** con un obiettivo (in Signal: *Effettua Segnalazione*, *Visualizza Stato Segnalazione*, *Prendi in carico segnalazione*, ecc.)."}, {"q": "Che differenza c'è tra le relazioni **include** ed **extend** tra casi d'uso?", "a": "**include** = un caso d'uso ne usa **sempre** un altro (pezzo obbligatorio, es. segnalare *include* essere autenticati). **extend** = aggiunge un **comportamento opzionale**, che scatta solo in certe condizioni (l'eccezione/variante)."}, {"q": "Qual è la differenza tra un **caso d'uso** e uno **scenario**? Cosa sono il flusso principale e il flusso alternativo?", "a": "Il **caso d'uso** è **astratto** (l'obiettivo, con tutti i suoi svolgimenti possibili); lo **scenario** è **una specifica esecuzione** del caso d'uso, raccontata passo per passo. Il **flusso principale** è la sequenza quando tutto va bene; il **flusso alternativo/eccezione** è cosa succede quando qualcosa devia (es. in \"Effettua Segnalazione\" la posizione manca → il sistema la richiede)."}, {"q": "Cos'è un **misuse case** e cos'è un **security use case**? Fai un esempio da Signal.", "a": "**Misuse case** = come un **attore ostile** attacca/usa male il sistema (es. Signal: inserire **segnalazioni false di massa**, o **accedere a dati altrui**). **Security use case** = la **contromisura** che neutralizza quel misuse case (es. autenticazione, limiti sul numero di segnalazioni, controlli di autorizzazione). Si ragiona a coppie minaccia–controllo."}, {"q": "Qual è il **formato di una user story**? Scrivine una per Signal.", "a": "Formato: **\"Come [ruolo] voglio [obiettivo] così che [beneficio].\"** Esempio Signal: *\"Come cittadino voglio segnalare una buca così che venga riparata.\"* Si accompagna ai **criteri di accettazione** che la rendono verificabile."}]}, {"day": 12, "topic_id": "se-principles", "title": "Principi di progettazione (rigidità/fragilità/immobilità, SOLID) e Design Pattern", "course": "Ingegneria del Software", "area": "computer-science", "adjacent": ["se-patterns", "se-arch", "xc-swe-clean", "prog-oop"], "body": "# Principi di progettazione e Design Pattern\n\n> **Perché oggi:** far \"funzionare il codice\" non basta. Ciò che distingue un software engineer da chi mette insieme righe finché non gira è **progettare bene**: decidere come è fatto il sistema perché regga alle modifiche. Su Signal la tua parte era proprio l'**architettura**, cioè queste decisioni. E non è teoria da lasciare all'università: rigidità, fragilità, SOLID e i design pattern tornano a **ogni colloquio tecnico**, spesso con la domanda \"come lo progetteresti?\".\n\n## Cosa vuol dire progettare (design)\n\nDopo aver raccolto i **requisiti** (cosa deve fare il sistema), arriva la **progettazione** (design): decidere **come** è fatto dentro. Il risultato principale è l'**architettura**, cioè quali **moduli** e **componenti** compongono il sistema e come **collaborano** tra loro. Un \"modulo\" è una parte del software con un confine chiaro (una classe, un package, un componente): la scatola con cui costruisci.\n\nIl nemico numero uno del design è la **complessità**: un sistema grande, se lo pensi tutto insieme, non lo governi. Per domarla hai due armi che vanno sempre insieme:\n\n- **Modularità** — dividi il sistema in **parti** più piccole e trattabili, invece di un unico blocco monolitico. Ogni parte la puoi capire, testare e modificare da sola.\n- Il modo in cui dividi conta, e si misura con due proprietà:\n\n**Coesione (cohesion)** — quanto le cose *dentro* un modulo sono legate a un unico scopo. **Alta coesione** significa che il modulo **fa una cosa sola, ben definita**: tutto ciò che c'è dentro serve a quello scopo. Un modulo `RicercaSegnalazioni` che si occupa *solo* di cercare segnalazioni è coeso; un modulo che cerca segnalazioni **e** manda email **e** gestisce il login è poco coeso (fa troppe cose scollegate).\n\n**Accoppiamento (coupling)** — quanto un modulo **dipende** dagli altri. **Basso accoppiamento** significa che i moduli si conoscono poco: ognuno può cambiare dentro senza costringere gli altri a cambiare. Se per modificare la ricerca devi mettere mano anche a cinque altri moduli, l'accoppiamento è alto.\n\n**La regola d'oro della progettazione è: alta coesione + basso accoppiamento.** Moduli che fanno una cosa sola (coesi) e dipendono poco l'uno dall'altro (disaccoppiati). Tutto il resto della lezione — sintomi, SOLID, pattern — è al servizio di questa regola.\n\n## I tre sintomi del cattivo design (Robert Martin)\n\nCome fai a sapere se un design è \"marcio\"? **Robert C. Martin** (detto \"Uncle Bob\", l'autore che ha reso popolari questi concetti e SOLID) elenca tre sintomi principali. Sono i segnali che il codice si sta degradando (cap. 7 del corso):\n\n- **Rigidità (rigidity)** — il software è **difficile da modificare**: ogni cambiamento, anche piccolo, ne tira dietro tanti altri a catena. Vuoi toccare una cosa e ti accorgi di dover rimettere mano a dieci punti collegati. Cambiare costa tantissimo, quindi si evita di farlo.\n- **Fragilità (fragility)** — quando modifichi un punto, **si rompe qualcosa in un altro punto lontano e non correlato**. Sistemi la ricerca e si guasta la notifica, che non c'entrava niente. Il software si spacca facilmente e in modi imprevedibili.\n- **Immobilità (immobility)** — non riesci a **riusare** un pezzo in un altro progetto perché è troppo **intrecciato** col resto: per portarti via il modulo che ti serve dovresti trascinarti dietro mezzo sistema, e allora rinunci e riscrivi da capo.\n\nCi sono altri \"odori\" (code smells) minori che il corso cita di sfianco: la **viscosità** (fare la cosa giusta è più scomodo che fare la scorciatoia sporca, quindi il team peggiora il design), la **complessità inutile** (astrazioni e strutture messe \"in caso servano\" che non servono), la **ripetizione** (lo stesso codice copiato in più punti, che poi vanno corretti tutti a mano) e l'**opacità** (codice scritto in modo poco chiaro, difficile da leggere e capire).\n\n## I principi SOLID (la cura)\n\n**SOLID** è un **acronimo** che raccoglie **cinque principi di progettazione orientata agli oggetti** (object-oriented, cioè basata su classi e oggetti), formulati e resi popolari da **Robert C. Martin**. Ogni lettera è un principio. Servono esattamente a **combattere i tre sintomi** appena visti: applicandoli, il design resta flessibile invece di diventare rigido, fragile e immobile.\n\n- **S — Single Responsibility Principle (SRP), Principio di responsabilità singola.** Una classe deve avere **una sola responsabilità**, cioè **un solo motivo per cambiare**. Se una classe si occupa di due cose diverse (per esempio calcolare qualcosa *e* salvarlo su file), due motivi diversi la fanno cambiare, e le due cose si intralciano. È l'alta coesione applicata alla singola classe.\n- **O — Open/Closed Principle (OCP), Principio aperto/chiuso.** Un modulo deve essere **aperto all'estensione** ma **chiuso alla modifica**: devi poter **aggiungere** nuovi comportamenti **senza toccare** il codice già scritto e funzionante. Esempio Signal: se domani vuoi una **nuova categoria di segnalazione** (oltre a quelle esistenti), un buon design ti fa aggiungerla senza riscrivere il cuore del sistema che gestisce le segnalazioni — estendi, non modifichi.\n- **L — Liskov Substitution Principle (LSP), Principio di sostituzione di Liskov.** Un **sottotipo** (una sottoclasse) deve poter **sostituire** il suo tipo base **senza rompere** il programma. Ovunque il codice si aspetta la classe base, deve poter ricevere una qualsiasi sua sottoclasse e continuare a funzionare correttamente. Se una sottoclasse si comporta in modo che \"tradisce\" le aspettative della base, viola LSP.\n- **I — Interface Segregation Principle (ISP), Principio di segregazione delle interfacce.** Un'**interfaccia** (l'insieme di metodi che una classe promette di offrire) va tenuta **piccola e specifica**. Meglio **tante interfacce piccole e mirate** che un'unica interfaccia enorme: quest'ultima costringe chi la implementa a scrivere anche metodi che non gli servono, solo per rispettare il contratto.\n- **D — Dependency Inversion Principle (DIP), Principio di inversione delle dipendenze.** Dipendi da **astrazioni** (interfacce), **non** da **implementazioni concrete**. Il modulo di alto livello non deve conoscere i dettagli del modulo di basso livello: entrambi si appoggiano a un'interfaccia condivisa. Così puoi sostituire l'implementazione concreta (per esempio scambiare come vengono inviate le notifiche) senza toccare chi la usa.\n\nIl filo che li lega: **SOLID è la cura dei tre sintomi.** SRP e ISP alzano la **coesione**; DIP e OCP abbassano l'**accoppiamento** e rendono il codice estensibile; LSP tiene sane le gerarchie di ereditarietà. Insieme, un sistema SOLID è più facile da modificare (contro la **rigidità**), meno soggetto a rotture a distanza (contro la **fragilità**) e con pezzi più riusabili (contro l'**immobilità**).\n\n## Design pattern (GoF)\n\nUn **design pattern** (\"schema di progettazione\") è una **soluzione riutilizzabile a un problema ricorrente** di progettazione orientata agli oggetti. L'idea di fondo: certi problemi si ripresentano in mille progetti diversi, e per ognuno esiste uno schema collaudato per risolverlo bene. Invece di reinventare la ruota, riconosci il problema e applichi il pattern.\n\nAttenzione: un pattern **non è codice pronto** da copiare-incollare. È uno **schema**, una descrizione di come organizzare classi e oggetti, che poi adatti al tuo caso e implementi nel tuo linguaggio.\n\nIl catalogo di riferimento è quello dei **GoF — Gang of Four** (\"banda dei quattro\"), soprannome dei **quattro autori** del libro *\"Design Patterns\"* (1994): **Erich Gamma, Richard Helm, Ralph Johnson e John Vlissides**. Hanno raccolto e catalogato 23 pattern in **tre famiglie**, secondo il tipo di problema che risolvono:\n\n- **Creazionali (creational)** — riguardano **come si creano gli oggetti**, nascondendo o controllando il processo di creazione.\n  - **Singleton** — garantisce che di una certa classe esista **una sola istanza** in tutto il programma, con un punto di accesso globale. Utile per cose di cui deve esistere una copia unica, per esempio la **configurazione** dell'applicazione.\n  - **Factory Method** (\"metodo fabbrica\") — invece di creare un oggetto con `new` direttamente, **deleghi la creazione a un metodo** (spesso ridefinito nelle sottoclassi), che decide *quale* tipo concreto creare. Esempio Signal: un metodo-fabbrica che, dato il tipo richiesto, crea l'oggetto giusto per quel tipo di segnalazione, senza che chi lo chiama debba sapere quale classe concreta viene istanziata.\n- **Strutturali (structural)** — riguardano **come si compongono classi e oggetti** in strutture più grandi.\n  - **Adapter** (\"adattatore\") — fa **combaciare due interfacce incompatibili**: avvolge una classe con un'interfaccia diversa da quella che offre, così che una parte del sistema possa usarla anche se \"parla una lingua diversa\". Come un adattatore per la presa elettrica.\n  - **Facade** (\"facciata\") — mette **un'unica interfaccia semplice davanti a un sottosistema complesso**: nascondi tante classi e passaggi dietro un solo punto d'ingresso pulito, così chi lo usa non deve conoscere il groviglio interno.\n- **Comportamentali (behavioral)** — riguardano **come le classi interagiscono** e si dividono le responsabilità a runtime.\n  - **Observer** (\"osservatore\") — quando un oggetto **cambia stato**, **notifica automaticamente** tutti gli oggetti che si erano registrati come suoi \"osservatori\", senza che lui debba conoscerli uno per uno. Esempio Signal: quando una **segnalazione cambia stato** (es. viene presa in carico), notifica automaticamente chi la sta seguendo — l'utente che l'ha inviata e l'amministratore.\n  - **Strategy** (\"strategia\") — incapsula **algoritmi intercambiabili** in classi separate e ti permette di **scegliere a runtime** quale usare, senza cambiare il codice che lo invoca. Vuoi ordinare i risultati in modi diversi? Ogni criterio è una \"strategia\" che puoi sostituire al volo.\n\n<figure style=\"margin:18px 0;text-align:center\">\n<svg viewBox=\"0 0 660 250\" style=\"max-width:100%;height:auto;font-family:inherit\">\n  <defs><marker id=\"arObsSig\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.4\"/></marker></defs>\n  <g font-size=\"12\" fill=\"var(--ink)\" text-anchor=\"middle\">\n   <rect x=\"240\" y=\"18\" width=\"180\" height=\"52\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.8\"/>\n   <text x=\"330\" y=\"40\">Segnalazione</text>\n   <text x=\"330\" y=\"57\" font-size=\"10.5\" fill=\"var(--muted)\">(Soggetto / Subject)</text>\n\n   <rect x=\"60\" y=\"160\" width=\"180\" height=\"52\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/>\n   <text x=\"150\" y=\"183\">Utente</text>\n   <text x=\"150\" y=\"200\" font-size=\"10.5\" fill=\"var(--muted)\">(Observer)</text>\n\n   <rect x=\"420\" y=\"160\" width=\"180\" height=\"52\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/>\n   <text x=\"510\" y=\"183\">Amministratore</text>\n   <text x=\"510\" y=\"200\" font-size=\"10.5\" fill=\"var(--muted)\">(Observer)</text>\n  </g>\n  <g stroke=\"var(--muted)\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#arObsSig)\">\n   <path d=\"M300,70 L165,158\"/>\n   <path d=\"M360,70 L495,158\"/>\n  </g>\n  <g font-size=\"10\" fill=\"var(--muted)\" text-anchor=\"middle\">\n   <text x=\"205\" y=\"120\">notifica cambio stato</text>\n   <text x=\"470\" y=\"120\">notifica cambio stato</text>\n  </g>\n</svg>\n<figcaption style=\"font-size:12px;color:var(--muted);margin-top:4px\">Pattern Observer su Signal: la Segnalazione (il Soggetto) tiene una lista di osservatori (Utente, Amministratore) e, quando cambia stato, li notifica tutti automaticamente — senza dover conoscere in anticipo chi sono.</figcaption>\n</figure>\n\n## Dal problema all'architettura (cenno al flusso del corso)\n\nCome si arriva da un requisito a un'architettura fatta di moduli e pattern? Il percorso del corso, in sintesi:\n\n1. Dai **casi d'uso** (le funzionalità richieste, es. *Effettua Segnalazione*, *Prendi in carico*, *Ricerca* su Signal) ricavi le **classi e i moduli** che servono: è il **modello statico**, la fotografia delle scatole del sistema e delle loro relazioni.\n2. Descrivi le **interazioni** tra quelle classi — chi chiama chi, in che ordine, per realizzare ciascun caso d'uso: è il **modello dinamico**, il \"film\" di come collaborano nel tempo.\n3. Su questa struttura **applichi i principi**: alta coesione e basso accoppiamento, e i cinque principi SOLID, per tenerla sana.\n4. **Riconosci dove un pattern risolve un problema** ricorrente (es. Observer per le notifiche di cambio stato) e lo applichi — dove serve davvero, non a forza.\n\nIl passaggio requisiti → classi/interazioni è approfondito in `se-analysis`; le viste e gli stili architetturali del sistema in `se-arch`.\n\n## Errori comuni\n\n- **Over-engineering (troppa ingegnerizzazione).** Infilare design pattern ovunque \"perché fa figo\" o \"perché si è visto a lezione\". I pattern **risolvono problemi**: se il problema non c'è, il pattern aggiunge solo complessità inutile (uno dei code smell visti sopra). Prima il problema, poi — semmai — il pattern.\n- **Accoppiamento forte.** Moduli che si conoscono troppo e dipendono l'uno dall'altro nei dettagli: cambi uno e crolla tutto (rigidità e fragilità). Punta al basso accoppiamento, dipendi da astrazioni (DIP).\n- **Classi-Dio (God class).** Un'unica classe enorme che fa tutto — cerca, notifica, salva, valida. Viola l'**SRP** (ha mille motivi per cambiare) ed è per definizione poco coesa. Spezzala in classi con una responsabilità ciascuna.\n- **Ottimizzare prima di aver capito il design.** Mettersi a limare le prestazioni di un pezzo quando la struttura non è ancora chiara: ottimizzi cose che magari butterai, e complichi il codice. Prima un design pulito e corretto, poi — se e dove serve, misurando — l'ottimizzazione.\n\n## Fonti\n\n- **\"Design Patterns: Elements of Reusable Object-Oriented Software\"** (1994) — Erich **Gamma**, Richard **Helm**, Ralph **Johnson**, John **Vlissides** (i **Gang of Four**): il catalogo originale dei 23 pattern nelle tre famiglie (creazionali, strutturali, comportamentali).\n- **Robert C. Martin** — *\"Clean Architecture\"* e *\"Agile Software Development: Principles, Patterns, and Practices\"*: la formulazione dei principi **SOLID** e dei sintomi del cattivo design (rigidità, fragilità, immobilità).\n- **refactoring.guru** — catalogo dei design pattern illustrato, con spiegazioni ed esempi visivi per ciascun pattern.\n\n## Concetti adiacenti\n\n- **se-patterns** — approfondimento sui singoli design pattern GoF, uno per uno con struttura e casi d'uso.\n- **se-arch** — le viste architetturali e gli stili (a livelli, a componenti) in cui i principi di questa lezione prendono forma nel sistema.\n- **xc-swe-clean** — clean code e clean architecture nella pratica quotidiana da software engineer: naming, funzioni piccole, confini tra strati.\n- **prog-oop** — le basi della programmazione a oggetti (classi, ereditarietà, interfacce, polimorfismo) su cui poggiano SOLID e i pattern.", "quiz": [{"q": "Cosa sono **coesione** e **accoppiamento**, e qual è la **regola d'oro** della progettazione?", "a": "La **coesione** misura quanto le cose *dentro* un modulo sono legate a un unico scopo: alta coesione = il modulo fa **una cosa sola, ben definita**. L'**accoppiamento** misura quanto un modulo **dipende** dagli altri: basso accoppiamento = i moduli si conoscono poco e possono cambiare senza costringere gli altri a cambiare. La **regola d'oro** è **alta coesione + basso accoppiamento**."}, {"q": "Cos'è la **modularità** e a cosa serve nel domare la complessità?", "a": "La **modularità** è dividere il sistema in **parti** più piccole e trattabili invece di un unico blocco monolitico, così ogni parte si può capire, testare e modificare da sola. Serve a domare la **complessità**, che altrimenti rende il sistema ingovernabile."}, {"q": "Elenca e spiega i **tre sintomi** del cattivo design secondo Robert Martin.", "a": "**Rigidità**: il software è difficile da modificare perché ogni cambiamento ne tira dietro altri a catena. **Fragilità**: modificare un punto **rompe** cose in punti lontani e non correlati. **Immobilità**: non riesci a **riusare** un pezzo in un altro progetto perché è troppo intrecciato col resto."}, {"q": "Cosa vuol dire l'acronimo **SOLID** e chi lo ha formulato?", "a": "**SOLID** è un acronimo che raccoglie **cinque principi di progettazione orientata agli oggetti** (una lettera per principio), formulati e resi popolari da **Robert C. Martin** (\"Uncle Bob\"). Servono a combattere i tre sintomi del cattivo design."}, {"q": "Spiega la **S** e la **O** di SOLID (nome per esteso e significato), con un esempio per la O.", "a": "**S — Single Responsibility Principle (SRP)**, principio di responsabilità singola: una classe deve avere **una sola responsabilità**, cioè un solo motivo per cambiare. **O — Open/Closed Principle (OCP)**, principio aperto/chiuso: aperto all'**estensione**, chiuso alla **modifica** — aggiungi comportamenti senza toccare il codice esistente. Esempio: una nuova **categoria di segnalazione** su Signal si aggiunge senza riscrivere il cuore del sistema."}, {"q": "Spiega la **D** di SOLID (nome per esteso e significato).", "a": "**D — Dependency Inversion Principle (DIP)**, principio di inversione delle dipendenze: dipendi da **astrazioni** (interfacce), non da **implementazioni concrete**. Il modulo di alto livello non conosce i dettagli di quello di basso livello: entrambi si appoggiano a un'interfaccia condivisa, così puoi sostituire l'implementazione concreta senza toccare chi la usa."}, {"q": "Cos'è un **design pattern** e chi sono i **GoF**? A cosa si riferisce l'acronimo?", "a": "Un **design pattern** è una **soluzione riutilizzabile a un problema ricorrente** di progettazione a oggetti: non codice pronto, ma uno **schema** da adattare. I **GoF (Gang of Four)** sono i **quattro autori** del libro *\"Design Patterns\"* (1994): Gamma, Helm, Johnson, Vlissides. L'acronimo GoF significa \"banda dei quattro\"."}, {"q": "Quali sono le **tre famiglie** di design pattern e cosa distingue ciascuna? Fai un esempio per famiglia.", "a": "**Creazionali**: come si **creano** gli oggetti (es. Singleton, Factory Method). **Strutturali**: come si **compongono** classi e oggetti (es. Adapter, Facade). **Comportamentali**: come le classi **interagiscono** a runtime (es. Observer, Strategy)."}, {"q": "Cosa fa il pattern **Observer**? Spiegalo con l'esempio di Signal.", "a": "L'**Observer** fa sì che quando un oggetto **cambia stato** notifichi **automaticamente** tutti gli oggetti registrati come suoi \"osservatori\", senza doverli conoscere uno per uno. Su Signal: quando una **segnalazione cambia stato** (es. viene presa in carico), notifica automaticamente chi la segue — l'utente che l'ha inviata e l'amministratore."}, {"q": "Cos'è l'**over-engineering** e perché è un errore?", "a": "L'**over-engineering** è infilare design pattern (o astrazioni) ovunque \"perché fa figo\", anche dove non servono. È un errore perché i pattern **risolvono problemi**: se il problema non c'è, il pattern aggiunge solo **complessità inutile**. Prima il problema, poi eventualmente il pattern."}]}, {"day": 13, "topic_id": "os-processes", "title": "Sistemi Operativi — processi, thread e concorrenza", "course": "Sistemi Operativi", "area": "computer-science", "adjacent": ["os-scheduling", "os-concurrency", "xc-sysdesign"], "body": "# Sistemi Operativi — processi, thread e concorrenza\n\n> **Perché oggi:** il **sistema operativo (SO)** è ciò su cui gira *ogni* tua app — dal backend Node al database. Capire **processi**, **thread** e **concorrenza** ti serve per tre cose molto concrete: scrivere un backend che regge più richieste insieme, evitare bug subdoli (le **race condition**, che in produzione fanno perdere soldi veri), e rispondere ai colloqui di sistemi senza andare nel panico. È materia \"vecchia\" ma è il cuore pratico di tutto il resto.\n\n## Cos'è un sistema operativo (in 4 righe)\n\nUn **sistema operativo (SO)** è il software che **gestisce le risorse della macchina** — CPU, memoria, dischi, dispositivi — e fa da **intermediario tra l'hardware e i tuoi programmi**. Tre termini che useremo:\n\n- **Kernel** = il \"nocciolo\" del SO, la parte sempre in memoria che ha il controllo diretto dell'hardware (decide chi usa la CPU, chi accede alla memoria, ecc.).\n- **System call (chiamata di sistema)** = il modo in cui un programma **chiede un servizio al kernel** (aprire un file, creare un processo, mandare dati in rete). Il tuo codice non tocca l'hardware da solo: passa sempre dal kernel via system call.\n- **Modalità utente vs modalità kernel** = due \"livelli di privilegio\" della CPU. Il tuo programma gira in **modalità utente** (limitata, non può toccare l'hardware direttamente); quando fa una system call, la CPU passa in **modalità kernel** (privilegiata) per eseguire l'operazione sensibile, poi torna indietro. È una barriera di sicurezza: un'app che va in crash non porta giù la macchina.\n\n## Processo\n\nUn **processo** è un **programma in esecuzione**. Attenzione alla distinzione: il *programma* è un file inerte su disco; il *processo* è quel programma **caricato in memoria e in corso di esecuzione**, con le sue risorse. Ogni processo ha un suo **spazio di memoria isolato**, cioè un'area di memoria che gli altri processi **non possono leggere né scrivere** (isolamento = sicurezza + robustezza). Quello spazio è diviso in quattro parti:\n\n- **Codice (text)** = le istruzioni del programma.\n- **Dati** = le variabili globali/statiche.\n- **Heap** = la memoria allocata dinamicamente a runtime (es. `malloc` in C, `new` altrove); cresce quando chiedi memoria.\n- **Stack** = la pila delle chiamate a funzione: parametri, variabili locali, indirizzi di ritorno. Cresce e si restringe man mano che entri ed esci dalle funzioni.\n\n**PCB (Process Control Block).** Per gestire un processo, il SO tiene una struttura dati che lo descrive: il **PCB (Process Control Block)**, letteralmente \"blocco di controllo del processo\". Dentro ci sono: il **PID (Process IDentifier)** cioè il numero identificativo del processo, lo **stato** corrente, il **program counter** (a quale istruzione è arrivato), il contenuto dei **registri** della CPU, informazioni sulla memoria e sui file aperti. Il PCB è ciò che permette al SO di **sospendere e riprendere** un processo senza perdere nulla.\n\n**Stati del processo.** Nel suo ciclo di vita un processo attraversa questi stati:\n\n- **new** = appena creato, il SO lo sta preparando.\n- **ready** (\"pronto\") = ha tutto per girare e **aspetta solo la CPU**. Sta in una coda insieme agli altri pronti.\n- **running** (\"in esecuzione\") = sta usando la CPU **ora**. Su un singolo core, un solo processo è running alla volta.\n- **waiting / blocked** (\"in attesa / bloccato\") = **non può proseguire** perché aspetta un evento esterno, tipicamente un'operazione di **I/O (Input/Output)**, cioè lettura/scrittura da disco o rete. Non spreca CPU mentre aspetta.\n- **terminated** (\"terminato\") = ha finito (o è stato ucciso); il SO recupera le sue risorse.\n\nCosa fa cambiare stato: da **ready → running** ci pensa lo **scheduler** (la parte del SO che sceglie *chi* far girare — approfondimento in `os-scheduling`); da **running → ready** succede quando scade il suo turno di CPU (**preemption**, \"prelazione\": il SO lo mette in pausa per dare spazio a un altro); da **running → waiting** quando il processo fa I/O o chiede una risorsa non disponibile; da **waiting → ready** quando l'evento atteso arriva (il dato dal disco è pronto) — nota che **non** torna diretto a running, si rimette in coda.\n\n**Context switch (cambio di contesto).** Quando la CPU passa dal processo A al processo B, il SO deve **salvare lo stato di A** (registri, program counter → nel PCB di A) e **caricare lo stato di B** (dal PCB di B). Questa operazione si chiama **context switch** e **ha un costo**: durante lo switch la CPU non fa lavoro utile, e in più si \"sporcano\" le cache. È lavoro puro di gestione (overhead). Tienilo a mente: fare *troppi* switch (troppi processi/thread che si contendono pochi core) fa **perdere prestazioni**.\n\n<figure style=\"margin:18px 0;text-align:center\">\n<svg viewBox=\"0 0 640 320\" style=\"max-width:100%;height:auto;font-family:inherit\">\n  <defs><marker id=\"arOs13\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.4\"/></marker></defs>\n  <g font-size=\"12.5\" fill=\"var(--ink)\" text-anchor=\"middle\">\n   <rect x=\"250\" y=\"14\" width=\"140\" height=\"40\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"320\" y=\"39\">new</text>\n   <rect x=\"40\" y=\"130\" width=\"150\" height=\"44\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/><text x=\"115\" y=\"157\">ready (pronto)</text>\n   <rect x=\"450\" y=\"130\" width=\"150\" height=\"44\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/><text x=\"525\" y=\"157\">running (in CPU)</text>\n   <rect x=\"245\" y=\"256\" width=\"150\" height=\"44\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"320\" y=\"283\">waiting (bloccato)</text>\n   <rect x=\"450\" y=\"256\" width=\"150\" height=\"44\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"525\" y=\"283\">terminated</text>\n  </g>\n  <g font-size=\"11\" fill=\"var(--muted)\" text-anchor=\"middle\">\n   <text x=\"230\" y=\"86\">ammesso</text>\n   <text x=\"300\" y=\"145\">dispatch (scheduler)</text>\n   <text x=\"345\" y=\"205\">scade il turno</text>\n   <text x=\"460\" y=\"212\">I/O / attesa</text>\n   <text x=\"175\" y=\"240\">evento pronto</text>\n   <text x=\"600\" y=\"215\">exit</text>\n  </g>\n  <g stroke=\"var(--muted)\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#arOs13)\">\n   <path d=\"M270,54 C200,80 150,100 120,128\"/>\n   <path d=\"M192,145 L448,145\"/>\n   <path d=\"M448,163 L192,163\"/>\n   <path d=\"M500,174 C470,215 430,240 396,262\"/>\n   <path d=\"M245,266 C170,240 140,210 118,176\"/>\n   <path d=\"M525,174 L525,254\"/>\n  </g>\n</svg>\n<figcaption style=\"font-size:12px;color:var(--muted);margin-top:4px\">Diagramma degli stati del processo: ready ⇄ running (lo scheduler assegna la CPU, la prelazione la toglie), running → waiting su I/O, waiting → ready quando l'evento è pronto (si rimette in coda, non torna diretto a running), running → terminated all'uscita.</figcaption>\n</figure>\n\n## Thread\n\nUn **thread** (letteralmente \"filo\") è un **singolo flusso di esecuzione dentro un processo**. Un processo può avere un solo thread (il caso classico) oppure **più thread** che avanzano ciascuno per conto suo *ma dentro lo stesso processo*.\n\nLa differenza chiave sta in **cosa si condivide**. Più thread dello stesso processo **condividono**:\n\n- il **codice**,\n- i **dati** (variabili globali),\n- lo **heap** (la memoria allocata dinamicamente),\n- i file aperti.\n\nMa **ogni thread ha il suo stack** (le sue chiamate a funzione, le sue variabili locali) e i suoi registri/program counter. In una riga: **memoria condivisa, esecuzione separata**.\n\n**Processo vs thread — la tabella mentale:**\n\n| | Processo | Thread |\n|---|---|---|\n| **Memoria** | spazio **isolato** (nessuno vede quello degli altri) | **condivisa** con gli altri thread del processo (tranne lo stack) |\n| **Comunicazione** | complessa: serve **IPC (Inter-Process Communication)**, cioè meccanismi appositi (pipe, socket, memoria condivisa) | semplice: basta leggere/scrivere le stesse variabili |\n| **Costo di creazione** | alto (nuovo spazio di memoria) | basso (riusa quello del processo) |\n| **Costo di context switch** | alto | più basso (meno roba da cambiare) |\n| **Robustezza** | un crash **non** tocca gli altri processi | un thread che corrompe la memoria condivisa **può** rompere tutto il processo |\n\n**Multithreading** = usare più thread nello stesso processo. A cosa serve:\n\n1. **Parallelismo**: su una CPU **multi-core** thread diversi possono girare *davvero contemporaneamente* su core diversi → il lavoro finisce prima.\n2. **Non bloccare su I/O**: mentre un thread è **waiting** su un'operazione lenta (leggere dal disco, aspettare una risposta di rete), un altro thread dello stesso processo può continuare a lavorare. È il motivo pratico numero uno nei backend: mentre servi una richiesta che aspetta il database, ne servi altre.\n\n**Cenno — thread a livello utente vs kernel.** I thread **a livello kernel** sono conosciuti e schedulati dal SO (il kernel sa che esistono e li mette lui sui core). I thread **a livello utente** sono gestiti da una libreria dentro il processo, senza che il kernel li veda: sono leggerissimi da creare, ma se **uno** si blocca su una system call rischia di **bloccare tutti** perché il kernel vede un solo thread. I sistemi reali spesso combinano i due (modelli \"molti-a-molti\"). Ti basta sapere che esiste la distinzione.\n\n## Concorrenza e il problema della sincronizzazione\n\n**Concorrenza** = più flussi di esecuzione (thread o processi) che **avanzano \"insieme\"**. \"Insieme\" può voler dire *interleaved* — si alternano a piccoli pezzi sullo stesso core, dando l'illusione della simultaneità — oppure *paralleli* — davvero contemporanei su core diversi. In entrambi i casi il problema è lo stesso.\n\n**Il problema.** Finché ogni thread lavora sui *suoi* dati, tutto bene. I guai iniziano quando **due o più thread toccano lo stesso dato condiviso**. L'ordine con cui i loro passi si intrecciano è **imprevedibile** (lo decide lo scheduler, momento per momento), e alcuni intrecci producono un risultato **sbagliato**. Questo si chiama **race condition** (letteralmente \"condizione di corsa\"): il risultato **dipende dall'ordine di esecuzione**, che tu non controlli.\n\n**Esempio concreto — due thread incrementano lo stesso saldo.** Immagina una variabile condivisa `saldo = 100`. Due thread eseguono `saldo = saldo + 50`. Ti aspetti `200`. Ma quell'istruzione **non è atomica**: la CPU la esegue in **tre passi separati** — *leggi* il valore dalla memoria, *modifica* (aggiungi 50), *scrivi* il risultato indietro (in inglese: **read-modify-write**). Ora guarda un intreccio sfortunato:\n\n```\nsaldo = 100\n\nThread A: legge saldo → 100\nThread B: legge saldo → 100      (A non ha ancora scritto!)\nThread A: calcola 100 + 50 = 150\nThread B: calcola 100 + 50 = 150\nThread A: scrive saldo = 150\nThread B: scrive saldo = 150      (sovrascrive A)\n\nsaldo finale = 150   ← SBAGLIATO, doveva essere 200\n```\n\nUn incremento è **sparito**. Perché? Perché B ha letto il valore **prima** che A finisse di scriverlo: la sequenza leggi-modifica-scrivi dei due si è **intrecciata**. Questo è il tipico bug che **non si vede quasi mai in test** (di solito i passi non si intrecciano male) e poi **esplode in produzione** sotto carico. È esattamente il genere di bug su cui ti interrogano ai colloqui.\n\nDue definizioni per parlarne con precisione:\n\n- **Sezione critica (critical section)** = il **pezzo di codice che accede al dato condiviso** (nell'esempio: le tre operazioni su `saldo`). È la zona \"pericolosa\".\n- **Mutua esclusione (mutual exclusion)** = la garanzia che **un solo thread alla volta** possa trovarsi nella sezione critica. Se la ottieni, la race condition sparisce: B è costretto ad aspettare che A abbia finito *tutta* la sequenza leggi-modifica-scrivi prima di iniziare la sua.\n\n## Gli strumenti di sincronizzazione\n\nOttenere la mutua esclusione è il lavoro degli **strumenti di sincronizzazione**. Dal più basso al più alto livello:\n\n- **Lock / mutex.** Un **mutex** (da *MUTual EXclusion*) è una \"serratura\": prima di entrare nella sezione critica fai `lock()` (acquisisci la serratura), quando esci fai `unlock()` (la rilasci). Se un secondo thread prova a fare `lock()` mentre è già presa, **si ferma e aspetta** finché non viene rilasciata. Così solo uno è dentro alla volta. Regola d'oro: **prendi il lock prima, rilascialo sempre dopo** (anche in caso di errore), altrimenti gli altri restano fuori per sempre.\n\n- **Semaforo (semaphore).** Un **contatore** gestito dal SO che regola **quanti thread possono passare**. Ha due operazioni: `wait` (o `P`) **decrementa** il contatore, e se va sotto zero il thread si blocca; `signal` (o `V`) **incrementa** e sveglia un thread in attesa. Due sapori: **binario** (contatore 0/1 → si comporta come un mutex, uno alla volta) e **contatore** (valore N → permette fino a N thread insieme, utile per limitare l'accesso a una risorsa con N \"posti\", es. un pool di 10 connessioni al database). Differenza pratica col mutex: il mutex ha di solito un \"proprietario\" (chi lo prende lo rilascia), il semaforo no ed è più generale (serve anche a **coordinare** thread, non solo a proteggere dati).\n\n- **Monitor.** Un costrutto di **livello più alto** che **incapsula insieme** i dati condivisi **e** la mutua esclusione: tutti i metodi del monitor sono automaticamente in mutua esclusione, quindi non devi ricordarti tu di prendere/rilasciare il lock a mano. L'esempio che conosci: in **Java** la parola chiave **`synchronized`** su un metodo/blocco fa proprio questo — garantisce che un solo thread alla volta esegua quel codice sull'oggetto. Il monitor è \"più difficile sbagliarlo\" perché la serratura è integrata nel costrutto.\n\n**Cenno — deadlock (stallo).** Attento all'effetto collaterale dei lock: due thread possono bloccarsi **a vicenda per sempre**. Classico: A tiene il lock 1 e vuole il lock 2; B tiene il lock 2 e vuole il lock 1. Nessuno dei due molla, nessuno dei due avanza → **deadlock**. È un problema serio con condizioni e soluzioni proprie: lo approfondisci in `os-deadlock`.\n\n## Concorrenza vs parallelismo\n\nSono spesso confusi, ma **non** sono la stessa cosa — e alle interviste lo chiedono apposta.\n\n- **Concorrenza** = **gestire più cose che avanzano** nello stesso periodo di tempo. Riguarda la **struttura** del programma. Puoi avere concorrenza **anche su un solo core**: i thread si **alternano** a piccoli pezzi (interleaving) e sembrano procedere insieme, ma in ogni istante ne gira uno solo.\n- **Parallelismo** = **eseguire davvero più cose nello stesso istante**. Riguarda l'**esecuzione** e richiede **hardware con più core** (o più macchine): al tempo T, due istruzioni girano *contemporaneamente*.\n\nSlogan da ricordare (Rob Pike): *\"la concorrenza è occuparsi di molte cose insieme, il parallelismo è farle insieme\"*. Un programma può essere concorrente ma non parallelo (un core, thread che si alternano), parallelo grazie alla concorrenza (più core), o nessuno dei due. La race condition è un problema della **concorrenza**: esiste anche su un solo core, perché basta che i passi di due thread si **intreccino** male.\n\n## Perché conta nel tuo lavoro (il ponte)\n\nQui tutto diventa pratico. Un **web server** deve servire **tante richieste insieme**, e lo fa scegliendo un modello di concorrenza:\n\n- **thread/processi per richiesta** (es. server Java, PHP-FPM): ogni richiesta ha il suo thread; semplice da ragionare, ma migliaia di thread costano in memoria e context switch;\n- **modello asincrono / event loop** (es. Node.js, Nginx): **un solo thread** che non si blocca mai su I/O — quando un'operazione lenta parte, il thread passa a un'altra richiesta e verrà richiamato quando l'I/O è pronto. Regge tantissime connessioni con poca memoria.\n\nLe **race condition** sono **bug reali in produzione**: due richieste che aggiornano lo stesso record, due processi che scrivono lo stesso contatore. Compaiono solo sotto carico, sono difficili da riprodurre, e possono corrompere dati (o soldi).\n\nEd ecco il collegamento più importante per i colloqui di system design: è **il motivo per cui i server web si tengono stateless**. **Stateless** = il server **non conserva stato dell'utente in memoria tra una richiesta e l'altra**. Perché? Perché con più server (o più thread/processi) lo stato in memoria locale sarebbe (a) **perso** se quel server cade o se la richiesta successiva finisce su un altro, e (b) una fonte di **race condition** difficili. La soluzione: **lo stato va in uno store condiviso** (un database, o una cache come Redis) che gestisce lui la concorrenza. Così ogni server è intercambiabile e scali semplicemente aggiungendone altri (aggancio a `xc-sysdesign`).\n\nInfine, la programmazione **async/await** che usi ogni giorno **nasce da qui**: è un modo di scrivere codice concorrente *senza bloccare* il thread mentre aspetti l'I/O, leggibile come se fosse sequenziale. Sotto sotto è l'event loop di cui sopra.\n\n## Notable use cases\n\n- **Node.js** — **single-thread + event loop**. Il tuo codice JavaScript gira su **un solo thread**, quindi **non hai race condition** sulle variabili JS (due pezzi di codice non girano mai davvero insieme). Il prezzo: non devi **bloccare** quel thread (un calcolo lungo e sincrono congela tutto il server); usi **callback / promise / async-await** per l'I/O. Le operazioni pesanti vere le delega a un pool di thread interno.\n- **Database e transazioni** — i DB usano **lock** per proteggere i dati quando più transazioni li toccano insieme, garantendo che il risultato sia come se fossero eseguite una alla volta (è la \"I\" di **ACID**, *Isolation*). È mutua esclusione applicata ai dati persistenti.\n- **Browser multi-processo** — i browser moderni mettono **ogni scheda in un processo separato**: se una pagina va in crash o è compromessa, l'**isolamento tra processi** impedisce che porti giù le altre schede o il browser. Esattamente il vantaggio del processo (memoria isolata) di cui abbiamo parlato.\n\n## Fonti\n\n- **A. Silberschatz, P. Galvin, G. Gagne — *Operating System Concepts*** (il \"dinosauro\", per la copertina): il testo di riferimento classico su processi, thread e sincronizzazione.\n- **A. Tanenbaum — *Modern Operating Systems***: altro riferimento storico, molto chiaro sui concetti di base.\n- **OSTEP — *Operating Systems: Three Easy Pieces*** (Arpaci-Dusseau), **gratuito online su ostep.org**: la parte \"Concurrency\" spiega thread, lock e race condition in modo asciutto e pratico.\n\n## Concetti adiacenti\n\n- **os-scheduling** — *come* il SO sceglie quale processo/thread mandare in CPU tra i \"ready\" (algoritmi: round-robin, priorità, ecc.).\n- **os-concurrency** — approfondimento sui pattern e i problemi classici di sincronizzazione (produttore-consumatore, lettori-scrittori).\n- **os-deadlock** — quando i thread si bloccano a vicenda per sempre: condizioni necessarie, prevenzione, rilevamento.\n- **xc-sysdesign** — come le regole di concorrenza (stateless, store condiviso, scale-out) diventano scelte di architettura per sistemi che reggono la scala.", "quiz": [{"q": "Qual è la differenza tra un **programma** e un **processo**?", "a": "Il **programma** è un file inerte su disco (le istruzioni); il **processo** è quel programma **caricato in memoria e in esecuzione**, con il suo spazio di memoria isolato (codice, dati, heap, stack) e le sue risorse. Programma = statico; processo = programma \"vivo\"."}, {"q": "Cosa **condividono** i thread dello stesso processo, e cosa invece ha **ciascun thread per sé**?", "a": "**Condividono**: codice, dati (variabili globali), **heap** e file aperti. **Per sé** ogni thread ha il proprio **stack** (variabili locali, chiamate a funzione) e i propri registri/program counter. In breve: memoria condivisa, esecuzione separata."}, {"q": "Elenca gli **stati del processo** e di' cosa fa passare un processo da **running** a **waiting**.", "a": "Stati: **new, ready, running, waiting/blocked, terminated**. Da **running → waiting** si passa quando il processo deve **aspettare un evento esterno**, tipicamente un'operazione di **I/O** (lettura/scrittura da disco o rete) o una risorsa non disponibile: non può proseguire, quindi lascia la CPU e non la spreca mentre aspetta."}, {"q": "Cos'è un **context switch** e perché ha un **costo**?", "a": "Un **context switch** è il passaggio della CPU da un processo/thread a un altro: il SO **salva lo stato** del primo (registri, program counter nel PCB) e **carica lo stato** del secondo. Ha un **costo** perché durante lo switch la CPU non fa lavoro utile ed è puro overhead di gestione (in più si \"sporcano\" le cache); troppi switch fanno perdere prestazioni."}, {"q": "Cos'è una **race condition** e *perché* nasce nell'esempio dei due thread che incrementano lo stesso saldo?", "a": "Una **race condition** è una situazione in cui il **risultato dipende dall'ordine imprevedibile** con cui si intrecciano le esecuzioni di più thread sullo **stesso dato condiviso**. Nell'esempio del saldo nasce perché `saldo = saldo + 50` **non è atomica**: è una sequenza **leggi-modifica-scrivi** in tre passi. Se il thread B **legge** il saldo *prima* che A abbia **scritto** il suo risultato, entrambi partono da 100, calcolano 150 e scrivono 150: un incremento va perso (risultato 150 invece di 200)."}, {"q": "Definisci **sezione critica** e **mutua esclusione**.", "a": "**Sezione critica** = il pezzo di codice che **accede al dato condiviso** (la zona pericolosa). **Mutua esclusione** = la garanzia che **un solo thread alla volta** stia nella sezione critica; ottenendola, la race condition sparisce."}, {"q": "Che differenza c'è tra un **mutex** e un **semaforo** (binario vs contatore)?", "a": "Un **mutex** è una serratura per la mutua esclusione: `lock` prima della sezione critica, `unlock` dopo; di solito ha un \"proprietario\" (chi lo prende lo rilascia), uno alla volta. Un **semaforo** è un **contatore** gestito dal SO (`wait`/`P` decrementa e può bloccare, `signal`/`V` incrementa e sveglia): **binario** (0/1, si comporta come un mutex, uno alla volta) o **contatore** (valore N, permette fino a **N** thread insieme, es. un pool di N connessioni). Il semaforo è più generale e serve anche a **coordinare** thread, non solo a proteggere un dato."}, {"q": "Cos'è un **monitor** e quale costrutto Java lo realizza?", "a": "Un **monitor** è un costrutto di alto livello che **incapsula insieme dati condivisi e mutua esclusione**: i suoi metodi sono automaticamente in mutua esclusione, così non gestisci il lock a mano. In **Java** lo realizza la parola chiave **`synchronized`** (un solo thread alla volta esegue il blocco/metodo sull'oggetto)."}, {"q": "**Concorrenza** e **parallelismo**: che differenza c'è? Può esserci concorrenza su un solo core?", "a": "**Concorrenza** = gestire più flussi che **avanzano** nello stesso periodo (struttura del programma); **parallelismo** = eseguirli **davvero nello stesso istante** (richiede più core/macchine). **Sì**, c'è concorrenza anche su un solo core: i thread si **alternano** a piccoli pezzi (interleaving) e in ogni istante ne gira uno solo, ma \"avanzano insieme\". Ecco perché la race condition esiste anche su un solo core."}, {"q": "Perché i server web si tengono **stateless** e dove va messo lo stato?", "a": "Perché con **più server** (o più thread/processi) lo stato tenuto in **memoria locale** verrebbe **perso** se quel server cade o se la richiesta successiva finisce su un altro server, e sarebbe fonte di **race condition**. Tenendo i server **stateless** (senza stato dell'utente in memoria tra le richieste) ogni server è **intercambiabile** e si scala aggiungendone altri. Lo **stato va in uno store condiviso** — un database o una cache tipo Redis — che gestisce lui la concorrenza."}]}, {"day": 14, "topic_id": "net-stack", "title": "Reti — il modello a livelli e lo stack TCP/IP", "course": "Reti di Calcolatori", "area": "computer-science", "adjacent": ["net-transport", "net-app", "xc-sysdesign"], "body": "# Reti — il modello a livelli e lo stack TCP/IP\n\n> **Perché oggi:** ogni chiamata API, ogni pagina web, ogni chatbot che fai a Glacom viaggia su questa pila. Non è teoria da libro: capire lo stack è ciò che ti fa **debuggare** la latenza che si mangia i secondi, i **timeout** che fanno fallire una richiesta, gli **errori TLS** che bloccano una connessione o un **DNS** che non risolve. Ed è la spina dorsale delle domande da colloquio di reti e di **system design** — su tutte la classica \"cosa succede quando digiti un indirizzo nel browser e premi invio?\".\n\n## Perché \"a livelli\"\n\nFar comunicare due computer in rete è un problema enorme: bisogna trasformare dei dati in segnali elettrici o onde radio, farli attraversare cavi e router, ritrovare la strada giusta, rimettere in ordine i pezzi arrivati, e infine capire cosa significano per l'applicazione. Tutto insieme è ingestibile.\n\nLa soluzione è l'**incapsulamento a livelli** (in inglese *layering*): dividere la comunicazione in **strati sovrapposti**, ognuno con **un compito preciso**. Ogni livello si appoggia al servizio del livello sotto e offre un servizio al livello sopra, e — idea chiave — **parla logicamente col suo pari** dall'altra parte della connessione: il livello di trasporto del tuo computer \"dialoga\" col livello di trasporto del server, come se gli altri livelli non esistessero.\n\nIl vantaggio è la **modularità**: puoi **cambiare un livello senza toccare gli altri**. Passi dal Wi-Fi al cavo Ethernet (cambia il livello più basso) e il tuo browser non se ne accorge nemmeno; nasce un nuovo protocollo applicativo e non devi reinventare come i dati attraversano Internet. Ogni strato è una scatola con un'interfaccia chiara, e questo rende Internet estensibile e riparabile a pezzi.\n\n**Incapsulamento** (*encapsulation*): mentre i dati **scendono** la pila, ogni livello **aggiunge la sua \"busta\"** attorno ai dati che riceve dal livello sopra. Questa busta si chiama **header** (intestazione): un pacchetto di informazioni di servizio (indirizzi, numeri di porta, numeri di sequenza…) che serve **solo a quel livello** per fare il suo lavoro. Dall'altra parte, mentre i dati **risalgono** la pila, ogni livello **apre la sua busta**, legge il suo header, lo toglie e passa il contenuto al livello sopra. È come spedire una lettera: la metti in una busta (applicazione), la busta va in un sacco postale (trasporto), il sacco su un camion con una destinazione (rete): ogni contenitore ha l'etichetta che serve a chi lo maneggia in quel momento.\n\n## ISO/OSI vs TCP/IP\n\nEsistono due modi di descrivere questa pila, e li devi conoscere entrambi perché ai colloqui li citano.\n\nIl modello **ISO/OSI** (dove **ISO** = *International Organization for Standardization*, l'ente di standardizzazione, e **OSI** = *Open Systems Interconnection*, \"interconnessione di sistemi aperti\") è il **riferimento teorico**: descrive la comunicazione in **7 livelli**, dal basso verso l'alto — **fisico** (i bit come segnali su un mezzo), **data link** (collegamento tra due nodi adiacenti), **rete** (instradamento tra reti diverse), **trasporto** (comunicazione affidabile tra due processi), **sessione** (gestione di una \"sessione\" di dialogo), **presentazione** (formato/codifica/cifratura dei dati), **applicazione** (i protocolli usati dalle app). È pulito e didattico, ma **nessuno lo implementa alla lettera**.\n\nIl modello **TCP/IP** è quello **realmente usato da Internet**. **TCP/IP = Transmission Control Protocol / Internet Protocol**, i due protocolli-cardine da cui prende il nome. Ha **4-5 livelli** (a seconda di come si conta): **accesso alla rete** (*network access*, che accorpa il fisico e il data link di OSI), **internet** (l'instradamento tra reti, dove vive IP), **trasporto** (dove vivono TCP e UDP) e **applicazione** (che accorpa sessione, presentazione e applicazione di OSI).\n\nLa corrispondenza, a grandi linee: il **trasporto** e il livello **rete/internet** coincidono quasi uno a uno tra i due modelli; sopra, i tre livelli alti di OSI (sessione, presentazione, applicazione) sono tutti schiacciati nell'unico livello **applicazione** di TCP/IP; sotto, i due livelli bassi di OSI (fisico, data link) diventano l'unico livello **accesso alla rete**. In pratica: **OSI è la mappa concettuale, TCP/IP è il territorio.**\n\n## La pila TCP/IP in un colpo d'occhio\n\n<figure style=\"margin:18px 0;text-align:center\">\n<svg viewBox=\"0 0 600 360\" style=\"max-width:100%;height:auto;font-family:inherit\">\n  <defs><marker id=\"arNetStack\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.4\"/></marker></defs>\n  <g font-size=\"13\" fill=\"var(--ink)\" text-anchor=\"middle\">\n   <rect x=\"90\" y=\"20\" width=\"360\" height=\"58\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.8\"/>\n   <text x=\"270\" y=\"44\" font-weight=\"600\">Applicazione</text>\n   <text x=\"270\" y=\"63\" font-size=\"10.5\" fill=\"var(--muted)\">HTTP · DNS · TLS — unità dati: messaggi</text>\n\n   <rect x=\"90\" y=\"98\" width=\"360\" height=\"58\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.8\"/>\n   <text x=\"270\" y=\"122\" font-weight=\"600\">Trasporto</text>\n   <text x=\"270\" y=\"141\" font-size=\"10.5\" fill=\"var(--muted)\">TCP · UDP — unità dati: segmenti</text>\n\n   <rect x=\"90\" y=\"176\" width=\"360\" height=\"58\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.8\"/>\n   <text x=\"270\" y=\"200\" font-weight=\"600\">Internet (Rete)</text>\n   <text x=\"270\" y=\"219\" font-size=\"10.5\" fill=\"var(--muted)\">IP — unità dati: pacchetti</text>\n\n   <rect x=\"90\" y=\"254\" width=\"360\" height=\"58\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.8\"/>\n   <text x=\"270\" y=\"278\" font-weight=\"600\">Accesso alla rete</text>\n   <text x=\"270\" y=\"297\" font-size=\"10.5\" fill=\"var(--muted)\">Ethernet · Wi-Fi — unità dati: frame</text>\n  </g>\n  <g stroke=\"var(--muted)\" stroke-width=\"1.5\" fill=\"none\">\n   <path d=\"M478,40 L478,300\" marker-end=\"url(#arNetStack)\"/>\n  </g>\n  <g font-size=\"10.5\" fill=\"var(--muted)\" text-anchor=\"middle\">\n   <text x=\"510\" y=\"150\" transform=\"rotate(90 510 170)\">i dati scendono: ogni livello aggiunge il suo header</text>\n   <text x=\"42\" y=\"150\" transform=\"rotate(-90 42 170)\">i dati risalgono: ogni livello toglie il suo header</text>\n  </g>\n</svg>\n<figcaption style=\"font-size:12px;color:var(--muted);margin-top:4px\">La pila TCP/IP. In uscita i dati scendono e ogni livello aggiunge la sua \"busta\" (header): messaggi → segmenti → pacchetti → frame. In arrivo risalgono e ogni livello toglie la sua busta. Il nome dell'unità dati cambia a ogni livello.</figcaption>\n</figure>\n\n## Livello di rete/Internet: IP\n\n**IP (Internet Protocol)** è il protocollo che tiene insieme Internet: si occupa di **indirizzamento** e **instradamento** dei dati tra reti diverse. La sua unità dati è il **pacchetto** (*packet*).\n\n- **Indirizzamento.** Ogni interfaccia di rete ha un **indirizzo IP**, un numero che la identifica univocamente sulla rete — l'equivalente di un indirizzo di casa a cui recapitare i pacchetti. Esistono due versioni: **IPv4** (*Internet Protocol version 4*), con indirizzi a 32 bit scritti come quattro numeri puntati (es. `93.184.216.34`), ormai **quasi esauriti** perché sono \"solo\" circa 4 miliardi; e **IPv6** (*version 6*), con indirizzi a 128 bit (es. `2606:2800:220:1:...`), uno spazio praticamente illimitato, pensato proprio per superare l'esaurimento di IPv4.\n- **Instradamento (routing).** Portare un pacchetto dal mittente al destinatario significa fargli attraversare, di rete in rete, una catena di apparati. Un **router** è il dispositivo che sta al confine tra reti diverse e, per ogni pacchetto, **decide su quale strada inoltrarlo** verso la destinazione, leggendone l'indirizzo IP di arrivo. È lo \"smistatore\" del traffico: il pacchetto salta da un router al successivo (*hop* dopo *hop*) finché arriva.\n- **Best-effort.** IP è un servizio **best-effort** (\"al meglio possibile\"): fa del suo meglio per consegnare i pacchetti, ma **non garantisce nulla**. Un pacchetto può **perdersi**, arrivare **duplicato**, o arrivare **fuori ordine** rispetto a come è partito. IP non se ne preoccupa: se serve affidabilità, la mette sopra il livello di trasporto (lo vediamo tra poco). Questa scelta — un livello di rete semplice e \"stupido\", l'intelligenza ai bordi — è ciò che rende Internet scalabile.\n\n(Il **subnetting**, cioè dividere un grande spazio di indirizzi in sottoreti più piccole, è il modo in cui si organizzano gli indirizzi IP dentro un'organizzazione. Qui basta sapere che esiste: nella pratica lo incontri quando configuri reti o cloud, ma i calcoli con le maschere di sottorete non ci servono adesso.)\n\n## Livello di trasporto: TCP vs UDP\n\nIl livello di trasporto sta **sopra** IP e ne compensa i limiti. Il suo compito: portare i dati **dal processo giusto sul mittente al processo giusto sul destinatario**. Per questo introduce il concetto di **porta**.\n\n**Porta** (*port*): un numero che **identifica l'applicazione (il processo) su un host**. L'indirizzo IP ti porta al computer giusto; la **porta** ti dice, dentro quel computer, **a quale programma** consegnare i dati. Convenzioni note: la **80** è HTTP, la **443** è HTTPS, la **53** è il DNS. Coppia (indirizzo IP + porta) = *socket*, l'estremo di una comunicazione.\n\nSu questo livello convivono due protocolli con filosofie opposte.\n\n**TCP (Transmission Control Protocol)** è **orientato alla connessione** e **affidabile**. \"Orientato alla connessione\" significa che prima di scambiare dati si stabilisce un canale tra i due estremi; \"affidabile\" significa che **garantisce** che i dati arrivino **tutti, integri e nell'ordine giusto**. Come? Numera i pezzi, si fa confermare ciò che arriva (**ACK**, *acknowledgment*, \"conferma di ricezione\"), **ritrasmette** i pezzi persi e **rimette in ordine** quelli arrivati scombinati. In più fa **controllo di flusso** (non manda più dati di quanti il ricevente riesca a gestire) e **controllo di congestione** (rallenta se la rete è intasata, per non peggiorare la situazione). La sua unità dati è il **segmento**.\n\nIl canale TCP si apre con il **three-way handshake** (\"stretta di mano a tre vie\"), tre messaggi che sincronizzano i due estremi:\n\n1. **SYN** — il client manda un segmento con il flag **SYN** (*synchronize*): \"voglio aprire una connessione, ecco il mio numero di sequenza iniziale\".\n2. **SYN-ACK** — il server risponde con **SYN + ACK**: \"ok, accetto (SYN mio), e confermo il tuo (ACK)\".\n3. **ACK** — il client conferma a sua volta con **ACK**: \"ricevuto, connessione aperta\".\n\nDopo questi tre messaggi la connessione è stabilita e i dati possono fluire. Nota bene: è un **giro di andata e ritorno** (*round-trip*) speso **prima** ancora di mandare il primo byte di dati utili — e questo costa tempo, come vedremo nella sezione sulla latenza.\n\n**UDP (User Datagram Protocol)** è l'opposto: **senza connessione** e **non affidabile**. Niente handshake, niente numeri di sequenza, niente ritrasmissioni, niente conferme: spara i suoi pacchetti (chiamati **datagrammi**) e **non si preoccupa** se arrivano, se arrivano in ordine o se si perdono. In cambio è **veloce e leggero**: zero tempo perso a stabilire connessioni, zero peso di controllo.\n\n**Quando l'uno, quando l'altro:**\n\n- **TCP** quando ti serve che **tutto arrivi giusto**: pagine **web** (HTTP/HTTPS), trasferimento di **file**, email. Meglio un attimo più lento ma corretto.\n- **UDP** quando la **velocità conta più della perfezione** e perdere qualche pezzo è tollerabile: **streaming** video/audio (meglio saltare un fotogramma che bloccare tutto per ritrasmetterlo), **gaming** online (conta l'ultima posizione, non recuperare quella vecchia), **DNS** (una domanda-risposta minuscola, non vale la pena aprire una connessione TCP), e le **videochiamate**.\n\n## Livello applicativo: HTTP, DNS, TLS\n\nÈ il livello che le tue applicazioni usano direttamente. Tre protocolli su tutti.\n\n**HTTP (HyperText Transfer Protocol)** è il **protocollo del web**. Funziona a **richiesta/risposta** (*request/response*): il **client** (il browser) manda una **richiesta** (es. \"dammi la pagina `/prodotti`\") e il **server** risponde con una **risposta** (il contenuto, più un **codice di stato** — 200 \"ok\", 404 \"non trovato\", 500 \"errore del server\"). HTTP è **stateless** (\"senza stato\"): ogni richiesta è **indipendente** dalle altre, il server **non ricorda** di per sé le richieste precedenti. Per ricordare chi sei tra una richiesta e l'altra (login, carrello) servono meccanismi sopra HTTP, come i **cookie** o i **token**.\n\n**DNS (Domain Name System)** è la **\"rubrica di Internet\"**: **traduce un nome in un indirizzo IP**. Tu digiti `www.glacom.ai`, ma i router sanno instradare solo verso **numeri** (indirizzi IP): il DNS fa la **risoluzione** nome → IP, cioè ti dice a quale indirizzo numerico corrisponde quel nome. Come cercare un contatto nella rubrica del telefono: conosci il nome, ti serve il numero. Senza DNS dovresti ricordare a memoria gli indirizzi IP di ogni sito.\n\n**TLS (Transport Layer Security)** è il protocollo che **cifra la connessione**. È la **\"s\" di HTTPS** (*HTTP Secure*): HTTPS non è altro che HTTP fatto viaggiare **dentro** un canale TLS. TLS fa tre cose: **cifratura** (chi intercetta il traffico vede solo dati illeggibili), **integrità** (garantisce che i dati non siano stati alterati per strada) e **autenticazione** (tramite i **certificati**, ti assicura che il server sia davvero chi dice di essere, non un impostore). Anche TLS, come TCP, stabilisce il canale con un suo **handshake** (scambio di chiavi e certificato) prima che i dati veri possano passare. *(TLS è l'evoluzione del vecchio **SSL**, Secure Sockets Layer, oggi deprecato: per questo a volte si dice ancora \"certificato SSL\".)*\n\nCome si incastrano: quando visiti un sito sicuro, **DNS** trova l'indirizzo, **TCP** apre il canale, **TLS** lo cifra, e dentro quel canale cifrato viaggiano le richieste **HTTP**.\n\n## Cosa succede quando apri un sito (il viaggio di una richiesta)\n\nQuesto è **l'esempio d'oro** da saper raccontare a un colloquio. Digiti `https://www.glacom.ai` e premi invio. Ecco il viaggio, passo per passo:\n\n1. **DNS — trovare l'indirizzo.** Il browser non sa dove sia `www.glacom.ai`. Fa una query **DNS** che **risolve il nome nell'indirizzo IP** del server (es. `93.184.216.34`). Ora sa a quale numero bussare.\n2. **TCP — aprire la connessione.** Il browser apre una connessione **TCP** verso quell'IP sulla **porta 443** (HTTPS), con il **three-way handshake** (SYN → SYN-ACK → ACK). Un round-trip speso qui.\n3. **TLS — cifrare il canale.** Sopra la connessione TCP appena aperta parte l'**handshake TLS**: si scambiano il **certificato** (il browser verifica che il server sia autentico) e le chiavi per **cifrare**. Da qui in poi il canale è sicuro.\n4. **HTTP — mandare la richiesta.** Dentro il canale cifrato il browser manda la **richiesta HTTP**: \"GET `/`\", cioè \"dammi la home page\".\n5. **Giù e su per la pila (incapsulamento).** La richiesta **scende la pila** sul tuo computer: il messaggio HTTP diventa un **segmento** TCP (header con le porte), poi un **pacchetto** IP (header con gli indirizzi), poi un **frame** a livello di accesso alla rete. I pacchetti IP **viaggiano** attraverso i router di Internet (best-effort, hop dopo hop) fino al server. Lì **risalgono la pila**: ogni livello toglie il suo header finché il server ritrova la richiesta HTTP originale.\n6. **La risposta torna indietro.** Il server elabora la richiesta e manda la **risposta HTTP** (la pagina, con codice **200**), che rifà lo stesso viaggio a ritroso: scende la pila del server, attraversa la rete, risale la pila del tuo computer, e il browser finalmente **mostra la pagina**.\n\nIl filo da tenere in mente: **DNS → TCP → TLS → HTTP**, con l'incapsulamento che avvolge e svolge i dati a ogni salto di livello.\n\n## Il ponte col lavoro\n\nPerché tutto questo conta quando scrivi codice a Glacom, e non solo al colloquio:\n\n- **Latenza e round-trip.** Hai visto che aprire una connessione costa **giri di andata e ritorno** (*round-trip*): uno per il TCP handshake, altri per il TLS handshake. Se ogni chiamata API riaprisse la connessione da zero, sprecheresti quei round-trip **ogni volta**. Per questo si **riusano le connessioni**: il **keep-alive** (tenere aperta la connessione TCP per più richieste), **HTTP/2** (che multiplexa più richieste su un'unica connessione) e le connessioni persistenti. Meno handshake = meno latenza = app più reattiva.\n- **Timeout e retry.** Poiché IP è **best-effort** e la rete può perdere pacchetti o rispondere lenta, ogni chiamata di rete può **non tornare in tempo**. Nel codice imposti un **timeout** (dopo quanti secondi rinunciare) e una politica di **retry** (riprovare, magari con attesa crescente). Capire lo stack ti dice **cosa** può andare storto: un timeout in fase di connessione è diverso da uno in fase di risposta.\n- **Debug di errori reali.** Un **errore TLS** (\"certificato scaduto/non valido\") è un problema del passo 3 del viaggio, non del tuo codice applicativo. Un **DNS che non risolve** (\"host not found\") è il passo 1: il nome non si traduce in IP, e non hai nemmeno provato a connetterti. Sapere a quale livello sta il problema **dimezza il tempo di debug**.\n- **Le fondamenta di WebSocket e CDN.** I **WebSocket** sono una **connessione persistente** bidirezionale (aperta una volta sopra TCP, resta viva per scambiare messaggi nei due sensi in tempo reale, senza rifare la richiesta ogni volta) — utili per chat e notifiche live. Le **CDN (Content Delivery Network)** sono reti di server distribuiti geograficamente: ti servono i contenuti dal nodo **più vicino a te**, accorciando il percorso di rete e quindi la **latenza**. Entrambe sono ottimizzazioni che hanno senso solo se hai in testa lo stack.\n\nTutto questo si collega a `xc-sysdesign`: quando progetti un sistema, le decisioni su connessioni, latenza, CDN e protocolli sono esattamente il livello di ragionamento che ti chiedono in un colloquio di **system design**.\n\n## Notable use cases\n\n- **HTTPS ovunque (TLS di default).** Oggi il web è quasi tutto in HTTPS: i browser marcano come \"non sicuro\" un sito in HTTP puro, e certificati gratuiti (es. **Let's Encrypt**) hanno reso TLS lo standard di fatto per qualunque sito, non solo per le banche.\n- **DNS gestito.** Poche aziende gestiscono i propri server DNS a mano: si usano servizi **DNS gestiti** (come **Cloudflare** o **Amazon Route 53**) che offrono risoluzione veloce, affidabile e distribuita nel mondo.\n- **QUIC e HTTP/3 su UDP.** La frontiera recente: **QUIC** è un protocollo di trasporto costruito **sopra UDP** (non TCP) che integra al suo interno la cifratura e riduce i round-trip iniziali, e **HTTP/3** è la versione di HTTP che ci gira sopra. Curiosità che chiude il cerchio: proprio perché a lungo si è detto \"UDP = inaffidabile, TCP = web\", vedere il web moderno spostarsi **su UDP** per **ridurre la latenza** mostra che l'affidabilità si può ricostruire a un livello più alto, dove costa meno.\n\n## Fonti\n\n- **Kurose & Ross, \"Computer Networking: A Top-Down Approach\"** — il libro di riferimento, quello che parte \"dall'alto\" (dalle applicazioni) e scende: perfetto per capire lo stack nell'ordine in cui lo incontri nella pratica.\n- **Tanenbaum, \"Computer Networks\"** — il classico complementare, con la trattazione approfondita dei livelli più bassi e dei fondamenti.\n- **MDN Web Docs** (developer.mozilla.org) — il riferimento pratico e sempre aggiornato per **HTTP**: metodi, codici di stato, header, HTTPS.\n\n## Concetti adiacenti\n\n- **net-transport** — approfondimento sul livello di trasporto: TCP nel dettaglio (finestre, controllo di flusso e congestione, chiusura della connessione) e confronto pieno con UDP.\n- **net-app** — il livello applicativo in profondità: HTTP (metodi, header, versioni 1.1/2/3), DNS come sistema gerarchico, cookie e sessioni.\n- **net-ip** — il livello di rete nel dettaglio: struttura degli indirizzi IPv4/IPv6, subnetting, tabelle di instradamento e come lavorano davvero i router.\n- **xc-sysdesign** — dove questi mattoni (latenza, connessioni persistenti, CDN, protocolli) diventano decisioni di architettura nei colloqui di system design.", "quiz": [{"q": "Perché la comunicazione di rete è organizzata **a livelli**? Qual è il vantaggio principale?", "a": "Perché far comunicare due computer è un problema troppo grande per essere affrontato tutto insieme: dividendolo in **livelli**, ognuno ha **un compito preciso** e parla logicamente col suo pari dall'altra parte. Il vantaggio principale è la **modularità**: puoi **cambiare un livello senza toccare gli altri** (es. passare da Wi-Fi a Ethernet senza che il browser se ne accorga)."}, {"q": "Cos'è l'**incapsulamento** e cosa succede ai dati mentre scendono e risalgono la pila?", "a": "L'**incapsulamento** è il meccanismo per cui, mentre i dati **scendono** la pila, ogni livello **aggiunge la sua \"busta\"** (l'**header**, l'intestazione con le info di servizio che servono a quel livello) attorno ai dati del livello sopra. Mentre i dati **risalgono** la pila dall'altra parte, ogni livello **toglie** il suo header e passa il contenuto al livello superiore."}, {"q": "Che differenza c'è tra il modello **ISO/OSI** e il modello **TCP/IP**? Cosa significano le sigle?", "a": "**ISO/OSI** (ISO = *International Organization for Standardization*, OSI = *Open Systems Interconnection*) è il **riferimento teorico** a **7 livelli** (fisico, data link, rete, trasporto, sessione, presentazione, applicazione). **TCP/IP** (*Transmission Control Protocol / Internet Protocol*) è il modello **realmente usato da Internet**, a **4-5 livelli** (accesso alla rete, internet, trasporto, applicazione). In OSI i tre livelli alti diventano l'unico \"applicazione\" di TCP/IP, e i due bassi diventano \"accesso alla rete\"."}, {"q": "Cosa fa il protocollo **IP** e cosa significa che è **best-effort**?", "a": "**IP (Internet Protocol)** si occupa di **indirizzamento** (ogni host ha un **indirizzo IP**) e **instradamento** (i **router** decidono su quale strada inoltrare i **pacchetti** verso la destinazione) tra reti diverse. **Best-effort** significa che IP **fa del suo meglio ma non garantisce nulla**: un pacchetto può perdersi, duplicarsi o arrivare fuori ordine. L'affidabilità, se serve, la aggiunge il livello di trasporto sopra."}, {"q": "Elenca le differenze principali tra **TCP** e **UDP**, con un esempio d'uso per ciascuno.", "a": "**TCP** è orientato alla connessione e **affidabile**: garantisce che i dati arrivino tutti, integri e in ordine (numera, conferma con ACK, ritrasmette i persi, riordina), con controllo di flusso e congestione; ma è più \"pesante\". **UDP** è senza connessione e **non affidabile**: niente handshake né ritrasmissioni, quindi veloce e leggero. Esempi: **TCP** per web e trasferimento file; **UDP** per streaming, gaming, DNS e videochiamate."}, {"q": "Spiega il **three-way handshake** di TCP, passo per passo.", "a": "Il **three-way handshake** apre una connessione TCP con tre messaggi: (1) **SYN** — il client chiede di aprire la connessione (*synchronize*); (2) **SYN-ACK** — il server accetta (SYN suo) e conferma (**ACK**, *acknowledgment*, conferma di ricezione) quello del client; (3) **ACK** — il client conferma a sua volta. Dopo i tre messaggi la connessione è stabilita. È un round-trip speso **prima** di inviare dati utili."}, {"q": "A cosa serve il **DNS**?", "a": "Il **DNS (Domain Name System)** è la \"**rubrica di Internet**\": **traduce un nome** (es. `www.glacom.ai`) **nel corrispondente indirizzo IP** numerico. Serve perché i router instradano solo verso indirizzi IP, mentre gli umani ricordano i nomi."}, {"q": "Cosa fa **TLS** e con cosa è collegato in \"HTTPS\"?", "a": "**TLS (Transport Layer Security)** **cifra la connessione**: garantisce **cifratura** (traffico illeggibile a chi intercetta), **integrità** (dati non alterati) e **autenticazione** del server (tramite **certificati**). È la \"**s**\" di **HTTPS**: HTTPS è HTTP fatto viaggiare dentro un canale TLS. (Evoluzione del vecchio SSL.)"}, {"q": "Cos'è una **porta** e a cosa serve, dato che c'è già l'indirizzo IP?", "a": "Una **porta** è un numero che **identifica l'applicazione (il processo) su un host**. Serve perché l'indirizzo IP ti porta al **computer** giusto, ma dentro quel computer girano tanti programmi: la porta dice **a quale** consegnare i dati (es. 80 = HTTP, 443 = HTTPS, 53 = DNS)."}, {"q": "Racconta il **viaggio di una richiesta web** quando apri un sito HTTPS, nell'ordine corretto.", "a": "Aprendo `https://...`: (1) **DNS** risolve il nome nell'**indirizzo IP** del server; (2) **TCP** apre la connessione con il **three-way handshake** (sulla porta 443); (3) **TLS** cifra il canale con il suo handshake (scambio di certificato e chiavi); (4) **HTTP** manda la **richiesta** (es. GET `/`); (5) i dati **scendono la pila** (incapsulamento: messaggio → segmento → pacchetto → frame), viaggiano come **pacchetti IP** tra i router e **risalgono** la pila dall'altra parte; (6) il server manda la **risposta HTTP**, che rifà il viaggio a ritroso e il browser mostra la pagina."}]}, {"day": 15, "topic_id": "xc-llm-prompting", "title": "Prompting — zero/few-shot, chain-of-thought, structured output", "course": "LLM / AI Engineering", "area": "cross-cutting", "adjacent": ["xc-llm-fundamentals", "xc-llm-rag", "xc-llm-eval"], "body": "# Prompting — tecniche pratiche\n\n> **Perché oggi:** il prompt è l'interfaccia di programmazione dell'LLM. Non hai un compilatore né un'API tipizzata: hai un testo, e da come lo scrivi dipende se il modello fa ciò che vuoi o improvvisa. A Glacom la differenza tra un bot che sbaglia categoria a un ticket e uno affidabile è spessissimo *solo il prompt* — non un modello diverso, non più dati. È la skill più economica ad alto impatto che hai: non costa GPU, non costa un fine-tuning, costa solo scrivere bene e misurare. Oggi metti in fila le tecniche vere (zero/few-shot, chain-of-thought, structured output) e i pattern/anti-pattern che separano un prompt da demo da uno da produzione.\n\n## System, user, assistant: l'anatomia di una conversazione\n\nQuando parli con un LLM via API, la conversazione è una **lista di messaggi**, e ogni messaggio ha un **ruolo**. I ruoli sono tre:\n\n- **system** (messaggio di sistema): le **istruzioni di fondo** — identità del modello, regole di comportamento, formato richiesto, cosa può e non può fare. Sta all'inizio e **persiste** per tutta la conversazione: vale per ogni turno, non solo per il primo. È qui che scrivi \"sei un assistente per il triage dei ticket; rispondi solo in italiano; se mancano dati, chiedili\".\n- **user** (messaggio dell'utente): l'**input** di chi usa il sistema — la domanda, il testo da classificare, il comando. È ciò che cambia a ogni turno.\n- **assistant** (messaggio dell'assistente): le **risposte del modello**. Nella cronologia della conversazione i turni passati del modello restano come messaggi `assistant`, così il modello \"ricorda\" cosa ha già detto.\n\n**Perché mettere le regole nel system prompt** e non nel messaggio user? Tre motivi pratici: (1) le regole così **non si mescolano** con l'input dell'utente, quindi restano stabili anche quando l'utente scrive cose strane; (2) i modelli sono addestrati a dare al system prompt un **peso maggiore** come istruzione autorevole, mentre il testo dell'utente è trattato più come \"dato\"; (3) separare regole (system) da dati (user) è anche una **difesa** contro chi prova a dirottare le istruzioni scrivendole nell'input (ci torniamo con la *prompt injection*).\n\nUn cenno importante: sotto il cofano il modello **vede tutto come un unico contesto** — system, user e assistant vengono concatenati in un'unica sequenza di token che il modello legge insieme. I ruoli sono etichette che orientano il modello e ricevono pesi diversi, ma non sono \"canali\" isolati e blindati: sono parti dello stesso testo. Per questo la separazione dei ruoli aiuta ma **non è una barriera di sicurezza assoluta**.\n\n## Zero-shot vs few-shot\n\nSono i due modi base di impostare un compito, e si distinguono per **quanti esempi** metti nel prompt.\n\n- **Zero-shot** (\"zero esempi\"): chiedi il compito **senza mostrare esempi**. Descrivi cosa vuoi e basta. Esempio: *\"Classifica questo ticket in una di queste categorie: fatturazione, tecnico, commerciale. Ticket: '...'\"*. Funziona bene quando il compito è chiaro e comune (riassumi, traduci, classifica in categorie ovvie): il modello ha già visto milioni di casi simili in addestramento.\n- **Few-shot** (\"pochi esempi\"): metti nel prompt **qualche esempio** completo di input→output prima della domanda vera. Esempio: due o tre ticket già classificati (con la categoria giusta), *poi* il ticket da classificare. Il modello **impara il formato e lo stile dagli esempi** e li imita sul caso nuovo.\n\nQuesto \"imparare dagli esempi nel prompt, senza riaddestrare il modello\" ha un nome: **in-context learning** (apprendimento nel contesto). Definizione: il modello **adatta il proprio comportamento in base a ciò che vede nel prompt** — esempi, formato, tono — al momento dell'inferenza, senza che i suoi pesi vengano modificati. Non è addestramento (i pesi restano identici): è il modello che, leggendo gli esempi, capisce lo schema e lo continua. Chiuso il prompt, \"dimentica\" tutto: l'apprendimento vale solo per quella chiamata.\n\n**Quando servono i few-shot:**\n\n- **Formati particolari o non ovvi**: se vuoi un output con una struttura precisa (un certo JSON, un certo modo di etichettare), mostrarne 2-3 esempi è più efficace di descriverlo a parole.\n- **Compiti ambigui o sottili**: quando \"cosa conta come categoria X\" non è banale, gli esempi disambiguano meglio di una definizione (es. dove finisce \"tecnico\" e inizia \"commerciale\").\n- **Stile/tono specifici**: vuoi risposte scritte in un certo modo → mostragliene alcune.\n\n**Come sceglierli**: usa esempi **rappresentativi** dei casi reali, **bilanciati** tra le categorie (non tutti della stessa classe, o il modello impara a rispondere sempre quella), e **corretti** (un esempio sbagliato insegna lo sbaglio). Meglio pochi esempi buoni e vari che tanti tutti simili. Costo: ogni esempio occupa token nel prompt, quindi few-shot costa più di zero-shot — usalo quando serve davvero.\n\n## Chain-of-thought (CoT)\n\n**Chain-of-thought** (catena di ragionamento) = chiedere al modello di **ragionare passo-passo prima di dare la risposta finale**, invece di sparare subito il risultato. In pratica gli dici \"ragiona per gradi\", \"spiega il tuo ragionamento\", \"mostra i passaggi\" — e il modello scrive prima i passi intermedi, poi conclude.\n\nPerché aiuta: molti errori nascono quando il modello prova a produrre la risposta \"in un colpo solo\" su un problema che richiede più passaggi. Scrivendo i passi intermedi, il modello **usa il proprio output come sp
