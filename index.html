a con cui un programma chiama un altro servizio.\n\n## Da LLM ad agente\n\nUn **LLM \"puro\"** fa una sola cosa: **testo → testo**. Gli dai un prompt, lui restituisce una risposta. Non naviga il web, non legge un database, non esegue codice: sa solo *predire testo* sulla base di ciò che ha in ingresso (il **contesto**, cioè tutto il testo che gli passi in quel momento). Se gli chiedi \"che tempo fa a Torino ora?\", inventa o si arrende: non ha modo di *guardare*.\n\nUn **agente** è un LLM messo in un **loop** (ciclo) in cui può:\n1. **usare strumenti (tool)** — cioè chiamare funzioni esterne per *agire* sul mondo (cercare sul web, interrogare un DB, chiamare un'API), e\n2. **decidere le prossime azioni** da solo, passo dopo passo, per raggiungere un **obiettivo**.\n\nDue definizioni che useremo di continuo:\n\n- **Tool use / function calling** (\"uso di strumenti\" / \"chiamata di funzione\"): il meccanismo per cui l'LLM, invece di rispondere in prosa, produce una **chiamata strutturata a una funzione esterna** — es. `cerca_web(query=\"meteo Torino\")`, `query_db(sql=...)`, `chiama_API(...)`. Il tuo programma **esegue** davvero quella funzione, prende il **risultato** e lo **rimette nel contesto** dell'LLM. A quel punto il modello \"vede\" il risultato reale e continua. Nota il punto chiave: **l'LLM non esegue niente da sé** — decide *quale* funzione chiamare e *con quali argomenti*; a eseguirla è il codice attorno (il \"runtime\" dell'agente).\n- **Agency / autonomia**: il grado in cui l'agente decide **da solo** i passi successivi invece di seguire uno script fisso. Più agency = più libertà (e più potenza), ma anche più imprevedibilità e più costo. Non è un interruttore acceso/spento: è una manopola.\n\n<figure style=\"margin:18px 0;text-align:center\">\n<svg viewBox=\"0 0 660 300\" style=\"max-width:100%;height:auto;font-family:inherit\">\n  <defs><marker id=\"arReact\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.4\"/></marker></defs>\n  <g font-size=\"12.5\" fill=\"var(--ink)\" text-anchor=\"middle\">\n   <rect x=\"250\" y=\"12\" width=\"160\" height=\"40\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"330\" y=\"36\">Obiettivo</text>\n   <rect x=\"60\" y=\"110\" width=\"150\" height=\"46\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/><text x=\"135\" y=\"130\">Thought</text><text x=\"135\" y=\"146\" font-size=\"10.5\" fill=\"var(--muted)\">(ragiona)</text>\n   <rect x=\"255\" y=\"110\" width=\"150\" height=\"46\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/><text x=\"330\" y=\"130\">Action</text><text x=\"330\" y=\"146\" font-size=\"10.5\" fill=\"var(--muted)\">(sceglie tool)</text>\n   <rect x=\"450\" y=\"110\" width=\"170\" height=\"46\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"535\" y=\"130\">Tool / Ambiente</text><text x=\"535\" y=\"146\" font-size=\"10.5\" fill=\"var(--muted)\">(esegue davvero)</text>\n   <rect x=\"255\" y=\"210\" width=\"150\" height=\"46\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/><text x=\"330\" y=\"230\">Observation</text><text x=\"330\" y=\"246\" font-size=\"10.5\" fill=\"var(--muted)\">(risultato)</text>\n   <rect x=\"470\" y=\"248\" width=\"150\" height=\"40\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"545\" y=\"272\">Risposta finale</text>\n  </g>\n  <g stroke=\"var(--muted)\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#arReact)\">\n   <path d=\"M330,52 L135,108\"/>\n   <path d=\"M210,133 L253,133\"/>\n   <path d=\"M405,133 L448,133\"/>\n   <path d=\"M535,156 L410,225\"/>\n   <path d=\"M255,233 L138,158\"/>\n   <path d=\"M405,233 L468,255\"/>\n  </g>\n  <g font-size=\"10.5\" fill=\"var(--muted)\" text-anchor=\"middle\"><text x=\"205\" y=\"200\">loop: finché non basta</text></g>\n</svg>\n<figcaption style=\"font-size:12px;color:var(--muted);margin-top:4px\">Il loop ReAct: dall'obiettivo si entra nel ciclo Thought → Action → Tool/Ambiente → Observation → (di nuovo) Thought, finché l'agente ha abbastanza per la risposta finale.</figcaption>\n</figure>\n\n## Il loop ReAct\n\n**ReAct = Reasoning + Acting** (\"ragionare + agire\"): è il pattern (schema) di agente proposto da Yao et al. (2022) e diventato lo standard di partenza. L'idea è alternare, **a ogni passo**, un pensiero e un'azione, invece di sparare subito una risposta. Il ciclo ha tre momenti che si ripetono:\n\n- **Thought** (\"pensiero\"): l'LLM scrive **a parole** cosa gli serve fare adesso — es. *\"per rispondere mi serve il meteo attuale, uso il tool cerca_web\"*. È ragionamento **esplicito** (imparentato con la chain-of-thought, sezione Planning).\n- **Action** (\"azione\"): l'LLM emette la **chiamata a un tool** (function calling): quale strumento e con quali argomenti.\n- **Observation** (\"osservazione\"): il **risultato reale** del tool (il testo restituito, i dati, un eventuale errore) torna nel contesto.\n\nPoi si **ripete**: nuovo Thought che *tiene conto dell'Observation appena arrivata*, nuova Action, nuova Observation… finché l'agente giudica di avere abbastanza per dare la **risposta finale** e chiude il loop.\n\n**Perché batte una risposta secca?** Perché l'agente **si corregge con il feedback dell'ambiente**. Un LLM che risponde in un colpo solo può solo \"indovinare bene\". Un agente ReAct, se un tool restituisce un errore o un dato inatteso, lo **vede** nell'Observation e cambia mossa al passo dopo (riprova, usa un altro tool, chiede meno dati). Il ragionamento resta **ancorato a fatti reali** presi dagli strumenti, non solo a ciò che il modello \"ricorda\". Il prezzo è che ogni passo è una chiamata all'LLM: più passi = più costo e più latenza (torna nella sezione rischi).\n\n## I componenti di un agente\n\n### Tool use / function calling\n\nUn **tool** lo definisci con uno **schema** (descrizione strutturata) che dice all'LLM: come si chiama, cosa fa, quali argomenti vuole. In pratica è quasi sempre **JSON = JavaScript Object Notation**, il formato testuale standard per dati strutturati. Esempio di schema di un tool:\n\n```json\n{\n  \"name\": \"cerca_web\",\n  \"description\": \"Cerca sul web e restituisce i primi risultati per una query.\",\n  \"parameters\": {\n    \"type\": \"object\",\n    \"properties\": {\n      \"query\": { \"type\": \"string\", \"description\": \"Il testo da cercare\" }\n    },\n    \"required\": [\"query\"]\n  }\n}\n```\n\nL'LLM legge questa descrizione e, quando serve, produce una chiamata tipo `cerca_web({\"query\": \"meteo Torino oggi\"})`. Esempi tipici di tool: **cerca_web** (informazioni fresche), **query_db** (leggere dal database), **chiama_API** (es. meteo, pagamenti), **esegui_codice** (far girare uno snippet in una sandbox), **leggi_file / scrivi_file**. Regola d'oro: la `description` è **prompt a tutti gli effetti** — se è vaga, l'agente sbaglia strumento.\n\n### Memoria\n\nLa memoria di un agente è su **due orizzonti**:\n\n- **Memoria a breve termine** = il **contesto della conversazione**: la sequenza di messaggi, Thought, Action e Observation del task in corso, tenuta nella **context window** (la finestra di contesto, cioè la quantità massima di testo — misurata in *token*, i pezzetti in cui il modello spezza il testo — che l'LLM può \"vedere\" in una volta). È volatile: finito il task o riempita la finestra, va gestita/tagliata.\n- **Memoria a lungo termine** = uno **store esterno** da cui l'agente **recupera** informazioni tra sessioni diverse: preferenze dell'utente, fatti appresi, documenti. Tipicamente un **VectorDB (database vettoriale)**: un archivio che salva i testi come **embedding** (vettori di numeri che catturano il significato) e permette di ritrovare i più *simili* a una domanda. È esattamente il meccanismo del **RAG = Retrieval-Augmented Generation** (\"generazione aumentata dal recupero\", → `xc-llm-rag`): recuperare i pezzi rilevanti e infilarli nel contesto. La memoria a lungo termine di un agente **è** un RAG sulla sua stessa storia.\n\n### Planning\n\n**Planning** (\"pianificazione\") = **decomporre un obiettivo grande in sotto-task** più piccoli e gestibili, e decidere in che ordine affrontarli. Tre approcci che sentirai nominare:\n\n- **Chain-of-thought (CoT)** (\"catena di pensiero\"): far ragionare il modello **passo-passo a voce** prima di rispondere (\"ragioniamo per gradi…\"). Migliora i compiti che richiedono più passaggi logici. È il \"Thought\" di ReAct.\n- **Plan-and-execute** (\"pianifica-ed-esegui\"): prima l'agente **scrive un piano completo** (lista di passi), poi lo **esegue** un passo alla volta. Più prevedibile e controllabile del decidere tutto al volo.\n- **ReAct**: pianificazione **intrecciata all'azione** — decidi il prossimo passo *dopo* aver visto il risultato del precedente. Più reattivo, ma senza un piano d'insieme rischia di \"girare in tondo\".\n\n### Reflection / self-critique\n\n**Reflection** (\"riflessione\") o **self-critique** (\"auto-critica\") = l'agente **valuta e corregge il proprio output** prima di consegnarlo. In pratica: produce una bozza, poi in un passo successivo si chiede *\"è corretto? manca qualcosa? il codice compila?\"* e, se serve, **rivede**. È come una rilettura critica del proprio compito. Migliora la qualità, ma **costa passi in più** (altre chiamate LLM), quindi va dosata.\n\n## Sistemi multi-agente\n\nPerché usare **più agenti specializzati** invece di uno solo tuttofare? Tre motivi:\n\n- **Separazione delle responsabilità**: ogni agente ha **un** compito chiaro (cercare, scrivere, verificare). Più facile da ragionare, testare e correggere — come dividere un lavoro tra persone con ruoli diversi.\n- **Prompt e tool dedicati**: ogni agente ha il **suo** prompt di sistema e **solo i tool che gli servono**. Un unico mega-prompt con venti strumenti confonde il modello; un agente focalizzato sbaglia meno.\n- **Robustezza**: se un agente specializzato fallisce, l'errore è **localizzato** e più facile da isolare, invece di corrompere un unico enorme ragionamento.\n\nI **pattern** ricorrenti:\n\n- **Orchestrator-worker** (\"coordinatore-lavoratori\"): un agente **orchestratore** riceve l'obiettivo, lo spezza in sotto-task e li **assegna** ad agenti **worker** specializzati; poi **ricompone** i loro risultati nella risposta finale. È il pattern del team con un capo-progetto.\n- **Pipeline / sequenziale**: gli agenti sono in **catena**, l'**output di uno è l'input del successivo** (es. Estrai → Trasforma → Riassumi). Semplice e prevedibile; adatto quando i passi sono fissi e in ordine noto.\n- **Debate / revisione** (\"dibattito/revisione\"): un agente **produce**, un altro **critica** (o due argomentano tesi opposte). Il confronto fa emergere errori che un singolo agente non vedrebbe. È la reflection (sopra) ma svolta da **agenti separati**.\n\n**I rischi — da conoscere e nominare:**\n- **Costo**: più agenti e più passi = **più chiamate LLM** = più soldi e più latenza. Un compito banale può costare 10× senza motivo.\n- **Propagazione degli errori**: in una pipeline, un errore all'inizio si **trascina** e amplifica fino in fondo (\"garbage in, garbage out\").\n- **Loop infiniti**: due agenti (o un agente ReAct) possono rimbalzarsi all'infinito senza convergere.\n\nPer questo servono **limiti e guardrail** (\"barriere di protezione\"): un **max step / max iterazioni** (numero massimo di cicli, oltre il quale si ferma), **timeout** e **budget** di costo, **validazione degli output** (controlli sul formato/contenuto di ciò che un agente passa al successivo) e un **fallback** (piano B) se l'agente non conclude.\n\n<figure style=\"margin:18px 0;text-align:center\">\n<svg viewBox=\"0 0 680 300\" style=\"max-width:100%;height:auto;font-family:inherit\">\n  <defs><marker id=\"arOrch\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.4\"/></marker></defs>\n  <g font-size=\"12.5\" fill=\"var(--ink)\" text-anchor=\"middle\">\n   <rect x=\"40\" y=\"120\" width=\"130\" height=\"56\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"105\" y=\"145\">Obiettivo</text><text x=\"105\" y=\"162\" font-size=\"10.5\" fill=\"var(--muted)\">utente</text>\n   <rect x=\"255\" y=\"118\" width=\"160\" height=\"60\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.9\"/><text x=\"335\" y=\"145\">Orchestrator</text><text x=\"335\" y=\"163\" font-size=\"10.5\" fill=\"var(--muted)\">assegna e ricompone</text>\n   <rect x=\"510\" y=\"18\" width=\"150\" height=\"46\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"585\" y=\"40\">Agente Ricerca</text><text x=\"585\" y=\"55\" font-size=\"10\" fill=\"var(--muted)\">tool: cerca_web</text>\n   <rect x=\"510\" y=\"126\" width=\"150\" height=\"46\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"585\" y=\"148\">Agente Scrittura</text><text x=\"585\" y=\"163\" font-size=\"10\" fill=\"var(--muted)\">tool: —</text>\n   <rect x=\"510\" y=\"234\" width=\"150\" height=\"46\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"585\" y=\"256\">Agente Verifica</text><text x=\"585\" y=\"271\" font-size=\"10\" fill=\"var(--muted)\">critica/valida</text>\n  </g>\n  <g stroke=\"var(--muted)\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#arOrch)\">\n   <path d=\"M170,148 L253,148\"/>\n   <path d=\"M415,140 L508,52\"/>\n   <path d=\"M415,148 L508,149\"/>\n   <path d=\"M415,156 L508,248\"/>\n  </g>\n  <g stroke=\"var(--muted)\" stroke-width=\"1.1\" stroke-dasharray=\"4 3\" fill=\"none\" marker-end=\"url(#arOrch)\">\n   <path d=\"M508,60 L417,138\"/>\n   <path d=\"M508,157 L417,152\"/>\n   <path d=\"M508,242 L417,160\"/>\n  </g>\n  <g font-size=\"10\" fill=\"var(--muted)\" text-anchor=\"middle\"><text x=\"455\" y=\"298\">tratteggiato = risultati che tornano</text></g>\n</svg>\n<figcaption style=\"font-size:12px;color:var(--muted);margin-top:4px\">Pattern orchestrator-worker: l'orchestratore spezza l'obiettivo, lo assegna agli agenti specializzati (Ricerca, Scrittura, Verifica), poi ricompone i risultati (frecce tratteggiate) nella risposta.</figcaption>\n</figure>\n\n## Case study (roba tua)\n\nPer **MaiCare** (la mia startup **FemTech** — tecnologia dedicata alla salute femminile) ho progettato un **team di agenti** con nome interno **\"Paperclip\"**: **ruoli separati** e **orchestrazione**, cioè un modo per far **collaborare più agenti specializzati** su un compito complesso invece di affidarsi a un **unico mega-prompt**. L'idea guida è quella di questa lezione: separare le responsabilità, dare a ciascun agente il suo prompt e i suoi tool, e coordinarli. (Mi fermo qui, onestamente: niente metriche o dettagli tecnici precisi che non posso verificare.)\n\n## Notable use cases / framework reali\n\nFramework e prodotti reali che implementano questi pattern (descrizioni generali, senza dettagli interni inventati):\n\n- **LangGraph** (di LangChain): libreria per costruire agenti come **grafi di stati** — nodi e transizioni espliciti. Utile quando vuoi controllo fine su loop, rami e guardrail.\n- **AutoGen** (Microsoft): framework per **conversazioni tra più agenti** che si scambiano messaggi per risolvere un task (adatto ai pattern debate/orchestrator).\n- **CrewAI**: framework che modella gli agenti come una **\"crew\"** (equipaggio) con **ruoli** e **task** assegnati — molto vicino alla metafora del team.\n- **OpenAI Assistants / Agents SDK**: strumenti di OpenAI per costruire agenti con tool, memoria e orchestrazione gestiti.\n- **Coding agent** (pattern): un agente che **legge il codice, esegue comandi, modifica file e verifica i risultati** in loop — è il caso d'uso oggi più maturo (lo stai usando adesso). Esempi di questa famiglia: Claude Code, ecc.\n\n## Completeness check (integrato da me)\n\n**Quando NON servono gli agenti.** Gli agenti aggiungono **costo** e **imprevedibilità**: non sono gratis. Se il compito si risolve con **una singola chiamata** all'LLM (riassumi questo testo, classifica questo messaggio) o con un **RAG semplice** (recupera i documenti giusti e rispondi), **non mettere un loop di agenti**: aggiungeresti passi, latenza e possibilità di sbagliare senza guadagno. La regola: parti dalla soluzione **più semplice** (prompt secco → RAG → agente singolo → multi-agente) e sali di complessità **solo quando la semplice non basta**. Anthropic lo dice esplicitamente nel suo \"Building effective agents\": usa la potenza minima necessaria.\n\n**La valutazione (aggancio a `xc-llm-eval`).** Un agente è **difficile da valutare** proprio perché non è deterministico e fa più passi: due esecuzioni sullo stesso input possono differire. Servono strumenti dedicati — **task di test** con esito verificabile, controllo dei **passi intermedi** (ha usato i tool giusti?), non solo dell'output finale, e spesso un **LLM-as-judge** (un LLM che valuta la risposta di un altro). Senza valutazione, \"sembra funzionare\" non è \"funziona\": è il tema di `xc-llm-eval`.\n\n## Fonti\n\n- **ReAct: Synergizing Reasoning and Acting in Language Models** — Yao et al., arXiv (arxiv.org/abs/2210.03629): il paper del loop ReAct.\n- **LangGraph — documentazione** — langchain-ai.github.io/langgraph\n- **Building effective agents** — Anthropic (anthropic.com): quando (e quando no) usare agenti, con i pattern.\n- **AutoGen — documentazione** — microsoft.github.io/autogen\n\n## Concetti adiacenti\n\n- `xc-llm-rag` — Retrieval-Augmented Generation: il meccanismo di recupero che alimenta la memoria a lungo termine degli agenti.\n- `xc-llm-eval` — Valutazione di LLM e agenti: come misuri che un sistema non deterministico funzioni davvero.\n- `xc-llm-fundamentals` — Fondamenti degli LLM: token, context window, prompting, su cui poggia tutto il resto.", "quiz": [{"q": "Cosa distingue un **agente** da un **LLM \"puro\"**?", "a": "Un **LLM puro** fa solo **testo → testo** (nessuna azione sul mondo). Un **agente** è un LLM messo in un **loop** in cui può **usare tool** (agire) e **decidere da solo le prossime azioni** per raggiungere un obiettivo."}, {"q": "Cos'è il **function calling / tool use**, e chi *esegue* davvero la funzione: l'LLM o il codice attorno?", "a": "È il meccanismo per cui l'LLM produce una **chiamata strutturata a una funzione esterna** (nome + argomenti, in JSON) invece di rispondere in prosa; il **risultato torna nel contesto**. A **eseguirla è il codice attorno** (il runtime dell'agente), non l'LLM: il modello decide solo *quale* funzione e *con quali argomenti*."}, {"q": "Cosa significa l'acronimo **ReAct** e quali sono i **tre momenti** del suo ciclo?", "a": "**ReAct = Reasoning + Acting** (ragionare + agire). Ciclo: **Thought** (ragiona a parole) → **Action** (sceglie e chiama un tool) → **Observation** (il risultato reale torna nel contesto), ripetuto finché basta."}, {"q": "Perché un agente ReAct **batte** una risposta secca in un colpo solo?", "a": "Perché **si corregge con il feedback dell'ambiente**: se un tool dà errore o un dato inatteso, l'agente lo **vede** nell'Observation e cambia mossa al passo dopo; il ragionamento resta **ancorato a fatti reali**, non solo a ciò che il modello \"ricorda\"."}, {"q": "Differenza tra **memoria a breve termine** e **a lungo termine** di un agente, e con quale altro tema si collega la memoria a lungo termine?", "a": "**Breve termine** = il **contesto della conversazione** in corso (messaggi/Thought/Action/Observation nella context window, volatile). **Lungo termine** = uno **store esterno** (tipicamente un **VectorDB**) da cui l'agente **recupera** info tra sessioni. La memoria a lungo termine si collega al **RAG** (Retrieval-Augmented Generation)."}, {"q": "Descrivi il pattern **orchestrator-worker** in una frase.", "a": "Un agente **orchestratore** spezza l'obiettivo in sotto-task, li **assegna** ad agenti **worker** specializzati e poi **ricompone** i loro risultati nella risposta finale."}, {"q": "Cita **un rischio** dei sistemi multi-agente e **un guardrail** che lo mitiga.", "a": "**Rischio** (uno tra): costo/latenza per le molte chiamate LLM; propagazione degli errori lungo la pipeline; loop infiniti. **Guardrail** corrispondente (uno tra): **max step/iterazioni**, timeout/budget, **validazione degli output**, fallback."}, {"q": "Cos'è la **reflection / self-critique** e qual è il suo costo?", "a": "È l'agente che **valuta e corregge il proprio output** prima di consegnarlo (auto-critica/rilettura). Il **costo** sono **passi/chiamate LLM in più**, quindi va dosata."}, {"q": "**Quando NON** conviene usare un sistema di agenti?", "a": "Quando basta una **singola chiamata** all'LLM (riassumere, classificare) o un **RAG semplice**: lì gli agenti aggiungono solo **costo e imprevedibilità** senza guadagno. Parti dal più semplice e sali di complessità solo se serve."}, {"q": "Cos'è la **context window** e in cosa si misura?", "a": "La **context window** (finestra di contesto) è la **quantità massima di testo che l'LLM può vedere in una volta**; si misura in **token** (i pezzetti in cui il modello spezza il testo)."}]}, {"day": 6, "topic_id": "xc-pm-prioritization", "title": "Product Management — prioritizzazione (RICE, MoSCoW, Kano, value/effort)", "course": "Product Management", "area": "cross-cutting", "adjacent": ["xc-pm-metrics", "xc-pm-discovery", "pm-agile"], "body": "# Product Management — prioritizzazione\n\n> **Perché oggi:** il ruolo di **Technical/Product PM** (Product Manager) è tra i tuoi target, e prioritizzare è letteralmente il lavoro quotidiano di un PM: ogni giorno decidi cosa costruire prima con risorse che non bastano mai. L'hai già fatto scegliendo cosa costruire per progetti come MaiCare/Samec, e questi framework ti danno un linguaggio condiviso e difendibile per farlo davanti a un team e a uno stakeholder (portatore di interesse: chi ha voce in capitolo — capo, cliente, investitore).\n\n## PM in una riga (e perché la priorità è il suo mestiere)\n\nIl **Product Manager (PM)** decide **cosa** costruire e **perché**, non **come**. Il \"come\" — architettura, tecnologie, implementazione — è dell'**engineering** (i team di sviluppo). Il PM sta all'incrocio fra tre mondi: gli **utenti** (di cosa hanno bisogno), il **business** (cosa porta valore all'azienda) e la **tecnologia** (cosa è fattibile). Non comanda nessuno di questi gruppi per gerarchia: guida per influenza, dati e una direzione chiara.\n\nAttenzione a non confondere due ruoli con nomi simili:\n\n- **Product Manager** — è responsabile del **prodotto**: capire il problema giusto, definire la strategia, decidere cosa entra e cosa no, misurare il valore consegnato a utente e business. Ragiona sul \"quale problema risolviamo e vale la pena\".\n- **Project Manager** — è responsabile del **progetto** come esecuzione: **tempi, budget, scope** (l'insieme di lavoro concordato), coordinamento, rischi, scadenze. Ragiona sul \"consegniamo in tempo, nei costi, con la qualità pattuita\". Il suo mondo è quello del ciclo di vita di progetto (collegamento: **pm-lifecycle**).\n\nDue parole chiave che tornano sempre:\n\n- **Discovery** (scoperta) — la fase in cui capisci **il problema giusto** da risolvere: parli con gli utenti, formuli e testi ipotesi, decidi cosa vale la pena costruire. È il \"stiamo costruendo la cosa giusta?\".\n- **Delivery** (consegna) — la fase in cui **costruisci bene** la cosa scelta: sviluppo, test, rilascio. È il \"la stiamo costruendo bene?\".\n\nIl nocciolo del mestiere: **le risorse (persone, tempo, soldi) sono sempre meno delle idee.** Hai sempre più feature candidate di quante puoi realizzarne. Quindi devi scegliere, e devi farlo in modo **trasparente** (chiunque capisce perché) e **difendibile** (regge alla domanda \"perché questa e non quella?\"). I framework qui sotto servono esattamente a questo: trasformare un'opinione in un ragionamento che gli altri possono vedere e discutere.\n\n## Il cuore: i framework di prioritizzazione\n\nNessun framework decide al posto tuo: ti costringe a rendere espliciti i criteri e a confrontare le opzioni sulla stessa scala. Vediamoli uno per uno, con come si calcola e un mini-esempio.\n\n### RICE\n\n**RICE** è un metodo di scoring (assegnazione di un punteggio) che nasce in Intercom. Sta per **Reach, Impact, Confidence, Effort** (Portata, Impatto, Confidenza, Sforzo). La formula:\n\n> **RICE = (Reach × Impact × Confidence) / Effort**\n\nOgni fattore:\n\n- **Reach (Portata)** — quante persone o eventi vengono impattati in un **periodo definito** (es. utenti al mese). Numero concreto, es. 2.000 utenti/mese.\n- **Impact (Impatto)** — quanto la feature muove l'obiettivo **per singola persona**. Si usa una scala qualitativa convertita in numero, tipicamente: 3 = massiccio, 2 = alto, 1 = medio, 0.5 = basso, 0.25 = minimo.\n- **Confidence (Confidenza)** — quanto sei **sicuro** delle tue stime di Reach e Impact, espressa in percentuale: 100% = alta (hai dati), 80% = media, 50% = bassa (è più un'intuizione). Serve a penalizzare le scommesse fondate su poco.\n- **Effort (Sforzo)** — quanto costa realizzarla, di solito in **persona-mese** (il lavoro di una persona per un mese) o persona-settimane. È al denominatore: più costa, più abbassa il punteggio.\n\nIl punteggio finale è un numero astratto (\"impatto per unità di sforzo, pesato dalla confidenza\") che serve **solo a confrontare** feature fra loro.\n\n**Esempio numerico — due feature candidate:**\n\n- **Feature A — \"Login con Google\"**: Reach = 2.000 utenti/mese, Impact = 1 (medio), Confidence = 80% (0.8), Effort = 2 persona-mese.\n  RICE = (2.000 × 1 × 0.8) / 2 = **1.600 / 2 = 800**\n- **Feature B — \"Notifiche push\"**: Reach = 8.000 utenti/mese, Impact = 0.5 (basso), Confidence = 100% (1.0), Effort = 4 persona-mese.\n  RICE = (8.000 × 0.5 × 1.0) / 4 = **4.000 / 4 = 1.000**\n\n**Vince la Feature B (1.000 > 800):** anche se ha impatto per utente più basso, la portata più ampia e la piena confidenza, divise per lo sforzo, la mettono davanti. Questo è il punto di RICE: rende il confronto un numero, non una discussione a colpi di opinioni.\n\n### MoSCoW\n\n**MoSCoW** serve a mettere d'accordo un team sullo **scope di un rilascio** (cosa entra in questa versione). Le maiuscole sono le categorie (le \"o\" minuscole sono solo per rendere pronunciabile la parola):\n\n- **Must have (Deve esserci)** — indispensabile: senza, il rilascio non ha senso o non funziona. Se manca anche solo un \"Must\", il rilascio è fallito.\n- **Should have (Dovrebbe esserci)** — importante ma non vitale: fa male non averlo, ma esiste un modo per cavarsela temporaneamente.\n- **Could have (Potrebbe esserci)** — desiderabile: piacevole averlo, si include solo se avanzano tempo e risorse. È il primo a saltare quando stringono i tempi.\n- **Won't have (this time) (Non ci sarà, per stavolta)** — esplicitamente **escluso da questo rilascio**. Non è \"no per sempre\": è \"non ora\". Metterlo per iscritto evita malintesi con gli stakeholder.\n\nUtilità: è veloce, chiaro e ottimo per allineare le aspettative su cosa aspettarsi da una release.\n\n### Value vs Effort (matrice 2×2)\n\nUn metodo visivo: disegni due assi — **Valore** (verticale) e **Sforzo** (orizzontale) — e collochi ogni idea in uno dei quattro quadranti.\n\n- **Quick wins (Vittorie rapide)** — **alto valore, basso sforzo**. Il quadrante d'oro: fai subito questi.\n- **Big bets (Grandi scommesse)** — **alto valore, alto sforzo**. Valgono, ma richiedono impegno e pianificazione: si affrontano dopo aver validato con qualcosa di più leggero.\n- **Fill-ins (Riempitivi)** — **basso valore, basso sforzo**. Cose da fare nei ritagli, quando c'è tempo libero.\n- **Time sinks / Money pit (Perdite di tempo / Pozzi di soldi)** — **basso valore, alto sforzo**. Da **evitare**: costano molto e rendono poco.\n\n**Regola pratica: parti dai quick wins.** Danno il massimo ritorno con il minimo investimento, e ti fanno guadagnare credibilità e dati per giustificare le big bets.\n\n<figure style=\"margin:18px 0;text-align:center\">\n<svg viewBox=\"0 0 420 360\" style=\"max-width:100%;height:auto;font-family:inherit\">\n  <g font-size=\"12\" fill=\"var(--ink)\" text-anchor=\"middle\">\n   <line x1=\"60\" y1=\"20\" x2=\"60\" y2=\"320\" stroke=\"var(--rule)\" stroke-width=\"1.5\"/>\n   <line x1=\"60\" y1=\"320\" x2=\"400\" y2=\"320\" stroke=\"var(--rule)\" stroke-width=\"1.5\"/>\n   <line x1=\"230\" y1=\"20\" x2=\"230\" y2=\"320\" stroke=\"var(--rule)\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/>\n   <line x1=\"60\" y1=\"170\" x2=\"400\" y2=\"170\" stroke=\"var(--rule)\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/>\n   <text x=\"145\" y=\"100\" fill=\"var(--accent)\">Quick wins</text>\n   <text x=\"315\" y=\"100\">Big bets</text>\n   <text x=\"145\" y=\"250\">Fill-ins</text>\n   <text x=\"315\" y=\"250\" fill=\"var(--muted)\">Time sinks</text>\n   <text x=\"30\" y=\"170\" transform=\"rotate(-90 30 170)\" fill=\"var(--muted)\">Valore →</text>\n   <text x=\"230\" y=\"345\" fill=\"var(--muted)\">Sforzo →</text>\n  </g>\n</svg>\n<figcaption style=\"font-size:12px;color:var(--muted);margin-top:4px\">Matrice valore/sforzo: parti dai quick wins.</figcaption>\n</figure>\n\n### Kano model\n\nIl **Kano model** (dal nome del ricercatore giapponese Noriaki Kano) non ordina le feature per punteggio: le **classifica per tipo di soddisfazione** che generano nell'utente. Tre categorie chiave:\n\n- **Must-be (Basilari / date per scontate)** — l'utente le dà per scontate. Averle non entusiasma nessuno; **non** averle fa arrabbiare. Esempio: il freno in un'auto, il login che funziona. Sono il minimo per stare sul mercato.\n- **Performance (Prestazionali / lineari)** — **più ce n'è, meglio è**. La soddisfazione cresce in proporzione: più velocità, più spazio, meno attese. Esempio: la durata della batteria di un telefono.\n- **Delighters / Exciters (Deliziatori / Entusiasmanti)** — sorprese che l'utente non si aspetta e che lo **deliziano**. La loro assenza non disturba (nessuno le chiedeva), ma la loro presenza crea un \"wow\". Esempio: una funzione geniale che i concorrenti non hanno.\n\nDinamica temporale importante: **col tempo i delighter diventano must-be.** La fotocamera sullo smartphone era un delighter, oggi è un must-be; se manca, il telefono è \"rotto\". Morale per un PM: non puoi vivere di soli delighter, e ciò che oggi stupisce domani sarà preteso.\n\n### WSJF (cenno)\n\n**WSJF** sta per **Weighted Shortest Job First** (letteralmente \"prima il lavoro più breve, pesato\"). Viene da **SAFe** (Scaled Agile Framework, un framework per applicare l'Agile a organizzazioni grandi). La formula:\n\n> **WSJF = Cost of Delay / Job Size**\n\n- **Cost of Delay (Costo del ritardo)** — quanto valore **perdi ogni unità di tempo** in cui NON hai quella feature (valore per l'utente/business, urgenza temporale, riduzione del rischio).\n- **Job Size (Dimensione del lavoro)** — quanto è grande il lavoro (una stima di sforzo/durata).\n\nFai per primo chi ha **WSJF più alto**: cioè chi dà **più valore per unità di tempo**. La logica è: se due cose valgono uguale ma una costa metà, fai prima quella che libera valore più in fretta.\n\n## Le metriche che guidano la priorità\n\nPrioritizzi meglio se sai **quale numero vuoi muovere**. Qui entrano le metriche (approfondite in **xc-pm-metrics**).\n\n- **North Star Metric (Metrica Stella Polare)** — **l'unica metrica** che meglio cattura il **valore consegnato all'utente** e attorno a cui tutto il team si allinea. Esempi noti: per Airbnb \"notti prenotate\", per Spotify \"tempo di ascolto\". Serve da bussola: una feature che non muove (direttamente o a monte) la North Star probabilmente non è prioritaria.\n- **AARRR** — un framework a imbuto per capire il percorso dell'utente, soprannominato **\"pirate funnel\"** (\"imbuto dei pirati\", perché \"AARRR\" suona come il verso dei pirati). Le cinque tappe:\n  - **Acquisition (Acquisizione)** — come le persone ti trovano e arrivano al prodotto.\n  - **Activation (Attivazione)** — la prima esperienza di valore: l'utente capisce a cosa serve e prova quel primo \"momento aha\".\n  - **Retention (Retention / Ritenzione)** — le persone **tornano** e continuano a usare il prodotto nel tempo, invece di sparire dopo la prima volta. È spesso la metrica più predittiva della salute di un prodotto.\n  - **Referral (Passaparola)** — gli utenti soddisfatti **portano altri utenti** (inviti, consigli).\n  - **Revenue (Ricavi)** — l'utente genera fatturato (paga, si abbona, converte).\n\nL'idea di fondo: identifica lo **stadio dell'imbuto che perde di più** e prioritizza le feature che lo sistemano. Se acquisisci tanti utenti ma la retention è pessima, non serve spingere ancora l'acquisition — stai riempiendo un secchio bucato.\n\n<figure style=\"margin:18px 0;text-align:center\">\n<svg viewBox=\"0 0 420 320\" style=\"max-width:100%;height:auto;font-family:inherit\">\n  <g font-size=\"12\" fill=\"var(--ink)\" text-anchor=\"middle\">\n    <polygon points=\"40,30 380,30 336,86 84,86\" fill=\"var(--card)\" stroke=\"var(--rule)\" stroke-width=\"1.5\"/>\n    <polygon points=\"84,90 336,90 308,146 112,146\" fill=\"var(--card)\" stroke=\"var(--rule)\" stroke-width=\"1.5\"/>\n    <polygon points=\"112,150 308,150 280,206 140,206\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.5\"/>\n    <polygon points=\"140,210 280,210 252,266 168,266\" fill=\"var(--card)\" stroke=\"var(--rule)\" stroke-width=\"1.5\"/>\n    <polygon points=\"168,270 252,270 224,314 196,314\" fill=\"var(--card)\" stroke=\"var(--rule)\" stroke-width=\"1.5\"/>\n    <text x=\"210\" y=\"62\">Acquisition</text>\n    <text x=\"210\" y=\"122\">Activation</text>\n    <text x=\"210\" y=\"182\" fill=\"var(--accent)\">Retention</text>\n    <text x=\"210\" y=\"242\">Referral</text>\n    <text x=\"210\" y=\"296\" font-size=\"11\">Revenue</text>\n  </g>\n</svg>\n<figcaption style=\"font-size:12px;color:var(--muted);margin-top:4px\">Il funnel AARRR (pirate funnel): 5 stadi dall'arrivo al ricavo.</figcaption>\n</figure>\n\n## Tool reali\n\nDove si fa davvero questo lavoro, per nome:\n\n- **Backlog e issue** (elenco di lavoro da fare, ticket): **Jira**, **Linear**. Ci tieni le feature/task e spesso ci calcoli campi custom (es. un punteggio RICE).\n- **Prioritizzazione e roadmap** (piano nel tempo): **Productboard**, **Aha!**. Nati apposta per raccogliere feedback, assegnare punteggi e costruire la roadmap.\n- **PRD** (Product Requirements Document, il documento che descrive cosa e perché di una feature): **Notion**, **Confluence**.\n- **Metriche e funnel** (analisi comportamento utenti): **Amplitude**, **Mixpanel**. Ci misuri activation, retention e l'imbuto AARRR.\n- **Scoring RICE fatto a mano**: un semplice foglio **Google Sheets** o **Excel** con le colonne Reach, Impact, Confidence, Effort e la formula. Spessissimo la prima versione di un scoring vive proprio qui.\n\n## Esempio concreto (roba tua)\n\nPer **MaiCare** ho dovuto scegliere cosa costruire prima con risorse limitate: un caso classico da **matrice value/effort** e da **RICE**, dove i \"quick win\" (alto valore, basso sforzo) vanno per primi per validare in fretta e capire se stavo risolvendo il problema giusto prima di investire nelle scommesse più grandi. Il valore dei framework non è stato il numero in sé, ma avere un criterio esplicito da mostrare e discutere invece di decidere \"a sensazione\".\n\n## Notable use cases (grandi aziende)\n\n- **RICE nasce in Intercom** (azienda di customer messaging): l'hanno creato per prioritizzare la propria roadmap e poi pubblicato sul loro blog, diventando uno standard di settore. È un fatto pubblico e noto.\n- **MoSCoW** è uno standard diffuso nei progetti **Agile** (metodologie di sviluppo iterativo e incrementale) e in particolare nel metodo DSDM da cui proviene; si usa per negoziare lo scope di un rilascio.\n- **Kano model** è largamente usato in **product management e UX** (User Experience, l'esperienza d'uso) per capire quali feature soddisfano davvero gli utenti e distinguere il basilare dal deliziante.\n\n(Non aggiungo dettagli proprietari o numeri interni che non sono pubblici.)\n\n## Fonti\n\n- **Intercom — \"RICE: Simple prioritization for product managers\"** (intercom.com) — l'articolo originale che ha introdotto RICE.\n- **Reforge** (reforge.com) — corsi e materiali avanzati di product/growth, tra cui prioritizzazione e metriche.\n- **\"Inspired\" di Marty Cagan** (SVPG) — il libro di riferimento su come funzionano i grandi team di prodotto (discovery, ruolo del PM).\n- **Lenny's Newsletter** (lennysnewsletter.com) — casi pratici e framework di product management molto usati nel settore.\n\n## Concetti adiacenti\n\n- **xc-pm-metrics** — le metriche che misurano il valore (North Star, AARRR, retention, funnel): sono l'input che alimenta la prioritizzazione.\n- **xc-pm-discovery** — capire il problema giusto prima di costruire: la fase che genera le idee poi da prioritizzare.\n- **xc-pm-experiment** — validare le ipotesi con esperimenti (es. A/B test) per aumentare la Confidence delle stime.\n- **pm-agile** — sviluppo iterativo e incrementale, backlog e rilasci: il contesto in cui MoSCoW e WSJF vivono naturalmente.", "quiz": [{"q": "Qual è la differenza tra Product Manager e Project Manager?", "a": "**Product Manager** è responsabile del prodotto: decide **cosa** costruire e **perché** (problema giusto, strategia, valore per utente e business). **Project Manager** è responsabile dell'esecuzione del progetto: **tempi, budget, scope**, coordinamento e scadenze. In breve: il primo sceglie la direzione, il secondo consegna nei vincoli."}, {"q": "Scrivi la formula di RICE e spiega cosa significano i quattro fattori.", "a": "**RICE = (Reach × Impact × Confidence) / Effort.** **Reach** = quante persone/eventi impattati in un periodo definito; **Impact** = quanto muove l'obiettivo per persona (scala es. 0.25–3); **Confidence** = quanto sei sicuro delle stime, in % ; **Effort** = costo in persona-mese/settimane (al denominatore)."}, {"q": "Nell'esempio del corpo, calcola il RICE della Feature A (\"Login con Google\") e della Feature B (\"Notifiche push\"): quale vince?", "a": "**Feature A:** (2.000 × 1 × 0.8) / 2 = 1.600 / 2 = **800**. **Feature B:** (8.000 × 0.5 × 1.0) / 4 = 4.000 / 4 = **1.000**. **Vince la Feature B** (1.000 > 800)."}, {"q": "Quali sono le quattro categorie di MoSCoW e cosa significa ciascuna?", "a": "**Must have** = indispensabile (senza, il rilascio fallisce); **Should have** = importante ma non vitale (c'è un ripiego temporaneo); **Could have** = desiderabile, solo se avanzano tempo/risorse; **Won't have (this time)** = esplicitamente escluso da questo rilascio (non per sempre, solo non ora)."}, {"q": "Nella matrice value/effort, come si chiamano i quattro quadranti e da quale conviene partire?", "a": "I quattro quadranti: **Quick wins** (alto valore/basso sforzo), **Big bets** (alto valore/alto sforzo), **Fill-ins** (basso valore/basso sforzo), **Time sinks / Money pit** (basso valore/alto sforzo). Si parte dai **quick wins**."}, {"q": "Quali sono le tre categorie del Kano model? Cosa succede ai delighter col tempo?", "a": "**Must-be** (date per scontate: la loro assenza fa arrabbiare, la presenza non entusiasma), **Performance** (più ce n'è meglio è, soddisfazione proporzionale), **Delighters/Exciters** (sorprese che deliziano; la loro assenza non disturba). Col tempo **i delighter diventano must-be** (es. la fotocamera sullo smartphone)."}, {"q": "Cos'è la North Star Metric?", "a": "La **North Star Metric** è l'**unica metrica** che meglio cattura il **valore consegnato all'utente**, attorno a cui il team si allinea; funge da bussola per decidere cosa è prioritario."}, {"q": "Cosa significa l'acronimo AARRR e cosa vuol dire \"retention\"?", "a": "**AARRR** = **Acquisition, Activation, Retention, Referral, Revenue** (il \"pirate funnel\"). **Retention** = le persone **tornano** e continuano a usare il prodotto nel tempo, invece di abbandonarlo dopo la prima volta."}, {"q": "Scrivi la formula del WSJF e spiega cosa privilegia.", "a": "**WSJF = Cost of Delay / Job Size** (Weighted Shortest Job First, da SAFe). Privilegia chi dà **più valore per unità di tempo**: si fa per primo chi ha WSJF più alto."}, {"q": "Qual è la differenza tra discovery e delivery?", "a": "**Discovery** = capire il **problema giusto** da risolvere (parlare con gli utenti, testare ipotesi): \"stiamo costruendo la cosa giusta?\". **Delivery** = **costruire bene** la cosa scelta (sviluppo, test, rilascio): \"la stiamo costruendo bene?\"."}]}, {"day": 7, "topic_id": "xc-llm-vectordb", "title": "Vettorializzazione, embedding, indicizzazione e retrieval (pratico)", "course": "LLM / AI Engineering", "area": "cross-cutting", "adjacent": ["xc-llm-rag", "xc-llm-fundamentals", "prog-ds"], "body": "# Vettorializzazione, embedding, indicizzazione e retrieval\n\n> **Perché oggi:** questo è il motore che gira sotto ogni RAG e ogni chatbot che costruisci a Glacom. Quando dici \"metto i documenti in un vector DB e li cerco\", stanno succedendo quattro cose concrete. Oggi non guardi la teoria: guardi i mattoni pratici e i tool veri con cui li costruisci, così sai cosa scegliere e perché.\n\n## Il percorso di un documento (dalla parola al risultato)\n\nOgni sistema che \"cerca per significato\" si divide in due fasi, ed è utilissimo tenerle separate in testa.\n\n**Indicizzazione (offline, la fai una volta).** Prendi i tuoi documenti, li prepari e li carichi in una struttura pronta per essere cercata. È un lavoro batch: lo fai quando arrivano documenti nuovi o cambiano, non ad ogni domanda. Se hai 10.000 PDF, li indicizzi una volta e poi vivi di rendita.\n\n**Retrieval (a runtime, ad ogni domanda).** Arriva la domanda dell'utente, la trasformi anche lei in vettore, cerchi nell'indice i pezzi più simili e li restituisci. Questo accade in tempo reale, deve essere veloce (millisecondi), e succede migliaia di volte.\n\nI quattro verbi che incontrerai, in ordine:\n\n1. **Vettorializzare** — trasformare un testo in numeri che ne catturano il significato.\n2. **Indicizzare** — organizzare quei numeri in una struttura che si cerca in fretta.\n3. **Cercare** — dato il vettore di una domanda, trovare i vettori più vicini.\n4. **Riordinare** — rimettere in ordine i candidati per qualità prima di usarli.\n\nI primi due appartengono alla fase offline, gli ultimi due al runtime.\n\n<figure style=\"margin:18px 0;text-align:center\">\n<svg viewBox=\"0 0 720 160\" style=\"max-width:100%;height:auto;font-family:inherit\">\n  <defs><marker id=\"arVdbIdx\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.4\"/></marker></defs>\n  <g font-size=\"11\" fill=\"var(--ink)\" text-anchor=\"middle\">\n   <rect x=\"8\" y=\"58\" width=\"96\" height=\"44\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"56\" y=\"78\">Documenti</text><text x=\"56\" y=\"92\" font-size=\"9.5\" fill=\"var(--muted)\">PDF, web, DB</text>\n   <rect x=\"120\" y=\"58\" width=\"96\" height=\"44\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"168\" y=\"78\">Loader</text><text x=\"168\" y=\"92\" font-size=\"9.5\" fill=\"var(--muted)\">estrai testo</text>\n   <rect x=\"232\" y=\"58\" width=\"96\" height=\"44\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/><text x=\"280\" y=\"78\">Chunking</text><text x=\"280\" y=\"92\" font-size=\"9.5\" fill=\"var(--muted)\">spezza</text>\n   <rect x=\"344\" y=\"58\" width=\"108\" height=\"44\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/><text x=\"398\" y=\"76\">Embedding</text><text x=\"398\" y=\"90\" font-size=\"9.5\" fill=\"var(--muted)\">model</text>\n   <rect x=\"468\" y=\"58\" width=\"96\" height=\"44\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"516\" y=\"78\">Vettori</text><text x=\"516\" y=\"92\" font-size=\"9.5\" fill=\"var(--muted)\">liste di numeri</text>\n   <rect x=\"580\" y=\"58\" width=\"130\" height=\"44\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"645\" y=\"76\">Indice /</text><text x=\"645\" y=\"90\">Vector DB</text>\n  </g>\n  <g stroke=\"var(--muted)\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#arVdbIdx)\">\n   <path d=\"M104,80 L118,80\"/><path d=\"M216,80 L230,80\"/><path d=\"M328,80 L342,80\"/><path d=\"M452,80 L466,80\"/><path d=\"M564,80 L578,80\"/>\n  </g>\n</svg>\n<figcaption style=\"font-size:12px;color:var(--muted);margin-top:4px\">Fase di indicizzazione: si fa offline, una volta. I documenti diventano testo, poi pezzi, poi vettori, poi entrano nell'indice.</figcaption>\n</figure>\n\n## 1. Vettorializzazione ed embedding (in pratica)\n\n**Vettorializzazione** significa trasformare un testo in un **vettore**, cioè una lista di numeri (es. `[0.021, -0.44, 0.17, ...]`) che ne cattura il significato. Due frasi che vogliono dire cose simili producono vettori vicini nello spazio; due frasi lontane come significato producono vettori lontani. È così che una macchina \"misura\" la somiglianza di senso senza capire le parole come noi.\n\nIl pezzo che fa questa trasformazione si chiama **embedding model** (modello di embedding). Praticamente è una scatola: gli dai in ingresso del testo, ti restituisce un vettore di **N dimensioni** (N è quanti numeri ha la lista). Valori tipici che vedrai: **384**, **768**, **1536** dimensioni. Più dimensioni non vuol dire sempre meglio: significano vettori più \"ricchi\" ma anche più pesanti da salvare e confrontare.\n\nModelli reali, con le caratteristiche pratiche che ti interessano davvero (quante dimensioni, se gira in locale o via API, il compromesso costo/qualità):\n\n- **OpenAI `text-embedding-3-small` / `text-embedding-3-large`** — via API (paghi a chiamata, i dati escono verso OpenAI). Lo `small` è economico e buono per la maggior parte dei casi; il `large` costa di più ed è più accurato. Zero da gestire, ma serve connessione e budget.\n- **Cohere `embed-v3`** — anch'esso via API, forte sul multilingua e pensato per la ricerca; ha varianti ottimizzate per query e per documenti.\n- **Open-source con `sentence-transformers`** (libreria Python) — girano **in locale**, sul tuo hardware, senza mandare dati fuori:\n  - **`all-MiniLM-L6-v2`** — piccolo (384 dimensioni), veloce, ottimo per partire e per prototipi; leggero anche su CPU.\n  - **`bge`** (famiglia BAAI, es. `bge-base`, `bge-large`) — qualità alta, molto usato in produzione open-source.\n  - **`e5`** (famiglia intfloat, es. `e5-base`) — forte sul retrieval, richiede prefissi tipo `query:` e `passage:` per distinguere domande da documenti.\n\nLa scelta locale vs API è pratica: **API** = zero gestione ma costo per chiamata e dati che escono (attenzione a dati sensibili dei clienti); **locale** = controllo totale, dati che restano da te, ma devi avere l'hardware e gestirlo.\n\n**Regola d'oro:** usa **lo stesso modello di embedding per indicizzare e per cercare**. I vettori dei documenti e il vettore della domanda devono vivere nello **stesso spazio** (stesse dimensioni, stesso \"modo di misurare\"), altrimenti confronti mele con pere e il retrieval restituisce spazzatura. Se un giorno cambi modello, devi **re-indicizzare tutto** da capo.\n\nUn cenno intuitivo alla similarità, senza formule: il modo più comune di misurare quanto due vettori sono vicini è la **similarità coseno**, che guarda l'**angolo** tra i due vettori, non la loro lunghezza. Due testi \"puntano nella stessa direzione\" (angolo piccolo) quando parlano della stessa cosa, a prescindere da quanto sono lunghi. È per questo che una frase corta e un paragrafo lungo sullo stesso argomento possono risultare molto simili.\n\n## 2. Chunking (come spezzi i documenti)\n\nNon si vettorializza un intero PDF in un colpo solo. Primo, i modelli di embedding hanno un limite di quanto testo accettano per volta. Secondo, e più importante: un vettore solo per 40 pagine \"spalma\" troppi significati diversi in un unico punto, e quando cerchi non recuperi il paragrafo giusto ma \"tutto il documento\", che è inutile. Per questo si fa il **chunking**: spezzi il documento in pezzi (**chunk**) più piccoli, e vettorizzi ogni pezzo.\n\nStrategie pratiche:\n\n- **Fixed-size (a dimensione fissa)** — tagli ogni N token (unità di testo, all'incirca pezzi di parola) con un **overlap** (sovrapposizione): gli ultimi token di un chunk vengono ripetuti all'inizio del successivo, così una frase spezzata a metà non perde il senso al confine. Semplice e robusto.\n- **Recursive (ricorsivo, per separatori)** — provi a tagliare prima sui separatori \"grossi\" (paragrafi: `\\n\\n`), poi se il pezzo è ancora troppo lungo scendi a quelli più fini (frasi, poi spazi). Così i tagli cadono in punti naturali. È l'approccio del **`RecursiveCharacterTextSplitter`** di **LangChain**, il default sensato per il testo generico.\n- **Semantic (semantico)** — tagli dove **cambia argomento**: misuri quando due frasi vicine diventano poco simili tra loro e lì metti il confine. Chunk più coerenti, ma più costoso da calcolare.\n- **Per struttura** — sfrutti la forma del documento: tagli per **heading** e sezioni, rispetti i blocchi Markdown, tieni le **tabelle** intere invece di spezzarle a metà. Ottimo per manuali e documentazione ben strutturata.\n\nIl **trade-off della dimensione del chunk** è il concetto chiave:\n\n- **Chunk piccolo** → molto **preciso** (recuperi esattamente il pezzo rilevante) ma con **poco contesto** attorno: a volte al modello manca l'informazione che stava una riga sopra.\n- **Chunk grande** → tanto **contesto** ma più **rumore** (dentro c'è anche roba irrilevante che confonde la ricerca) e più **costo** (più token da vettorizzare e da mandare poi all'LLM).\n\n**Consiglio pratico di partenza:** chunk intorno a **300–500 token**, con **overlap del 10–15%**. Non è una legge fisica: è un punto di partenza ragionevole da cui misurare e aggiustare sui tuoi documenti.\n\n## 3. Indicizzazione (come si cerca veloce su milioni di vettori)\n\nUn **indice** è la struttura dati che permette di trovare in fretta i vettori più simili a quello che cerchi. Senza indice dovresti confrontare la domanda con **ogni singolo vettore** uno per uno: su qualche migliaio va, ma su milioni diventa lentissimo ad ogni query.\n\nLa soluzione pratica si chiama **ANN = Approximate Nearest Neighbor** (ricerca dei vicini più prossimi *approssimati*). L'idea: invece di garantire il risultato *esatto* controllando tutto, l'indice usa scorciatoie intelligenti per trovare *quasi sempre* i vicini giusti, molto più in fretta. Rinunci a una briciola di precisione teorica in cambio di enorme velocità — e in un RAG questa è quasi sempre la scelta giusta.\n\nTipi di indice che incontrerai:\n\n- **Flat** — nessuna scorciatoia: confronta la query con tutti i vettori, uno a uno. È **esatto** (trova davvero i più vicini) ma diventa lento con la scala. Ottimo fino a qualche decina di migliaia di vettori, o quando la precisione perfetta conta più della velocità.\n- **HNSW (Hierarchical Navigable Small World)** — costruisce un **grafo di vicinato**: ogni vettore è collegato ai suoi simili, e la ricerca \"salta\" da nodo a nodo avvicinandosi rapidamente alla zona giusta. È il **default moderno**: veloce e molto accurato, funziona bene fino a milioni di vettori. Quando non sai cosa scegliere, è questo.\n- **IVF (Inverted File)** — divide lo spazio in **celle/cluster**: prima trovi le poche celle più promettenti, poi cerchi solo dentro quelle invece che in tutto il dataset. Efficiente in memoria su dataset molto grandi, ma va \"addestrato\" sui dati e va tarato quante celle esplorare.\n\n**Cosa scegliere secondo la scala, in pratica:** poche decine di migliaia di vettori → **Flat** va benissimo, semplice ed esatto. Da lì fino a milioni → **HNSW** è la scelta di default. Dataset enormi con vincoli di memoria → **IVF** (spesso combinato con compressione dei vettori).\n\nLe **metriche di distanza** (il modo con cui l'indice misura \"quanto sono vicini\" due vettori), a parole:\n\n- **Cosine (coseno)** — guarda l'**angolo**, ignora la lunghezza. È la scelta più comune per il testo, perché ci interessa la direzione del significato, non \"quanto è lungo\" il vettore.\n- **Dot product (prodotto scalare)** — tiene conto anche della lunghezza dei vettori. Alcuni modelli producono vettori già **normalizzati** (tutti della stessa lunghezza): in quel caso dot product e coseno danno lo stesso ordine, e il dot product è un filo più veloce.\n- **Euclidea (L2)** — la distanza \"in linea d'aria\" nello spazio. Usata quando conta la posizione assoluta e non solo la direzione; per il testo è meno comune del coseno.\n\nRegola pratica: usa la metrica **consigliata dal modello di embedding che hai scelto** (la trovi nella sua scheda). Molti modelli testuali sono pensati per il coseno.\n\n## 4. I Vector DB (quale, in pratica)\n\nUn **vector DB** (database vettoriale) è il posto dove salvi i vettori, l'indice sopra di essi, e le informazioni collegate — e che ti offre le API per cercare. Ecco il panorama pratico, da \"per iniziare\" a \"produzione\":\n\n- **FAISS** (Facebook AI Similarity Search) — è una **libreria**, non un server: gira **in-memory** dentro il tuo processo Python. Velocissima, perfetta per **prototipi** e per imparare. Da sola non gestisce persistenza comoda, metadati ricchi o accesso multiutente: la usi quando vuoi partire subito.\n- **Chroma** — leggero, gira in **locale**, pensato per lo **sviluppo**: lo installi con un `pip` e in due righe hai una collezione. Ottimo per il dev e i piccoli progetti.\n- **Qdrant** e **Weaviate** — **server open-source** pensati per la **produzione**: gestiscono milioni di vettori, offrono **filtri sui metadati** e ricerca **ibrida** (densa + lessicale). Li fai girare tu (o in cloud gestito) quando il progetto diventa serio.\n- **pgvector** — un'estensione di **PostgreSQL**: se hai **già un Postgres**, tieni i vettori dentro il tuo database esistente, accanto ai dati relazionali, con una sola infrastruttura da gestire. Molto pragmatico quando non vuoi introdurre un nuovo sistema.\n- **Pinecone** — servizio **gestito nel cloud**: zero-ops, non gestisci server né scalabilità, paghi il servizio. Comodo quando vuoi concentrarti sull'app e non sull'infrastruttura.\n\nUn punto pratico che fa tutta la differenza: oltre al vettore, un vector DB salva il **payload / metadati**, cioè le informazioni collegate al chunk. Tipicamente: il **testo originale** del chunk (ti serve per mostrarlo all'LLM e all'utente), la **fonte** (nome file, URL, pagina), la **data**, l'**autore**, il **cliente**. Questi dati servono a due cose fondamentali: le **citazioni** (dire \"questa risposta viene dal documento X, pagina Y\") e i **filtri** (cercare solo tra i documenti di un certo cliente o periodo). Un vettore senza metadati è un numero muto: ritrova il pezzo ma non sai da dove viene né puoi restringere la ricerca.\n\n## 5. Retrieval (a runtime, ad ogni domanda)\n\nOra la fase live. Arriva la domanda e questo è il percorso, passo per passo.\n\n<figure style=\"margin:18px 0;text-align:center\">\n<svg viewBox=\"0 0 720 170\" style=\"max-width:100%;height:auto;font-family:inherit\">\n  <defs><marker id=\"arVdbQry\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.4\"/></marker></defs>\n  <g font-size=\"11\" fill=\"var(--ink)\" text-anchor=\"middle\">\n   <rect x=\"8\" y=\"62\" width=\"92\" height=\"46\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"54\" y=\"82\">Domanda</text><text x=\"54\" y=\"96\" font-size=\"9.5\" fill=\"var(--muted)\">utente</text>\n   <rect x=\"116\" y=\"62\" width=\"104\" height=\"46\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/><text x=\"168\" y=\"80\">Embedding</text><text x=\"168\" y=\"94\" font-size=\"9.5\" fill=\"var(--muted)\">stesso modello</text>\n   <rect x=\"236\" y=\"62\" width=\"104\" height=\"46\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"288\" y=\"80\">Ricerca ANN</text><text x=\"288\" y=\"94\" font-size=\"9.5\" fill=\"var(--muted)\">nell'indice</text>\n   <rect x=\"356\" y=\"62\" width=\"104\" height=\"46\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"408\" y=\"80\">Filtro</text><text x=\"408\" y=\"94\" font-size=\"9.5\" fill=\"var(--muted)\">metadati</text>\n   <rect x=\"476\" y=\"62\" width=\"92\" height=\"46\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"522\" y=\"80\">Top-k</text><text x=\"522\" y=\"94\" font-size=\"9.5\" fill=\"var(--muted)\">candidati</text>\n   <rect x=\"584\" y=\"62\" width=\"126\" height=\"46\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/><text x=\"647\" y=\"80\">Reranking</text><text x=\"647\" y=\"94\" font-size=\"9.5\" fill=\"var(--muted)\">chunk finali</text>\n  </g>\n  <g stroke=\"var(--muted)\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#arVdbQry)\">\n   <path d=\"M100,85 L114,85\"/><path d=\"M220,85 L234,85\"/><path d=\"M340,85 L354,85\"/><path d=\"M460,85 L474,85\"/><path d=\"M568,85 L582,85\"/>\n  </g>\n</svg>\n<figcaption style=\"font-size:12px;color:var(--muted);margin-top:4px\">Fase di retrieval: accade ad ogni domanda, in tempo reale. La domanda diventa vettore con lo stesso modello dell'indicizzazione, poi si cerca, si filtra, si prende il top-k e si riordina.</figcaption>\n</figure>\n\nI termini nuovi, definiti:\n\n- **Top-k** — quanti chunk recuperi dalla ricerca. `k=5` significa \"dammi i 5 più simili\". È una manopola: k basso = poco materiale ma pulito; k alto = più materiale ma più rumore (e più token da pagare all'LLM dopo).\n- **Metadata filtering (filtro sui metadati)** — restringere la ricerca in base agli attributi salvati nel payload **prima** (o insieme) alla misura di similarità. Esempio concreto: \"cerca solo tra i documenti del cliente Rossi, degli ultimi 12 mesi\". Così non recuperi un chunk simile ma appartenente al cliente sbagliato — cosa che oltre a essere inutile può essere un problema di riservatezza. È esattamente il motivo per cui i metadati (sezione 4) sono così importanti.\n- **Reranking (riordino)** — dopo aver preso i primi candidati con la ricerca ANN (veloce ma \"grossolana\"), passi quei pochi candidati a un modello **cross-encoder**, che rilegge insieme la **coppia domanda + chunk** e assegna un punteggio di rilevanza preciso, poi riordina. La differenza con l'embedding: l'embedding calcola il vettore della domanda e del chunk **separatamente** e poi li confronta (veloce, adatto a milioni di documenti); il cross-encoder guarda i due testi **insieme** in un colpo solo (molto più accurato ma lento, quindi lo usi solo su una manciata di candidati, non su tutto l'indice). Schema tipico: recuperi 50 candidati con la ricerca ANN, li reranki, tieni i migliori 5.\n\n  Tool reali di reranking: **Cohere Rerank** (via API, molto usato), i **cross-encoder di sentence-transformers** (es. `cross-encoder/ms-marco-MiniLM-L-6-v2`, girano in locale), il **BGE reranker** (`bge-reranker-base`/`large`, open-source).\n\n- **Hybrid search (ricerca ibrida)** — combinare la ricerca **densa** (per vettori/significato, quella di oggi) con quella **lessicale** basata su **BM25** (che pesa le parole esatte, come un motore di ricerca classico: ottima quando cerchi un codice prodotto, un nome proprio, un termine tecnico raro che l'embedding \"annacqua\"). Le due si completano; il dettaglio lo vedi in `xc-llm-rag`.\n\n## Errori pratici comuni (checklist)\n\n- **Modello di embedding diverso tra indicizzazione e query.** Vettori in spazi diversi = risultati senza senso. Fissa un modello e usalo per entrambe; se lo cambi, **re-indicizza tutto**.\n- **Chunk troppo grandi o troppo piccoli.** Grandi = rumore e costo; piccoli = manca contesto. Parti da ~300–500 token con overlap 10–15% e aggiusta misurando.\n- **Nessun metadato salvato.** Senza payload non hai **citazioni** (\"da dove viene questa risposta?\") né **filtri** (per cliente/data). Salva sempre almeno testo originale e fonte.\n- **Top-k troppo alto.** Recuperi troppa roba: aumentano il **rumore** (chunk irrilevanti che confondono l'LLM) e il **costo** (più token). Tieni k basso e, se serve più recall, alza k ma aggiungi il **reranking**.\n- **Dimenticare di re-indicizzare quando i documenti cambiano.** Se aggiorni o aggiungi documenti e non li re-indicizzi, il sistema risponde su dati vecchi. Prevedi un processo che re-indicizza ciò che cambia.\n\n## Notable use cases (grandi aziende)\n\n- **Ricerca semantica interna** — cercare nella documentazione aziendale \"per significato\" invece che per parola esatta: trovi il documento giusto anche se hai usato sinonimi diversi.\n- **\"Chatta col tuo PDF\"** — carichi un documento (o un manuale) e fai domande in linguaggio naturale ottenendo risposte con citazioni al punto esatto.\n- **Knowledge base di supporto** — l'assistente clienti (umano o bot) recupera al volo la procedura o l'articolo giusto per rispondere a un ticket.\n- **Ricerca prodotti** — negli e-commerce, trovare prodotti per descrizione e intento (\"scarpe da corsa leggere per asfalto\") e non solo per parola chiave.\n\n## Fonti\n\n- **Pinecone Learn** — pinecone.io/learn (concetti di embedding, indicizzazione ANN, vector DB, spiegati in modo pratico).\n- **Qdrant Documentation** — qdrant.tech/documentation (indici, metriche di distanza, filtri sui metadati, ricerca ibrida).\n- **LangChain Docs** — text splitters e retrievers (chunking pratico, `RecursiveCharacterTextSplitter`, pipeline di retrieval).\n- **Sentence-Transformers** — sbert.net (embedding open-source in locale e cross-encoder per il reranking).\n\n## Concetti adiacenti\n\n- **xc-llm-rag** — il sistema completo che usa questo retrieval per dare contesto all'LLM e generare risposte fondate; ci trovi anche l'hybrid search per esteso.\n- **xc-llm-chatbot-arch** — come tutto questo si incastra dentro l'architettura di un chatbot (memoria, orchestrazione, tool).\n- **xc-llm-fundamentals** — cosa sono token, modelli e context window, i mattoni sotto embedding e generazione.\n- **prog-ds** — strutture dati e complessità: perché un indice ANN batte la ricerca uno-a-uno, e il ragionamento sui trade-off velocità/precisione.", "quiz": [{"q": "Cos'è la **vettorializzazione** e chi la esegue?", "a": "È la trasformazione di un testo in un **vettore** (lista di numeri) che ne cattura il significato: testi simili → vettori vicini. La esegue l'**embedding model** (gli dai testo, ti restituisce un vettore di N dimensioni, es. 384/768/1536)."}, {"q": "Perché devi usare **lo stesso modello di embedding** per indicizzare e per cercare?", "a": "Perché i vettori dei documenti e quello della domanda devono vivere nello **stesso spazio** (stesse dimensioni, stesso modo di misurare). Con modelli diversi confronteresti mele con pere e il retrieval restituirebbe risultati senza senso. Se cambi modello devi re-indicizzare tutto."}, {"q": "Cita **due strategie di chunking** e spiega in una riga come funzionano.", "a": "Due qualsiasi tra: **fixed-size** (tagli ogni N token con overlap tra un pezzo e il successivo); **recursive** (tagli prima sui separatori grossi come i paragrafi, poi su frasi/spazi, es. `RecursiveCharacterTextSplitter` di LangChain); **semantic** (tagli dove cambia argomento); **per struttura** (tagli per heading/Markdown, tieni le tabelle intere)."}, {"q": "Cos'è la **ANN** e perché serve invece di confrontare tutti i vettori uno a uno?", "a": "**ANN = Approximate Nearest Neighbor**, la ricerca dei vicini più prossimi *approssimati*. Serve perché confrontare la query con ogni singolo vettore uno a uno è troppo lento su milioni di vettori; l'ANN usa scorciatoie per trovare *quasi sempre* i più simili molto più in fretta, rinunciando a una briciola di precisione teorica."}, {"q": "Che differenza c'è tra un indice **HNSW** e un indice **Flat**, e quando usi l'uno o l'altro?", "a": "**Flat** confronta la query con tutti i vettori uno a uno: è **esatto** ma lento con la scala (bene fino a qualche decina di migliaia). **HNSW** costruisce un **grafo di vicinato** e \"salta\" verso la zona giusta: veloce e molto accurato fino a milioni di vettori, è il default moderno. Flat quando i vettori sono pochi o vuoi precisione perfetta; HNSW da lì in su."}, {"q": "Cosa aggiunge il **metadata filtering** al retrieval? Fai un esempio.", "a": "Restringe la ricerca in base agli **attributi nei metadati** (payload) prima/insieme alla similarità, così eviti chunk simili ma dal contesto sbagliato. Esempio: \"cerca solo tra i documenti del cliente Rossi, degli ultimi 12 mesi\". Migliora la pertinenza e protegge la riservatezza."}, {"q": "Cos'è il **reranking** e con che tipo di modello si fa? In cosa è diverso dall'embedding?", "a": "Il **reranking** riordina i candidati recuperati dalla ricerca ANN usando un modello **cross-encoder**, che rilegge insieme la **coppia domanda + chunk** e dà un punteggio di rilevanza preciso. È diverso dall'embedding perché quest'ultimo calcola i vettori di domanda e chunk **separatamente** (veloce, adatto a milioni di documenti), mentre il cross-encoder guarda i due testi **insieme** (più accurato ma lento, quindi solo su pochi candidati). Tool: Cohere Rerank, cross-encoder di sentence-transformers, BGE reranker."}, {"q": "Descrivi un **errore pratico comune** tra quelli in checklist e perché è un problema.", "a": "Uno qualsiasi tra: modello di embedding diverso tra index e query (vettori in spazi diversi → risultati insensati); chunk troppo grandi (rumore+costo) o troppo piccoli (manca contesto); nessun metadato (niente citazioni né filtri); top-k troppo alto (rumore + costo in token); non re-indicizzare quando i documenti cambiano (rispondi su dati vecchi)."}, {"q": "Cosa salva un vector DB **oltre al vettore**, e a cosa serve?", "a": "Il **payload / metadati**: testo originale del chunk, fonte (file/URL/pagina), data, autore, cliente. Servono per le **citazioni** (dire da dove viene la risposta) e per i **filtri** (restringere la ricerca per attributi)."}, {"q": "Cosa misura la **similarità coseno**, a parole?", "a": "Misura l'**angolo** tra due vettori, **non** la loro lunghezza: due testi che \"puntano nella stessa direzione\" parlano della stessa cosa, a prescindere da quanto sono lunghi."}]}, {"day": 8, "topic_id": "xc-llm-chatbot-arch", "title": "Architettura completa di un chatbot/assistente LLM (end-to-end)", "course": "LLM / AI Engineering", "area": "cross-cutting", "adjacent": ["xc-llm-rag", "xc-llm-vectordb", "xc-llm-agents", "xc-sd-basics"], "body": "# Architettura completa di un chatbot/assistente LLM\n\n> **Perché oggi:** questo è letteralmente ciò che costruisci. A Glacom hai fatto assistenti LLM per clienti reali — un bot che genera preventivi, un task manager con retrieval ibrido. Finora hai visto i pezzi separati (RAG, embedding, Vector DB, agenti); oggi li metti tutti in un unico schema, così a un colloquio sai disegnare l'architettura **intera** end-to-end su una lavagna, dal documento grezzo fino alla risposta che l'utente legge. Non è teoria: è la mappa del sistema che ti pagano per costruire.\n\n## La visione d'insieme\n\nUn chatbot serio **non** è \"una chiamata all'LLM\". Quella è la demo. Un assistente in produzione è un **sistema** con tante parti che collaborano, e il modo più pulito di ragionarci è dividerlo in **due piani**.\n\n- **Piano offline (indicizzazione)**: prepari la conoscenza **una volta** (e la aggiorni quando i documenti cambiano). Qui prendi i documenti del cliente, li spezzetti, li trasformi in vettori e li scrivi in un database. Nessun utente è collegato mentre lo fai: è un lavoro \"batch\", di preparazione.\n- **Piano online (per ogni messaggio)**: succede **a ogni domanda** dell'utente, in tempo reale, e deve essere veloce. Il flusso è sempre lo stesso: **ricevi** il messaggio → **recuperi** la conoscenza pertinente → **costruisci il prompt** → **chiami l'LLM** → **filtri** l'output → **rispondi**.\n\nLa distinzione è la prima cosa che devi saper dire: l'indicizzazione è **lenta e rara**, la risposta è **veloce e frequente**. Confonderle è l'errore da principiante (ri-embeddare tutti i documenti a ogni domanda = lentezza e costi assurdi).\n\nI componenti che vedremo, in ordine: **canale/UI**, **backend/orchestratore**, **ingestion & indicizzazione**, **retrieval**, **memoria e sessione**, **assemblaggio del prompt**, **il modello (LLM)**, **guardrail e sicurezza**, **tool/azioni**, e infine **osservabilità, valutazione e costo**. Ogni sezione dice **cosa fa** il pezzo e **con quale tool reale** lo si fa.\n\n<figure style=\"margin:18px 0;text-align:center\">\n<svg viewBox=\"0 0 760 620\" style=\"max-width:100%;height:auto;font-family:inherit\">\n  <defs><marker id=\"arArch1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.4\"/></marker></defs>\n\n  <!-- PIANO OFFLINE -->\n  <g font-size=\"11\" fill=\"var(--muted)\" text-anchor=\"start\">\n   <text x=\"24\" y=\"26\" font-size=\"12.5\" fill=\"var(--accent)\">PIANO OFFLINE — indicizzazione (una volta, poi aggiornamenti)</text>\n  </g>\n  <g font-size=\"11.5\" fill=\"var(--ink)\" text-anchor=\"middle\">\n   <rect x=\"24\" y=\"40\" width=\"150\" height=\"46\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"99\" y=\"60\">Documenti</text><text x=\"99\" y=\"76\">(PDF, DB, web)</text>\n   <rect x=\"204\" y=\"40\" width=\"130\" height=\"46\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"269\" y=\"60\">Chunking</text><text x=\"269\" y=\"76\">spezzetta testo</text>\n   <rect x=\"364\" y=\"40\" width=\"140\" height=\"46\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"434\" y=\"60\">Embedding</text><text x=\"434\" y=\"76\">testo → vettori</text>\n   <rect x=\"534\" y=\"40\" width=\"200\" height=\"46\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/><text x=\"634\" y=\"60\">Vector DB</text><text x=\"634\" y=\"76\">indice vettoriale</text>\n  </g>\n  <g stroke=\"var(--muted)\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#arArch1)\">\n   <path d=\"M174,63 L202,63\"/>\n   <path d=\"M334,63 L362,63\"/>\n   <path d=\"M504,63 L532,63\"/>\n  </g>\n\n  <line x1=\"24\" y1=\"108\" x2=\"736\" y2=\"108\" stroke=\"var(--rule)\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/>\n\n  <!-- PIANO ONLINE -->\n  <g font-size=\"11\" fill=\"var(--muted)\" text-anchor=\"start\">\n   <text x=\"24\" y=\"132\" font-size=\"12.5\" fill=\"var(--accent)\">PIANO ONLINE — per ogni messaggio (tempo reale)</text>\n  </g>\n  <g font-size=\"11.5\" fill=\"var(--ink)\" text-anchor=\"middle\">\n   <rect x=\"24\" y=\"150\" width=\"150\" height=\"50\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"99\" y=\"170\">Utente / UI</text><text x=\"99\" y=\"186\">web, WhatsApp…</text>\n\n   <rect x=\"24\" y=\"238\" width=\"150\" height=\"50\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"99\" y=\"258\">Guardrail input</text><text x=\"99\" y=\"274\">blocca injection</text>\n\n   <rect x=\"250\" y=\"238\" width=\"180\" height=\"60\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"2\"/><text x=\"340\" y=\"264\">Orchestratore</text><text x=\"340\" y=\"281\">(backend, coordina)</text>\n\n   <rect x=\"250\" y=\"150\" width=\"180\" height=\"50\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"340\" y=\"170\">Memoria</text><text x=\"340\" y=\"186\">cronologia sessione</text>\n\n   <rect x=\"250\" y=\"345\" width=\"180\" height=\"52\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"340\" y=\"366\">Retrieval</text><text x=\"340\" y=\"383\">top-k dal Vector DB</text>\n\n   <rect x=\"510\" y=\"238\" width=\"224\" height=\"60\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"622\" y=\"264\">Assemblaggio prompt</text><text x=\"622\" y=\"281\">system+contesto+storia+domanda</text>\n\n   <rect x=\"510\" y=\"150\" width=\"224\" height=\"50\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/><text x=\"622\" y=\"170\">LLM</text><text x=\"622\" y=\"186\">API o self-hosted</text>\n\n   <rect x=\"510\" y=\"345\" width=\"224\" height=\"52\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"622\" y=\"366\">Guardrail output</text><text x=\"622\" y=\"383\">tossicità, grounding, citazioni</text>\n\n   <rect x=\"510\" y=\"448\" width=\"224\" height=\"50\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"622\" y=\"468\">Risposta all'utente</text><text x=\"622\" y=\"484\">(streaming + fonti)</text>\n  </g>\n\n  <!-- Vector DB richiamato dal retrieval (freccia verticale dal piano offline) -->\n  <g stroke=\"var(--muted)\" stroke-width=\"1.2\" fill=\"none\" stroke-dasharray=\"5 4\" marker-end=\"url(#arArch1)\">\n   <path d=\"M634,86 L634,120 L470,120 L470,371 L432,371\"/>\n  </g>\n\n  <g stroke=\"var(--muted)\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#arArch1)\">\n   <path d=\"M99,200 L99,236\"/>\n   <path d=\"M174,263 L248,263\"/>\n   <path d=\"M340,200 L340,236\"/>\n   <path d=\"M340,298 L340,343\"/>\n   <path d=\"M430,285 L508,272\"/>\n   <path d=\"M430,360 L560,360 L560,300\"/>\n   <path d=\"M622,238 L622,202\"/>\n   <path d=\"M622,200 L622,236\" stroke=\"none\"/>\n   <path d=\"M622,298 L622,343\"/>\n   <path d=\"M622,397 L622,446\"/>\n  </g>\n  <g stroke=\"var(--muted)\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#arArch1)\">\n   <path d=\"M622,150 L622,120 L340,120 L340,148\" stroke-dasharray=\"5 4\"/>\n  </g>\n\n  <!-- Riquadri trasversali -->\n  <g font-size=\"10.5\" fill=\"var(--muted)\" text-anchor=\"middle\">\n   <rect x=\"24\" y=\"448\" width=\"215\" height=\"50\" rx=\"9\" fill=\"none\" stroke=\"var(--rule)\" stroke-dasharray=\"4 3\"/><text x=\"131\" y=\"468\" fill=\"var(--ink)\">Cache</text><text x=\"131\" y=\"484\">risposte ripetute</text>\n   <rect x=\"255\" y=\"448\" width=\"215\" height=\"50\" rx=\"9\" fill=\"none\" stroke=\"var(--rule)\" stroke-dasharray=\"4 3\"/><text x=\"362\" y=\"468\" fill=\"var(--ink)\">Osservabilità</text><text x=\"362\" y=\"484\">log, token, latenza, feedback</text>\n  </g>\n  <g font-size=\"10.5\" fill=\"var(--muted)\" text-anchor=\"middle\">\n   <text x=\"380\" y=\"540\" font-size=\"11\">Cache e Osservabilità avvolgono l'intero piano online: intercettano prima dell'LLM e registrano dopo.</text>\n  </g>\n</svg>\n<figcaption style=\"font-size:12px;color:var(--muted);margin-top:4px\">Architettura completa. Sopra la linea tratteggiata il piano <b>offline</b> che riempie il Vector DB. Sotto il piano <b>online</b>: ogni messaggio passa da guardrail, orchestratore (che tira memoria + retrieval), assemblaggio del prompt, LLM, guardrail di output, fino alla risposta. Cache e osservabilità avvolgono tutto.</figcaption>\n</figure>\n\n## 1. Canale e UI\n\n**Cosa fa:** è il punto in cui l'utente scrive e legge. Il **canale** è dove vive il bot: un **web widget** (la bolla in basso a destra su un sito), un'app di messaggistica (**WhatsApp**, **Slack**, **Telegram**), o direttamente un'**API** che un altro software chiama. Lo stesso cervello (backend) può servire più canali.\n\nUn dettaglio di UX che devi conoscere per nome: lo **streaming**. Invece di aspettare che l'LLM finisca tutta la risposta e poi mostrarla in blocco (magari dopo 8 secondi di schermo vuoto), la mandi **token per token** man mano che il modello la genera — l'effetto \"sta scrivendo\" che vedi in ChatGPT. Un **token** è il pezzetto di testo (una parola o parte di parola) che il modello produce a ogni passo. Lo streaming non rende il modello più veloce, ma la percezione dell'attesa crolla: l'utente vede subito qualcosa.\n\n**Tool reali:** widget web con WebSocket o Server-Sent Events (SSE) per lo streaming; canali business via le API di WhatsApp Business, Slack (Bolt), Telegram Bot API.\n\n## 2. Backend / orchestratore\n\n**Cosa fa:** è il **cervello di coordinamento**, il codice che sta in mezzo e decide *cosa succede e in che ordine*. Riceve il messaggio dal canale, chiama il guardrail di input, interroga la memoria, lancia il retrieval, assembla il prompt, chiama l'LLM, passa l'output dal guardrail, e rimanda la risposta. Nessuno di questi pezzi \"si parla\" da solo: è l'orchestratore che li mette in fila. Espone un **endpoint API** (es. `POST /chat`) che il canale chiama.\n\n**Tool reali:** puoi usare un framework che ti dà i mattoni pronti — **LangChain** o **LlamaIndex** (Python) — oppure scrivere **codice custom** con un web framework (FastAPI, Express) chiamando direttamente le API. Regola pratica: i framework accelerano il prototipo; per logica di controllo particolare o massima trasparenza, molti team preferiscono il codice custom. Non c'è una scelta \"giusta\" universale.\n\n## 3. Ingestion & indicizzazione (offline)\n\n**Cosa fa:** è tutto il **piano offline**. Prende i documenti grezzi del cliente e li trasforma in una base di conoscenza cercabile. I passi:\n\n1. **Loader**: legge i documenti dalle sorgenti (PDF, pagine web, righe di un database, file Word) e li porta a testo.\n2. **Chunking**: spezza i testi lunghi in **chunk**, pezzi di poche centinaia di token, perché non puoi vettorizzare (né infilare nel prompt) un manuale intero.\n3. **Embedding**: passa ogni chunk a un modello di embedding che lo trasforma in un **vettore** (una lista di numeri che ne rappresenta il significato).\n4. **Scrittura nel Vector DB**: salva i vettori (con il testo e i metadati, es. da quale documento vengono) nell'indice vettoriale.\n\n**Quando ri-eseguirla:** ogni volta che i documenti **cambiano** — un nuovo manuale, un contratto aggiornato, una FAQ modificata. Non a ogni domanda. Si fa in batch (schedulato, o triggerato dal caricamento di un nuovo file). Il \"come\" funzionano gli indici vettoriali sta in **→ xc-llm-vectordb**.\n\n**Tool reali:** loader e splitter di **LangChain**/**LlamaIndex**; modelli di embedding (OpenAI `text-embedding-3`, modelli open come BGE o E5); Vector DB come **Pinecone**, **Weaviate**, **Qdrant**, o `pgvector` su Postgres.\n\n## 4. Retrieval\n\n**Cosa fa:** è il cuore del **RAG** (Retrieval-Augmented Generation — generazione aumentata dal recupero). A ogni domanda, invece di sperare che l'LLM \"sappia\" la risposta, gli **procuri** il testo giusto. Il flusso online:\n\n1. **Embedd la domanda**: trasformi la domanda dell'utente in un vettore con lo stesso modello di embedding usato in indicizzazione.\n2. **Cerca top-k**: chiedi al Vector DB i **k** chunk più simili a quel vettore (i più vicini nello spazio dei significati). `k` è quanti ne prendi, tipicamente 3–8.\n3. **Rerank** (opzionale ma utile): riordini quei chunk con un modello più preciso (un **cross-encoder** che legge domanda e chunk insieme) e tieni solo i migliori, per ridurre il rumore prima del prompt.\n\nIl retrieval è ciò che rende la risposta **ancorata** ai documenti del cliente e non all'immaginazione del modello. I tipi di RAG (naive, ibrido, graph, agentico) e i dettagli stanno in **→ xc-llm-rag**.\n\n**Tool reali:** i retriever di LangChain/LlamaIndex; per il rerank **Cohere Rerank**, cross-encoder di sentence-transformers, BGE reranker.\n\n## 5. Memoria e sessione\n\n**Cosa fa:** dà al bot il senso della **conversazione**. Senza memoria, ogni messaggio parte da zero e \"Quanto costa?\" dopo \"Parlami del modello X\" non ha senso. Ci sono due tipi, da tenere ben distinti:\n\n- **Memoria a breve termine (cronologia della conversazione)**: i messaggi precedenti dello *stesso* dialogo. Vivono nella **context window** — la finestra
