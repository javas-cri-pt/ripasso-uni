<script>
const DATA={"lessons": [{"day": 1, "topic_id": "xc-sd-basics", "title": "System Design — fondamenti (scalabilità, load balancing, caching, CDN, scaling del DB)", "course": "System Design", "area": "cross-cutting", "adjacent": ["cloud-arch", "db-index", "xc-sd-data", "xc-sd-async"], "body": "# System Design — fondamenti\n\n> **Perché oggi:** non l'hai fatto all'uni, ma è **adiacente** (tocca Reti, Sistemi Operativi, Basi di Dati, Cloud) ed è **rilevante per il lavoro** e per i colloqui. L'esempio perfetto di \"tangente ma prezioso\".\n\n## Il problema che risolve\nUn sistema che funziona per 100 utenti spesso si rompe a 100.000: la stessa architettura non regge il carico. **System design** è decidere *come strutturare un sistema perché regga la scala, resti veloce e non cada quando qualcosa si rompe.* Prima un acronimo che useremo: **QPS = Queries Per Second**, richieste al secondo — la misura base del carico.\n\n<figure style=\"margin:18px 0;text-align:center\">\n<svg viewBox=\"0 0 680 250\" style=\"max-width:100%;height:auto;font-family:inherit\">\n  <defs><marker id=\"ar\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.4\"/></marker></defs>\n  <g font-size=\"12.5\" fill=\"var(--ink)\" text-anchor=\"middle\">\n   <rect x=\"8\" y=\"103\" width=\"92\" height=\"40\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"54\" y=\"127\">Client</text>\n   <rect x=\"142\" y=\"103\" width=\"124\" height=\"40\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/><text x=\"204\" y=\"127\">Load Balancer</text>\n   <rect x=\"308\" y=\"26\" width=\"112\" height=\"36\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"48\">App server</text>\n   <rect x=\"308\" y=\"103\" width=\"112\" height=\"36\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"125\">App server</text>\n   <rect x=\"308\" y=\"180\" width=\"112\" height=\"36\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"202\">App server</text>\n   <rect x=\"462\" y=\"40\" width=\"126\" height=\"36\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/><text x=\"525\" y=\"62\">Cache (Redis)</text>\n   <rect x=\"462\" y=\"150\" width=\"104\" height=\"36\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"514\" y=\"172\">DB primary</text>\n   <rect x=\"600\" y=\"150\" width=\"74\" height=\"36\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"637\" y=\"172\">Replica</text>\n  </g>\n  <g stroke=\"var(--muted)\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#ar)\">\n   <path d=\"M100,123 L140,123\"/>\n   <path d=\"M266,118 L306,46\"/><path d=\"M266,123 L306,121\"/><path d=\"M266,128 L306,196\"/>\n   <path d=\"M420,44 L460,56\"/><path d=\"M420,121 L460,60\"/>\n   <path d=\"M420,127 L460,162\"/><path d=\"M420,198 L460,170\"/>\n   <path d=\"M566,168 L598,168\"/>\n  </g>\n</svg>\n<figcaption style=\"font-size:12px;color:var(--muted);margin-top:4px\">Le quattro leve in uno schema: Client → Load Balancer → App server (stateless, scalati orizzontalmente) → Cache + DB (con read-replica).</figcaption>\n</figure>\n\n---\n\n## 1. Scalabilità: verticale vs orizzontale\n\n**Scalare** = aumentare la capacità del sistema. Due modi:\n\n- **Verticale (scale up):** dai alla *stessa* macchina più risorse (CPU, RAM). Semplice (non cambi architettura), ma ha due difetti: c'è un **tetto fisico** (la macchina più grossa che esiste) e resta un **single point of failure** (SPOF) = un unico punto che, se si rompe, butta giù tutto.\n- **Orizzontale (scale out):** metti *più* macchine che lavorano in parallelo. Nessun tetto pratico (ne aggiungi altre) e **tolleranza ai guasti** (se una cade, le altre reggono). Il prezzo: devi (a) **distribuire le richieste** tra le macchine (→ load balancer, sezione 2) e (b) gestire lo **stato**.\n\n**Stateless — il concetto chiave.** Un server è *stateless* (\"senza stato\") se **non tiene in memoria informazioni sull'utente tra una richiesta e l'altra** (es. la sessione di login). Perché conta? Perché con lo scale out una richiesta dell'utente può finire su un server diverso ogni volta: se lo stato fosse nella memoria di *un* server, andrebbe perso. Soluzione: i server restano stateless e lo **stato si mette in uno store condiviso** che tutti raggiungono (una cache tipo Redis, o il database). Così ogni server è **intercambiabile**. Regola pratica dei sistemi moderni: **stateless + scale out**.\n\n---\n\n## 2. Load balancing\n\nUn **load balancer (LB)** è un componente che sta *davanti* a N server e smista ogni richiesta a uno di loro. Fa tre lavori: **spalma il carico**, **toglie dal giro i server morti** (li controlla con degli *health check*, piccole richieste periodiche \"sei vivo?\"), e permette di **rilasciare nuove versioni senza downtime** (togli un server, aggiorni, rimetti).\n\n**Come sceglie a quale server mandare (gli algoritmi):**\n- **Round-robin:** a turno, uno dopo l'altro (server 1, 2, 3, 1, 2, 3…). Semplice; presuppone che i server siano equivalenti.\n- **Least-connections:** manda la richiesta al server che in quel momento ha **meno connessioni attive** (cioè il più scarico). Meglio quando le richieste durano tempi molto diversi.\n- **IP-hash (sticky sessions):** calcola una funzione (*hash*) sull'IP dell'utente e usa il risultato per scegliere *sempre lo stesso* server per quell'utente. Serve se il server tiene stato locale — ma è una toppa: meglio essere stateless (sez. 1).\n\n**Due livelli di LB (dai livelli di rete che hai visto in Reti):**\n- **L4** (livello trasporto, TCP/UDP): smista guardando solo IP e porta. Velocissimo, ma \"cieco\" al contenuto.\n- **L7** (livello applicativo, HTTP): legge la richiesta HTTP, quindi può instradare **per contenuto** (es. `/api/*` a un gruppo di server, `/static/*` a un altro). Più intelligente, un po' più lento.\n\n---\n\n## 3. Caching\n\n**Cache** = una copia dei dati tenuta *vicino e veloce da leggere*, per **non rifare ogni volta un lavoro costoso** (una query pesante, una risposta di un LLM, un calcolo). \"Vicino\" e \"veloce\" perché tipicamente la cache sta in RAM (Redis, Memcached), leggere dalla RAM è ordini di grandezza più rapido che interrogare un DB su disco.\n\n**Dove si mette (dal più vicino all'utente al più lontano):** browser → CDN (sez. 4) → **cache applicativa** (Redis/Memcached, condivisa tra i server) → cache interna del DB.\n\n**Il problema vero è l'invalidazione:** quando il dato originale cambia, la copia in cache diventa **vecchia** (*stale*). Chi legge dalla cache rischia un dato non aggiornato. Le tre strategie classiche:\n- **TTL (Time To Live):** dai a ogni voce una **scadenza** (es. 60 secondi). Dopo, viene buttata e ricaricata dalla sorgente. Semplice; accetti che il dato possa essere vecchio *al massimo* di quel tempo.\n- **Write-through** (\"scrivi attraverso\"): ogni volta che scrivi un dato, lo scrivi **in cache E nel DB nello stesso momento**. La cache è **sempre fresca**, ma ogni scrittura è un po' più lenta (fa due scritture).\n- **Cache-aside** (\"cache di lato\", la più comune): l'app **legge prima dalla cache**; se il dato c'è (*cache hit*) lo usa; se non c'è (*cache miss*) lo legge dal DB e **riempie la cache** per la prossima volta. Semplice, ma il **primo** accesso è lento (miss) e, se un dato cambia nel DB, la cache può restare vecchia finché non scade il TTL.\n- (Cenno: **write-back** = scrivi solo in cache subito e nel DB dopo, in differita. Velocissimo in scrittura, ma se la cache muore prima di scaricare, **perdi dati**. Si usa solo dove la perdita è tollerabile.)\n\n**Hit ratio — la metrica della cache.** È la **frazione di richieste servite dalla cache** invece che dalla sorgente lenta:\n> **hit ratio = cache hit / (cache hit + cache miss)**\n\nEsempio: su 100 richieste, 90 trovano il dato in cache (hit) e 10 no (miss) → hit ratio = 90/100 = **0,90 (90%)**. Alto = la cache sta lavorando (meno carico sul DB, meno latenza); basso = la cache serve a poco (dati troppo vari o TTL troppo corto).\n\n---\n\n## 4. CDN (Content Delivery Network)\n\n**CDN** = una **rete di server distribuiti geograficamente** che tengono copie dei contenuti **statici** (immagini, JS, CSS, video) e li servono dal nodo **più vicino** all'utente. Se l'origine è a Francoforte e l'utente a São Paulo, il file arriva dal nodo CDN di São Paulo, non da Francoforte → **meno latenza** (meno strada da fare) e **meno carico sull'origine**. È concettualmente caching, ma su scala **geografica**.\n\n---\n\n## 5. Scaling del database (qui muore quasi sempre il sistema)\n\nIl DB è spesso il **collo di bottiglia**: i server web li scali facilmente, il DB no. Tre rimedi, **in ordine di quando li applichi**:\n\n1. **Indici (index).** Un indice è una **struttura dati aggiuntiva** (di solito un B-tree) che il DB tiene su una colonna per **trovare le righe senza scorrere tutta la tabella**. Senza indice, cercare \"utente con email X\" su 10 milioni di righe le legge *tutte* (scan completo, lentissimo); con un indice sull'email, ci arriva in pochi passi (come l'indice analitico di un libro). **Primo rimedio, quasi gratis.**\n2. **Read-replica (replica di lettura).** Una **copia del database** che riceve in continuazione gli aggiornamenti dal DB principale (*primary*) e serve **solo le letture**. Le app leggono dalle repliche e scrivono sul primary → alleggerisci il primary quando le letture sono molte più delle scritture (il caso tipico). Costo: le repliche sono aggiornate con un **piccolo ritardo** (*replication lag*), quindi una lettura potrebbe non vedere l'ultimissima scrittura.\n3. **Sharding (partizionamento).** Quando *un* DB non basta più nemmeno per le scritture, **spezzi i dati su più database** in base a una chiave (*shard key*): es. utenti A-M sul DB 1, N-Z sul DB 2. Ogni shard regge una fetta del carico. Potente ma **complesso** (le query che attraversano più shard diventano difficili) → **ultima spiaggia**, non la prima mossa.\n\nEcco perché la frase \"prima indici e read-replica, poi (se serve) sharding\" ha un senso preciso: sono tre rimedi di **costo/complessità crescente**, e li applichi in quest'ordine.\n\n---\n\n## Esempi concreti\n\n**Esempio A — il tuo bot preventivi (Glacom) diventa virale, 500 QPS.** Nell'ordine:\n1. App **stateless** dietro **load balancer**, scale out a 3-4 istanze.\n2. Le risposte/documenti già generati li **cachi** (cache-aside + TTL): stesso input → stessa risposta, niente ricomputo del LLM.\n3. Statici (loghi, template) su **CDN**.\n4. Il DB rallenta → **indici** sulle colonne cercate, poi **read-replica** per le letture; **sharding** solo se davvero esplode.\n\n**Esempio B — un feed di notizie letto da tutti (poche scritture, moltissime letture).** Qui il **caching** e le **read-replica** fanno il 90% del lavoro: la stessa home page servita a migliaia di utenti si calcola una volta e si mette in cache (hit ratio altissimo).\n\n**Esempio C — una chat in tempo reale.** Il caching serve meno; contano di più i **WebSocket** (connessione persistente, → topic adiacente `xc-sd-async`) e i server stateless con lo stato della sessione in Redis.\n\n## Case study reale\n**Instagram agli inizi:** 3 ingegneri, milioni di utenti. La ricetta era esattamente questa — servizi **stateless** dietro **load balancer**, **caching** aggressivo (Memcached, hit ratio altissimo), **CDN** per le foto, **Postgres con read-replica** e poi sharding. Niente magia: le leve di sopra, applicate nell'ordine giusto.\n\n## Completeness check (integrato da me)\nOltre alle leve: a un colloquio di system design il **metodo** conta quanto le nozioni. Passi: (1) **chiarisci requisiti e stime** (quanti QPS? quanti dati? read-heavy o write-heavy?), (2) disegna lo **schema alto** (client → LB → server → cache → DB), (3) approfondisci i **colli di bottiglia**, (4) discuti i **trade-off**. Non esiste \"la\" risposta giusta: esistono scelte **motivate** dai trade-off (es. read-replica = scali le letture *ma* accetti replication lag).\n\n## Fonti\n- **System Design Primer** — github.com/donnemartin/system-design-primer (riferimento gratuito più usato)\n- **Designing Data-Intensive Applications**, Martin Kleppmann (il libro di riferimento su dati/scala)\n- **AWS Well-Architected Framework** — aws.amazon.com/architecture/well-architected\n- **High Scalability** — highscalability.com (case study reali)\n\n## Concetti adiacenti (dove andare dopo)\n- `xc-sd-data` — Dati a scala: sharding, replicazione, **CAP theorem** (collegato a Basi di Dati → transazioni/ACID)\n- `xc-sd-async` — Code, messaging, WebSocket (collegato a OS → IPC)\n- `cloud-arch` — Architetture cloud e scalabilità\n- `db-index` — Indici e ottimizzazione query (approfondimento del punto 5.1)", "quiz": [{"q": "Cosa significa **QPS**?", "a": "**Queries Per Second**, richieste al secondo: la misura base del carico."}, {"q": "Scaling **verticale** vs **orizzontale**: definisci entrambi e di' quale tollera il guasto di una macchina, e perché.", "a": "**Verticale** = più risorse alla stessa macchina; **orizzontale** = più macchine in parallelo. **L'orizzontale** tollera il guasto: se una macchina cade le altre reggono; la verticale ha un unico punto di guasto (SPOF)."}, {"q": "Cosa vuol dire che un server è **stateless**, e *dove* si mette allora lo stato dell'utente?", "a": "Stateless = **non tiene in memoria info sull'utente tra una richiesta e l'altra**. Lo stato si mette in uno **store condiviso** (cache tipo Redis, o il DB), così ogni server è intercambiabile."}, {"q": "A cosa serve un **load balancer** e come fa a evitare di mandare richieste a un server morto?", "a": "Smista le richieste tra N server (spalma il carico, deploy senza downtime). Evita i server morti con gli **health check**: controlli periodici \"sei vivo?\"; se un server non risponde, lo toglie dal giro."}, {"q": "Differenza tra load balancer **L4** e **L7**?", "a": "**L4** guarda solo IP+porta (livello trasporto): veloce ma cieco al contenuto. **L7** legge l'HTTP (livello applicativo): può instradare per path/header, più intelligente e un po' più lento."}, {"q": "Algoritmo **round-robin** vs **least-connections**: come scelgono il server?", "a": "**Round-robin**: a turno, uno dopo l'altro. **Least-connections**: al server con **meno connessioni attive** in quel momento (il più scarico)."}, {"q": "Scrivi la **formula dell'hit ratio** e calcolalo se su 200 richieste 150 sono hit.", "a": "**hit ratio = hit / (hit + miss)**. Con 150 hit su 200 richieste (50 miss): 150/200 = **0,75 (75%)**."}, {"q": "**Write-through** vs **cache-aside**: come funziona ciascuna e qual è il difetto di ciascuna?", "a": "**Write-through**: a ogni scrittura scrivi in **cache e DB insieme** → cache sempre fresca, ma scrittura più lenta. **Cache-aside**: leggi dalla cache, se manca (miss) leggi dal DB e riempi la cache → semplice, ma primo accesso lento e dato potenzialmente vecchio fino al TTL."}, {"q": "Cos'è un **indice** su un database e perché rende le query più veloci?", "a": "È una **struttura dati aggiuntiva** (B-tree) su una colonna che permette di **trovare le righe senza scorrere tutta la tabella** (come l'indice di un libro): da uno scan completo a pochi passi."}, {"q": "Metti in ordine di **costo/complessità crescente**: sharding, indici, read-replica. Spiega in una riga cosa fa ciascuno.", "a": "In ordine crescente: **indici** (struttura per query veloci, quasi gratis) → **read-replica** (copia del DB che serve le letture, alleggerisce il primary, ha replication lag) → **sharding** (spezzi i dati su più DB per chiave, regge anche le scritture ma è complesso: ultima spiaggia)."}]}, {"day": 2, "topic_id": "bp-canvas", "title": "Business Model Canvas — descrivere un modello di business su una pagina", "course": "Business Planning / Imprenditorialità", "area": "management", "adjacent": ["bp-market", "bp-financials", "inn-npd", "strat-frameworks"], "body": "# Business Model Canvas\n\n> **Perché oggi:** è lo strumento di base per **ragionare un business** (l'hai usato per MaiCare e per Samec). Serve a mettere su **una pagina** *come* un'azienda crea, consegna e cattura valore — e a vedere i buchi prima di costruire.\n\n## Cos'è\nIl **Business Model Canvas (BMC)** è un framework, ideato da **Alexander Osterwalder**, che descrive un modello di business con **9 blocchi** su un unico foglio. Non è un business plan (documento lungo): è una **mappa visiva** per progettare, discutere e iterare velocemente. Idea chiave: un modello di business si può disegnare, non solo raccontare.\n\n## I 9 blocchi (ognuno spiegato)\n\n**Lato destro = il mercato/valore. Lato sinistro = l'infrastruttura/costo. In mezzo, la value proposition.**\n\n1. **Customer Segments (segmenti di clientela):** *per chi* crei valore. Chi sono i gruppi distinti di clienti/utenti. Un modello può servire più segmenti (es. un marketplace serve *compratori* e *venditori* — mercato \"a due lati\").\n2. **Value Propositions (proposte di valore):** *quale problema risolvi* o quale bisogno soddisfi, e perché il cliente sceglie te. È il cuore: il pacchetto di prodotti/servizi che crea valore per un segmento (es. \"risparmio di tempo\", \"prezzo più basso\", \"meno ansia\").\n3. **Channels (canali):** *come raggiungi e consegni* al cliente — vendita, distribuzione, comunicazione (sito, app, negozio, forza vendita, partner).\n4. **Customer Relationships (relazioni con i clienti):** *che tipo di rapporto* stabilisci (self-service, assistenza dedicata, community, automazione) e come acquisisci/mantieni i clienti.\n5. **Revenue Streams (flussi di ricavo):** *come fai i soldi*. I meccanismi con cui il valore diventa denaro: vendita una tantum, **subscription** (abbonamento ricorrente), pay-per-use, licenza, commissione, pubblicità.\n6. **Key Resources (risorse chiave):** *cosa ti serve avere* per far funzionare il modello — asset fisici (impianti), intellettuali (brevetti, dati, brand), umani (talento), finanziari.\n7. **Key Activities (attività chiave):** *cosa devi saper fare* — le attività più importanti (produzione, sviluppo software, gestione di una piattaforma, R&S).\n8. **Key Partnerships (partnership chiave):** *chi ti aiuta da fuori* — fornitori e partner che forniscono risorse o attività che non fai internamente (per ridurre rischio/costo o accedere a competenze).\n9. **Cost Structure (struttura dei costi):** *quanto e cosa ti costa* far girare tutto. Si distingue tra **cost-driven** (minimizzare i costi, es. low-cost) e **value-driven** (puntare sul valore anche a costi alti), e tra **costi fissi** (non cambiano col volume) e **variabili** (crescono col volume).\n\n**Come si legge insieme:** i blocchi di destra (segmenti, value proposition, canali, relazioni, ricavi) dicono *cosa offri e a chi e come guadagni*; quelli di sinistra (risorse, attività, partner, costi) dicono *cosa serve per erogarlo*. Un modello sano: i ricavi (5) coprono i costi (9), e ogni value proposition (2) è agganciata a un segmento reale (1).\n\n## Esempio concreto\n**MaiCare (la tua startup), in forma BMC:**\n- *Segmenti:* pazienti con patologie gineco-pelviche croniche **+** medici/cliniche (due lati). *Value prop:* per le pazienti, tracciare sintomi e portare dati ordinati alla visita; per i medici, uno strumento di fidelizzazione e dati aggregati per ricerca. *Canali:* app + partnership con cliniche. *Ricavi:* subscription freemium (pazienti) + sponsorizzazione medici + partnership dati (modello **B2B2C**). *Risorse chiave:* la piattaforma e i dati. *Attività:* sviluppo software, gestione compliance. *Partner:* cliniche, centri di ricerca. *Costi:* sviluppo, infrastruttura, regolamentazione.\n\n## Notable use cases (grandi aziende)\n- **Netflix:** *ricavi* = subscription ricorrente (non vendita di singoli film); *risorse/attività chiave* = contenuti (licenze + produzione originale) e l'algoritmo di raccomandazione; *value prop* = \"tutto quello che vuoi, quando vuoi, senza pubblicità\". Il modello a abbonamento è ciò che lo distingue dal noleggio classico.\n- **Airbnb:** *mercato a due lati* (host e ospiti); *partner chiave* = gli host (che forniscono l'\"inventario\" senza che Airbnb possieda immobili); *ricavi* = commissione su ogni prenotazione; *risorsa chiave* = la piattaforma e la fiducia (recensioni).\n- **Ryanair:** *cost structure* estrema (cost-driven): tolgono tutto il superfluo per tenere i prezzi bassi; *ricavi* = biglietto basso + ancillary (bagagli, priorità); *value prop* = \"volare al prezzo più basso\".\n\n## Completeness check (integrato da me)\nIl BMC descrive *com'è* un modello, non *se funziona*: va accoppiato con (a) la **Value Proposition Canvas** (zoom sul fit tra ciò che offri e i \"job/pain/gain\" del cliente — l'hai usata per Samec), (b) i **numeri** (i ricavi coprono i costi? → lezione `bp-financials`), e (c) la **validazione** sul campo (interviste, non ipotesi). Un BMC bello ma senza clienti reali è un disegno, non un business.\n\n## Fonti\n- **Strategyzer** — strategyzer.com (i creatori del canvas, template gratuiti)\n- **Business Model Generation**, Osterwalder & Pigneur (il libro di riferimento)\n- **Value Proposition Design**, stessi autori (il complemento sul fit valore-cliente)\n\n## Concetti adiacenti\n- `bp-market` — Market analysis (TAM/SAM/SOM): dimensiona il segmento\n- `bp-financials` — Financial modeling: verifica che ricavi > costi\n- `inn-npd` — New Product Development\n- `strat-frameworks` — Strategia (il BMC descrive il \"come\", la strategia il \"perché vinci\")", "quiz": [{"q": "Chi ha ideato il Business Model Canvas e quanti blocchi ha?", "a": "**Alexander Osterwalder**; **9** blocchi."}, {"q": "Qual è la differenza tra un Business Model Canvas e un business plan?", "a": "Il **BMC** è una **mappa visiva su una pagina** per progettare/iterare velocemente; il **business plan** è un documento lungo e dettagliato. Il canvas serve a ragionare e trovare i buchi, non a scrivere tutto."}, {"q": "Nel BMC, cosa descrive il blocco **Value Propositions**?", "a": "Il **problema che risolvi / bisogno che soddisfi** per un segmento, cioè perché il cliente sceglie te (il pacchetto di prodotti/servizi che crea valore)."}, {"q": "Cosa sono i **Revenue Streams** e fai due esempi di meccanismi di ricavo diversi.", "a": "I **flussi di ricavo** = come il valore diventa denaro. Esempi: **subscription** (abbonamento ricorrente) e **vendita una tantum** (o pay-per-use, commissione, licenza, pubblicità)."}, {"q": "Cosa significa che un mercato è \"a due lati\"? Fai un esempio dai casi visti.", "a": "Un mercato in cui servi **due segmenti distinti che si servono a vicenda** tramite te (es. Airbnb: host e ospiti; MaiCare: pazienti e medici)."}, {"q": "Differenza tra costi **fissi** e **variabili**?", "a": "**Fissi** = non cambiano col volume di produzione/vendita (es. affitto). **Variabili** = crescono col volume (es. materie prime per unità)."}, {"q": "Cost structure **cost-driven** vs **value-driven**: spiega entrambe.", "a": "**Cost-driven:** minimizzi i costi il più possibile (modello low-cost, es. Ryanair). **Value-driven:** punti sul valore/qualità anche accettando costi alti (es. un premium)."}, {"q": "Nel modello di Netflix, qual è il flusso di ricavo principale e perché lo distingue dal noleggio classico?", "a": "La **subscription ricorrente**: paghi un abbonamento per accesso illimitato, non il singolo film. È ciò che lo distingue dal noleggio (pay-per-title) classico."}, {"q": "Perché per Airbnb gli **host** sono un *key partner* e non un *key resource* posseduto?", "a": "Perché Airbnb **non li possiede**: gli host forniscono l'inventario (le case) dall'esterno → sono un partner che porta risorse, non un asset di proprietà dell'azienda."}, {"q": "Cosa aggiunge la **Value Proposition Canvas** rispetto al BMC?", "a": "Fa lo **zoom sul fit** tra ciò che offri e i **job / pain / gain** del cliente — verifica che la value proposition risponda davvero a bisogni reali, dettaglio che il BMC da solo non approfondisce."}]}, {"day": 3, "topic_id": "xc-llm-fundamentals", "title": "Come funziona un LLM — token, embedding, transformer, attention", "course": "LLM / AI Engineering", "area": "cross-cutting", "adjacent": ["xc-llm-rag", "xc-llm-prompting", "ml-nn"], "body": "# Come funziona un LLM\n\n> **Perché oggi:** i ruoli che punti (AI Engineer / LLM Engineer) e il lavoro a Glacom/MaiCare ruotano intorno agli LLM — il bot preventivi, il triage dei ticket, gli assistenti clinici sono tutti costruiti *sopra* un modello linguistico. Sapere **cosa** succede davvero dentro (non trattarlo come una scatola magica) è ciò che distingue chi *usa* l'API da chi *progetta* il sistema: ti serve per scegliere il modello giusto, capire perché \"allucina\", dimensionare i costi e sapere quando serve la RAG.\n\n## Cos'è un LLM\n\n**LLM = Large Language Model** (\"grande modello linguistico\"). È un modello statistico, addestrato su enormi quantità di testo, che ha imparato a fare **una sola cosa**, ripetuta miliardi di volte: **dato un pezzo di testo, predire quale sarà il token (pezzo di parola) successivo più probabile.**\n\nSembra poco, ma da questa singola capacità — \"indovina la prossima parola\" — emergono traduzione, riassunto, scrittura di codice, risposta a domande. Il motivo: per predire *davvero bene* la parola successiva su tutto il testo del mondo, il modello è **costretto** a imparare grammatica, fatti, ragionamento, stile. La predizione è il compito; la \"comprensione\" è l'effetto collaterale necessario.\n\nUn punto chiave subito, perché sfata la magia: l'LLM **non ha un database di risposte** e **non \"cerca\" nulla**. Ha dei **parametri** (numeri, detti *pesi*) fissati durante l'addestramento, e ogni risposta è **calcolata** al volo facendo passare l'input attraverso quei numeri. È un calcolo, non una ricerca.\n\nLa pipeline completa, dall'input alla risposta, è questa:\n\n<figure style=\"margin:18px 0;text-align:center\">\n<svg viewBox=\"0 0 720 250\" style=\"max-width:100%;height:auto;font-family:inherit\">\n  <defs><marker id=\"ar1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.4\"/></marker></defs>\n  <g font-size=\"12\" fill=\"var(--ink)\" text-anchor=\"middle\">\n   <rect x=\"8\" y=\"90\" width=\"96\" height=\"42\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"56\" y=\"108\">Testo</text><text x=\"56\" y=\"123\" font-size=\"10.5\" fill=\"var(--muted)\">\"Il cielo è\"</text>\n   <rect x=\"128\" y=\"90\" width=\"112\" height=\"42\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"184\" y=\"108\">Tokenizzazione</text><text x=\"184\" y=\"123\" font-size=\"10.5\" fill=\"var(--muted)\">testo → token</text>\n   <rect x=\"264\" y=\"90\" width=\"112\" height=\"42\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"320\" y=\"108\">Embedding</text><text x=\"320\" y=\"123\" font-size=\"10.5\" fill=\"var(--muted)\">token → vettori</text>\n   <rect x=\"400\" y=\"90\" width=\"120\" height=\"42\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/><text x=\"460\" y=\"108\">Transformer</text><text x=\"460\" y=\"123\" font-size=\"10.5\" fill=\"var(--muted)\">N layer</text>\n   <rect x=\"544\" y=\"72\" width=\"120\" height=\"42\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"604\" y=\"90\">Probabilità</text><text x=\"604\" y=\"105\" font-size=\"10.5\" fill=\"var(--muted)\">su prossimo token</text>\n   <rect x=\"544\" y=\"150\" width=\"120\" height=\"42\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/><text x=\"604\" y=\"168\">Token scelto</text><text x=\"604\" y=\"183\" font-size=\"10.5\" fill=\"var(--muted)\">\"azzurro\"</text>\n  </g>\n  <g stroke=\"var(--muted)\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#ar1)\">\n   <path d=\"M104,111 L126,111\"/>\n   <path d=\"M240,111 L262,111\"/>\n   <path d=\"M376,111 L398,111\"/>\n   <path d=\"M520,105 L542,97\"/>\n   <path d=\"M604,114 L604,148\"/>\n  </g>\n  <g stroke=\"var(--accent)\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#ar1)\" stroke-dasharray=\"4 3\">\n   <path d=\"M604,192 L604,222 L184,222 L184,134\"/>\n  </g>\n  <text x=\"380\" y=\"238\" font-size=\"10.5\" fill=\"var(--accent)\" text-anchor=\"middle\">autoregressivo: il token scelto viene riaccodato all'input e il ciclo riparte</text>\n</svg>\n<figcaption style=\"font-size:12px;color:var(--muted);margin-top:4px\">La pipeline: Testo → Tokenizzazione → Embedding → Transformer (N layer) → probabilità sul prossimo token → token scelto → si ripete (freccia tratteggiata: ciclo autoregressivo).</figcaption>\n</figure>\n\n---\n\n## 1. Token e tokenizzazione\n\nIl modello **non vede lettere né parole intere**: vede **token**. Un **token** è un *pezzo di parola* — spesso una radice, un suffisso o una parola breve. Il **tokenizer** (\"tokenizzatore\") è il pezzo di software che, prima di tutto, spezza il testo in questi pezzi e li converte in numeri interi (ogni token ha un ID nel *vocabolario* del modello, cioè la lista di tutti i token che conosce, tipicamente decine di migliaia).\n\nEsempio (indicativo): la parola `tokenizzazione` potrebbe diventare `token` + `izz` + `azione` → 3 token. `Ciao` è 1 token. Anche lo **spazio** e la **punteggiatura** contano come (parte di) token.\n\n**Perché non parole intere?** Tre motivi:\n- **Le parole sono troppe.** Ogni lingua ha centinaia di migliaia di parole, più nomi propri, refusi, parole nuove. Un vocabolario di sole parole intere sarebbe gigantesco e comunque incompleto.\n- **Parole mai viste.** Con le parole intere, una parola nuova (es. un termine tecnico o un errore di battitura) sarebbe *sconosciuta* e ingestibile. Con i pezzi, il modello la ricompone da sotto-pezzi che conosce.\n- **Efficienza.** I pezzi frequenti (come `azione`, `ing`, `pre`) si riusano in migliaia di parole diverse: il vocabolario resta compatto ma copre tutto.\n\nL'algoritmo classico che sceglie *come* spezzare si chiama **BPE = Byte Pair Encoding** (\"codifica a coppie di byte\"): parte dai singoli caratteri e, guardando tanto testo, **fonde ripetutamente le coppie di simboli più frequenti** in un unico token. Così le sequenze comuni diventano un token solo, quelle rare restano spezzate. Questo tipo di token (più piccolo della parola, più grande della lettera) si chiama **subword** (\"sotto-parola\").\n\n**Context window (finestra di contesto).** È il numero **massimo di token** che il modello può considerare **tutti insieme** in una singola chiamata — include sia il tuo input (prompt) sia la risposta che sta generando. Tutto ciò che eccede la finestra **non esiste** per il modello: se una conversazione diventa più lunga della finestra, le parti più vecchie vengono tagliate e il modello \"le dimentica\". Regola pratica per stimare: in inglese ~1 token ≈ 0,75 parole (in italiano un po' meno per token); quindi una finestra da 8.000 token ≈ ~6.000 parole tra domanda e risposta.\n\n---\n\n## 2. Embedding\n\nUn numero-ID di un token (es. il token `cane` = ID 4711) non dice **nulla** sul significato: 4711 non è \"più vicino\" a 4712 in senso di significato, è solo un indice. Serve un modo per rappresentare il *significato* in forma numerica. È l'**embedding**.\n\nUn **embedding** è un **vettore di numeri** (una lista ordinata di valori, es. 768 o 1536 numeri) associato a un token, che ne rappresenta il significato in uno **spazio geometrico**. Il modello impara questi vettori durante l'addestramento. La proprietà fondamentale, e il motivo per cui funziona:\n\n> **Token/parole con significato simile finiscono con vettori vicini nello spazio; significati diversi → vettori lontani.**\n\nCosì `cane`, `gatto`, `cucciolo` stanno in una regione vicina; `banca`, `mutuo`, `interesse` in un'altra. Il numero di valori nel vettore è la **dimensione** dell'embedding (es. 768, 1024, 3072): più dimensioni = più \"sfumature\" di significato rappresentabili, ma vettori più pesanti da calcolare e memorizzare.\n\n**Come si misura la \"vicinanza\"?** Con la **similarità coseno (cosine similarity)**: si misura l'**angolo** tra due vettori, non la loro lunghezza. Formalmente è il coseno dell'angolo tra i due vettori:\n\n> **cosine similarity(A, B) = (A · B) / (‖A‖ · ‖B‖)**\n\ndove `A · B` è il **prodotto scalare** (somma dei prodotti componente per componente) e `‖A‖` è la **lunghezza** (norma) del vettore. Il risultato va da **−1 a +1**:\n- **+1** = stessa direzione → significati molto simili;\n- **0** = perpendicolari → non correlati;\n- **−1** = direzioni opposte.\n\nSi guarda l'**angolo** (e non la distanza in linea retta) perché conta la *direzione* del significato, non quanto è \"lungo\" il vettore. Questa è la stessa matematica che regge la **ricerca semantica** e la RAG (topic `xc-llm-rag`): trovi i testi rilevanti cercando gli embedding con similarità coseno più alta rispetto alla domanda.\n\n---\n\n## 3. Transformer e self-attention\n\nIl **transformer** (\"trasformatore\") è l'**architettura di rete neurale** che sta dentro ogni LLM moderno, introdotta nel 2017 dal paper *\"Attention Is All You Need\"*. Il suo cuore è un meccanismo chiamato **self-attention** (\"auto-attenzione\").\n\n**L'intuizione dell'attention.** Il significato di una parola dipende dalle *altre* parole intorno. Nella frase *\"ho versato il vino nel bicchiere finché **non** fu pieno\"*, per capire cosa era pieno il modello deve collegare \"pieno\" al \"bicchiere\", non al \"vino\". La **self-attention** fa esattamente questo: per ogni token, **guarda tutti gli altri token della finestra e decide quali sono rilevanti**, dando a ciascuno un **peso** (un'importanza). Poi rappresenta ogni token come una **miscela pesata** delle informazioni dei token rilevanti. È \"self\" (auto) perché i token di una stessa sequenza si guardano tra loro.\n\n**Come pesa: query, key, value (a parole).** Per ogni token il modello calcola tre vettori:\n- **Query (Q)** = \"cosa sto cercando?\" — la domanda che questo token pone.\n- **Key (K)** = \"cosa offro / di cosa parlo?\" — l'etichetta che ogni token espone.\n- **Value (V)** = \"quale informazione porto?\" — il contenuto vero e proprio.\n\nIl meccanismo confronta la **Query** di un token con le **Key** di tutti gli altri (con un prodotto scalare: Query e Key simili → punteggio alto). Quei punteggi, normalizzati in probabilità, diventano i **pesi di attenzione**; con quei pesi si fa la **media pesata dei Value**. Metafora: in una stanza fai una domanda (Query); ogni persona ha un cartello con l'argomento che conosce (Key); ascolti di più chi ha il cartello più pertinente e prendi la sua informazione (Value).\n\n<figure style=\"margin:18px 0;text-align:center\">\n<svg viewBox=\"0 0 620 170\" style=\"max-width:100%;height:auto;font-family:inherit\">\n  <defs><marker id=\"ar2\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.6\"/></marker></defs>\n  <g font-size=\"13\" fill=\"var(--ink)\" text-anchor=\"middle\">\n   <rect x=\"12\"  y=\"100\" width=\"70\" height=\"34\" rx=\"8\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"47\"  y=\"122\">The</text>\n   <rect x=\"98\"  y=\"100\" width=\"82\" height=\"34\" rx=\"8\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/><text x=\"139\" y=\"122\">animal</text>\n   <rect x=\"196\" y=\"100\" width=\"80\" height=\"34\" rx=\"8\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"236\" y=\"122\">didn't</text>\n   <rect x=\"292\" y=\"100\" width=\"76\" height=\"34\" rx=\"8\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"330\" y=\"122\">cross</text>\n   <rect x=\"384\" y=\"100\" width=\"72\" height=\"34\" rx=\"8\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"420\" y=\"122\">the</text>\n   <rect x=\"472\" y=\"100\" width=\"86\" height=\"34\" rx=\"8\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"515\" y=\"122\">street</text>\n   <rect x=\"230\" y=\"18\"  width=\"76\" height=\"34\" rx=\"8\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/><text x=\"268\" y=\"40\">it</text>\n  </g>\n  <g stroke=\"var(--accent)\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#ar2)\">\n   <path d=\"M258,52 C210,72 165,82 141,98\"/>\n  </g>\n  <g stroke=\"var(--muted)\" stroke-width=\"1\" fill=\"none\" marker-end=\"url(#ar2)\" opacity=\"0.45\" stroke-dasharray=\"3 3\">\n   <path d=\"M272,52 C300,72 320,82 332,98\"/>\n   <path d=\"M285,50 C360,74 470,82 512,98\"/>\n  </g>\n  <text x=\"150\" y=\"80\" font-size=\"11\" fill=\"var(--accent)\" text-anchor=\"middle\">peso alto</text>\n</svg>\n<figcaption style=\"font-size:12px;color:var(--muted);margin-top:4px\">Self-attention: per capire a chi si riferisce \"it\", il modello attende con peso alto \"the animal\" (freccia piena) e con peso basso gli altri token (tratteggiate). Così \"it\" eredita il significato di \"animal\".</figcaption>\n</figure>\n\n**Multi-head attention (attenzione a più teste).** Non si fa una sola attention, ma **molte in parallelo** (le *head*, \"teste\"), ciascuna con le proprie Query/Key/Value. Ogni testa può specializzarsi su un tipo di relazione diversa: una segue i legami grammaticali (soggetto↔verbo), un'altra i riferimenti (pronome↔nome), un'altra ancora il tema. I risultati delle teste vengono poi ricombinati. È come avere più \"punti di vista\" simultanei sulla stessa frase.\n\n**Positional encoding (codifica di posizione).** L'attention di per sé è \"cieca all'ordine\": guarderebbe i token come un insieme, non come una sequenza. Ma *\"il cane morde l'uomo\"* ≠ *\"l'uomo morde il cane\"*. Per questo si aggiunge a ogni embedding un'informazione sulla **posizione** del token nella sequenza (*positional encoding*), così il modello sa **chi viene prima e chi dopo**.\n\n**Perché il transformer batte le RNN.** Prima dei transformer si usavano le **RNN = Recurrent Neural Network** (\"reti neurali ricorrenti\"), che leggono il testo **una parola alla volta in sequenza**, portandosi dietro uno \"stato\" che riassume il passato. Due limiti gravi:\n- **Niente parallelismo:** dovendo processare in ordine, non puoi calcolare la parola 100 finché non hai fatto la 99. Addestramento lento.\n- **Dipendenze lunghe:** l'informazione di inizio frase si \"diluisce\" mano a mano che passa di stato in stato, e su testi lunghi si perde.\n\nIl transformer risolve entrambi: la self-attention **guarda tutti i token contemporaneamente** (→ enorme **parallelismo**, sfrutta le GPU, addestramento veloce) e collega direttamente due token **a qualsiasi distanza** con un solo passaggio (→ **dipendenze lunghe** gestite bene). È questa combinazione — parallelismo + dipendenze lunghe — ad aver reso possibili i modelli enormi di oggi.\n\n**N layer.** Un transformer non ha un solo blocco di attention: ne impila **N** (decine o centinaia). Ogni layer raffina la rappresentazione prodotta dal precedente: i primi layer catturano relazioni locali (grammatica), quelli profondi concetti astratti e ragionamento.\n\n---\n\n## 4. Come nasce la risposta (decoding)\n\nEcco il punto che smitizza tutto: **l'LLM genera la risposta un token alla volta**, e ogni token è una nuova predizione basata su *tutto ciò che c'è finora* (il tuo prompt + i token già generati). Questo si chiama generazione **autoregressiva** (\"auto-regressiva\": si regge sul proprio output precedente).\n\nIl ciclo, passo per passo:\n1. L'input attuale passa attraverso i transformer (sez. 3).\n2. All'ultimo strato il modello produce un punteggio grezzo (detto *logit*) **per ogni token del vocabolario**: \"quanto è plausibile ciascun token come prossimo?\".\n3. Questi punteggi passano nella **softmax**, una funzione che li trasforma in una **distribuzione di probabilità**: tutti valori tra 0 e 1 che **sommano a 1**. Es. `azzurro` 0,62; `sereno` 0,15; `grigio` 0,08; ...\n4. Si **sceglie un token** da questa distribuzione (come, sotto).\n5. Il token scelto viene **accodato all'input** e si **torna al passo 1**. Si ripete finché non esce un token speciale di \"fine\" o si raggiunge il limite.\n\n**Come si sceglie il token al passo 4 — le strategie di decoding:**\n- **Greedy** (\"goloso\"): prendi **sempre** il token con probabilità più alta. Deterministico (stesso input → stessa uscita), ma tende a essere ripetitivo e piatto.\n- **Sampling** (\"campionamento\"): **estrai a sorte** il token *rispettando le probabilità* (un token a 0,62 esce ~62% delle volte). Introduce varietà e creatività, ma anche imprevedibilità.\n\nDue manopole controllano quanto il sampling è \"audace\":\n\n- **Temperature (temperatura).** Un numero (tipicamente 0–2) che **appiattisce o accentua** la distribuzione prima di estrarre. **Bassa (→0):** accentua i picchi, il modello va quasi sempre sul token più probabile → risposte **prevedibili, precise, ripetibili** (di fatto tende al greedy). **Alta (>1):** appiattisce le probabilità, dà chance anche ai token improbabili → risposte **creative, varie, ma più a rischio di errori/incoerenze**. Regola pratica: bassa per compiti fattuali (estrazione dati, classificazione ticket), più alta per brainstorming e scrittura creativa.\n- **Top-p (nucleus sampling).** Invece di considerare tutti i token, tieni solo i **più probabili la cui probabilità cumulata raggiunge p** (es. p = 0,9 → il \"nucleo\" che copre il 90% della probabilità) e scarti la coda lunga di token improbabili. Estrai solo da quel nucleo. Evita che, per sfortuna, esca un token assurdo dalla coda, mantenendo però varietà. (Parente: **top-k**, che tiene i k token più probabili in numero fisso.)\n\n**In pratica a Glacom/MaiCare:** per il triage dei ticket o l'estrazione di dati strutturati vuoi **temperature bassa** (deterministico, ripetibile); per generare bozze di testo o suggerimenti vuoi temperature media con top-p.\n\n---\n\n## 5. Addestramento (a grandi linee)\n\nCome impara un LLM a fare tutto questo? In tre fasi.\n\n**a) Pre-training (pre-addestramento).** La fase principale, la più costosa. Il modello legge **enormi quantità di testo** (libri, siti web, codice) e viene allenato su un unico compito: **predire il token successivo**. Ogni volta che sbaglia la predizione, i suoi **parametri (pesi)** vengono aggiustati un pochino (via un algoritmo di ottimizzazione). Ripetuto su miliardi di frasi, il modello finisce per \"assorbire\" grammatica, fatti e schemi di ragionamento. **I parametri sono proprio questi numeri** — i pesi delle connessioni della rete — ed è lì che vive tutta la \"conoscenza\" del modello.\n\n**b) Instruction tuning (messa a punto sulle istruzioni).** Un modello solo pre-addestrato sa completare testo, ma non necessariamente **seguire istruzioni** o rispondere in modo utile. Lo si affina ulteriormente su esempi del tipo *(istruzione → risposta desiderata)*, così impara il formato \"assistente che risponde a una richiesta\".\n\n**c) RLHF = Reinforcement Learning from Human Feedback** (\"apprendimento per rinforzo da feedback umano\"). Serve ad allineare il modello a ciò che gli umani considerano **utile, onesto e innocuo**. Come funziona, a grandi linee: si mostrano a delle **persone** più risposte del modello alla stessa domanda e loro le **ordinano dalla migliore alla peggiore**. Con queste preferenze si addestra un **reward model** (\"modello di ricompensa\") che impara a dare un punteggio alle risposte; poi, con l'**apprendimento per rinforzo** (*reinforcement learning*: il modello riceve una \"ricompensa\" quando fa bene e aggiusta il comportamento per massimizzarla), si spinge l'LLM a produrre risposte che il reward model valuta alte. È la fase che rende un modello grezzo un **assistente educato e allineato**.\n\n---\n\n## Numeri e ordini di grandezza\n\n**Context window tipiche.** Si va da poche migliaia di token dei modelli più vecchi fino a **centinaia di migliaia / milioni** di token nei modelli recenti (l'ordine di grandezza cresce di anno in anno). Più contesto = puoi dargli documenti lunghi interi, ma costa di più (paghi ~per token) e la finestra resta comunque **finita**.\n\n**Cosa vuol dire \"7B / 70B parametri\".** Il numero di **parametri** (i pesi, sez. 5) è la misura della \"taglia\" del modello. **B = Billion = miliardi.** Quindi:\n- **7B** = **7 miliardi** di parametri — modello \"piccolo\", gira anche su hardware modesto, veloce ed economico, buono per compiti semplici o self-hosting (es. sul server con vLLM).\n- **70B** = **70 miliardi** — molto più capace su ragionamento e compiti complessi, ma richiede molta più memoria/GPU ed è più lento e costoso.\n\nRegola generale (con eccezioni): **più parametri → più capacità, ma più costo e latenza.** La scelta della taglia è un trade-off ingegneristico, esattamente come dimensionare un server.\n\n---\n\n## Notable use cases (grandi aziende)\n\nSolo fatti pubblici e generali, senza dettagli tecnici proprietari:\n\n- **GPT — OpenAI.** La famiglia di modelli (**GPT = Generative Pre-trained Transformer**) resa celebre da ChatGPT, l'assistente che ha portato gli LLM al grande pubblico. Offerti soprattutto via API/prodotto (closed-weight).\n- **Gemini — Google (DeepMind).** Famiglia di modelli di Google, integrata nei suoi prodotti e disponibile via API; noti per essere **multimodali** (testo, immagini, audio).\n- **Claude — Anthropic.** Famiglia di assistenti con forte enfasi su **sicurezza e allineamento** (è il modello che stai usando ora), offerta via API e prodotto.\n- **Llama — Meta.** Famiglia rilasciata come **open-weight** (i pesi sono scaricabili ed eseguibili in proprio), molto usata da chi vuole **self-hosting** e personalizzazione — rilevante quando servono controllo dei dati e costi (es. modelli eseguiti internamente).\n\nDistinzione utile da ricordare: **closed-weight** (usi il modello solo via API di chi lo possiede) vs **open-weight** (scarichi i pesi e lo esegui/adatti tu). È una scelta chiave per privacy dei dati e costi in progetti reali.\n\n---\n\n## Completeness check (integrato da me)\n\nTre **limiti strutturali** da tenere sempre a mente (non sono bug, discendono da *come* funziona un LLM):\n\n1. **Allucinazioni (hallucinations).** Il modello genera il token **più probabile**, non il più **vero**: quando non \"sa\", produce comunque testo plausibile e ben scritto, che può essere **falso** (nomi, cifre, citazioni inventate). Non ha un meccanismo interno che distingue \"lo so\" da \"lo sto inventando\".\n2. **Knowledge cutoff (data di taglio della conoscenza).** Il modello conosce solo ciò che era nel testo di addestramento **fino a una certa data**. Eventi successivi gli sono **ignoti** — non è \"connesso\" al mondo di default.\n3. **Nessun accesso ai dati privati.** Non conosce i **tuoi** documenti (i ticket di Glacom, le cartelle di MaiCare, i PDF interni): quei dati non erano nell'addestramento.\n\n**L'aggancio → RAG.** Questi tre limiti si affrontano con la **RAG = Retrieval-Augmented Generation** (\"generazione aumentata dal recupero\", topic `xc-llm-rag`): invece di fidarsi solo della memoria interna, **prima si recuperano** i documenti pertinenti (usando gli embedding e la similarità coseno della sez. 2!) e **poi si mettono nel contesto** del modello, così risponde su dati **aggiornati, privati e verificabili**, riducendo le allucinazioni. Ecco perché embedding e context window, viste qui, sono i mattoni della prossima lezione.\n\n---\n\n## Fonti\n\n- **\"Attention Is All You Need\"**, Vaswani et al., 2017 — il paper che introduce il transformer: `arxiv.org/abs/1706.03762`\n- **\"The Illustrated Transformer\"**, Jay Alammar — la spiegazione visuale più famosa di attention e transformer: `jalammar.github.io/illustrated-transformer/`\n- **Hugging Face — Learn / NLP Course** — corsi gratuiti su token, embedding, transformer e uso pratico dei modelli: `huggingface.co/learn`\n\n---\n\n## Concetti adiacenti\n\n- `xc-llm-rag` — **RAG**: dare al modello documenti aggiornati/privati recuperandoli e mettendoli nel contesto (risolve i 3 limiti visti sopra).\n- `xc-llm-prompting` — **Prompting**: come scrivere l'input per guidare l'output, sfruttando context window e temperature.\n- `xc-llm-vectordb` — **Vector database**: dove si salvano gli embedding e come si cercano per similarità coseno su larga scala.\n- `ml-nn` — **Reti neurali**: le fondamenta (neuroni, pesi, addestramento) su cui poggia l'architettura transformer.\n\n---", "quiz": [{"q": "Cosa significa **LLM** e qual è l'unico compito base su cui è addestrato?", "a": "**LLM = Large Language Model** (grande modello linguistico). L'unico compito base è **predire il token (pezzo di parola) successivo più probabile** dato il testo precedente; da questa singola capacità emergono tutte le altre."}, {"q": "Cos'è un **token** e perché i modelli usano pezzi di parola (subword/**BPE**) invece di parole intere? Cosa vuol dire **BPE**?", "a": "Un **token** è un **pezzo di parola** (subword). Si usano i pezzi perché le parole intere sono troppe (vocabolario enorme e incompleto), non gestirebbero parole mai viste, e i pezzi frequenti si riusano (efficienza). **BPE = Byte Pair Encoding**: parte dai caratteri e **fonde ripetutamente le coppie di simboli più frequenti** in un token unico."}, {"q": "Cos'è la **context window** e cosa succede a ciò che la eccede?", "a": "La **context window** è il numero **massimo di token** che il modello considera **tutti insieme** in una chiamata (input + risposta). Ciò che la eccede **non esiste** per il modello: viene tagliato e \"dimenticato\"."}, {"q": "Cos'è un **embedding** e qual è la sua proprietà fondamentale rispetto ai significati?", "a": "Un **embedding** è un **vettore di numeri** che rappresenta il significato di un token. Proprietà fondamentale: **significati simili → vettori vicini** nello spazio; significati diversi → vettori lontani."}, {"q": "Scrivi la **formula della similarità coseno** e di' tra quali valori sta il risultato e cosa significano gli estremi.", "a": "**cosine similarity(A, B) = (A · B) / (‖A‖ · ‖B‖)** (prodotto scalare diviso il prodotto delle lunghezze). Il risultato va da **−1 a +1**: **+1** = stessa direzione (molto simili), **0** = non correlati, **−1** = opposti. Misura l'**angolo**, non la distanza."}, {"q": "Spiega la **self-attention** in una frase e di' cosa rappresentano **query, key e value**.", "a": "**Self-attention:** per ogni token, il modello **guarda tutti gli altri token e pesa quali sono rilevanti**, rappresentando il token come miscela pesata delle loro informazioni. **Query** = cosa il token cerca; **Key** = di cosa ogni token \"parla\" (l'etichetta da confrontare con la query); **Value** = l'informazione che il token porta e che viene mescolata secondo i pesi."}, {"q": "Perché il transformer **batte le RNN**? Cita i due vantaggi. Cosa vuol dire **RNN**?", "a": "**RNN = Recurrent Neural Network** (rete neurale ricorrente), legge in sequenza una parola alla volta. Il transformer la batte per (1) **parallelismo** — la self-attention guarda tutti i token insieme, sfruttando le GPU — e (2) **dipendenze lunghe** — collega direttamente token a qualsiasi distanza senza che l'informazione si diluisca."}, {"q": "Descrivi il ciclo **autoregressivo** di generazione: cosa fa la **softmax** e cosa distingue **greedy** da **sampling**?", "a": "**Autoregressivo:** il modello genera **un token alla volta**; ogni token scelto viene accodato all'input e il ciclo riparte. La **softmax** trasforma i punteggi grezzi (logit) in una **distribuzione di probabilità** (valori tra 0 e 1 che sommano a 1). **Greedy** = prendi sempre il token più probabile (deterministico); **sampling** = estrai a sorte rispettando le probabilità (vario/creativo)."}, {"q": "Cosa controlla la **temperature**? Cosa succede con temperature bassa vs alta?", "a": "La **temperature** appiattisce o accentua la distribuzione prima di estrarre. **Bassa (→0):** accentua i picchi → risposte prevedibili, precise, ripetibili (tende al greedy). **Alta (>1):** appiattisce → risposte creative e varie, ma più a rischio di errori/incoerenze."}, {"q": "Cosa vuol dire **RLHF** (per esteso) e a cosa serve? E cosa significa \"**7B parametri**\"?", "a": "**RLHF = Reinforcement Learning from Human Feedback** (apprendimento per rinforzo da feedback umano): allinea il modello a risposte utili/oneste/innocue, usando preferenze umane per addestrare un reward model e poi rinforzando le risposte ben valutate. **\"7B parametri\" = 7 miliardi** (B = Billion) **di parametri/pesi**: un modello relativamente piccolo, veloce ed economico."}]}, {"day": 4, "topic_id": "xc-llm-rag", "title": "RAG — tipi e architetture (naive, advanced, hybrid, graph, agentic)", "course": "LLM / AI Engineering", "area": "cross-cutting", "adjacent": ["xc-llm-fundamentals", "xc-llm-vectordb", "xc-llm-agents", "dm-ai"], "body": "# RAG — tipi e architetture\n\n> **Perché oggi:** questa è la lezione centrale. A Glacom porti RAG in produzione, e hai già fatto un tuo benchmark che confronta diverse architetture RAG sulle stesse domande. Per il ruolo target di **AI/LLM Engineer** devi sapere spiegare a memoria i cinque tipi di RAG, quando usarli, e — soprattutto — perché \"più sofisticato\" non vince quasi mai in automatico. Oggi metti in fila tutto: dal RAG più ingenuo a quello agentico, con i tool veri che useresti.\n\n## Cos'è RAG e il problema che risolve\n\n**RAG** = **Retrieval-Augmented Generation** (generazione aumentata dal recupero). È un pattern in cui, prima di far rispondere l'LLM, **recuperi** (retrieval) i pezzi di testo rilevanti da una tua base di conoscenza e li **infili nel prompt** come contesto, così l'LLM risponde basandosi su quelli invece che sulla sola memoria interna.\n\nIl problema che risolve nasce da tre limiti di un LLM \"nudo\":\n\n- **Knowledge cutoff** (data di taglio della conoscenza): l'LLM sa solo ciò che ha visto durante l'addestramento, fino a una certa data. Tutto ciò che è successo dopo, o che non era pubblico, semplicemente non lo conosce.\n- **Documenti privati**: il modello non ha mai visto i contratti, i ticket, i manuali interni della tua azienda. Non stavano nel suo training set.\n- **Allucinazione** (hallucination): quando non sa, l'LLM tende comunque a produrre una risposta plausibile ma **inventata**, con tono sicuro. Non ti dice \"non lo so\"; riempie il vuoto.\n\nLa soluzione di RAG è il **grounding** (ancoraggio): fornire all'LLM, dentro al prompt, il testo-sorgente da cui deve ricavare la risposta, così che la generi *ancorata* a documenti reali e verificabili (spesso con citazioni). Se la risposta deve venire da un chunk che gli hai passato, il modello ha molto meno spazio per inventare.\n\nDefinizioni compatte:\n\n- **Grounding**: ancorare la risposta del modello a fonti concrete passate nel contesto, così è verificabile e meno inventata.\n- **Allucinazione**: output linguisticamente fluente ma factualmente falso, prodotto quando il modello \"riempie i buchi\".\n- **Knowledge cutoff**: la data oltre la quale il modello non ha conoscenza, perché il suo addestramento si è fermato lì.\n\n<figure style=\"margin:18px 0;text-align:center\">\n<svg viewBox=\"0 0 720 220\" style=\"max-width:100%;height:auto;font-family:inherit\">\n  <defs><marker id=\"arRag1\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.4\"/></marker></defs>\n  <g font-size=\"11.5\" fill=\"var(--ink)\" text-anchor=\"middle\">\n   <rect x=\"8\" y=\"30\" width=\"120\" height=\"42\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"68\" y=\"47\">Domanda</text><text x=\"68\" y=\"62\">utente</text>\n   <rect x=\"8\" y=\"140\" width=\"120\" height=\"42\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"68\" y=\"157\">Embedding</text><text x=\"68\" y=\"172\">della domanda</text>\n   <rect x=\"170\" y=\"140\" width=\"150\" height=\"42\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/><text x=\"245\" y=\"157\">Vector DB</text><text x=\"245\" y=\"172\">ricerca top-k</text>\n   <rect x=\"360\" y=\"140\" width=\"130\" height=\"42\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"425\" y=\"157\">Chunk</text><text x=\"425\" y=\"172\">recuperati</text>\n   <rect x=\"360\" y=\"30\" width=\"130\" height=\"42\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"425\" y=\"47\">Prompt</text><text x=\"425\" y=\"62\">domanda + chunk</text>\n   <rect x=\"530\" y=\"30\" width=\"110\" height=\"42\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/><text x=\"585\" y=\"54\">LLM</text>\n   <rect x=\"530\" y=\"140\" width=\"180\" height=\"42\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"620\" y=\"157\">Risposta</text><text x=\"620\" y=\"172\">con citazioni</text>\n  </g>\n  <g stroke=\"var(--muted)\" stroke-width=\"1.4\" fill=\"none\" marker-end=\"url(#arRag1)\">\n   <path d=\"M68,72 L68,138\"/>\n   <path d=\"M128,161 L168,161\"/>\n   <path d=\"M320,161 L358,161\"/>\n   <path d=\"M425,138 L425,74\"/>\n   <path d=\"M490,51 L528,51\"/>\n   <path d=\"M585,72 L585,120 L620,120 L620,138\"/>\n  </g>\n</svg>\n<figcaption style=\"font-size:12px;color:var(--muted);margin-top:4px\">Pipeline RAG base: la domanda diventa un vettore, cerca i chunk simili nel Vector DB, quelli entrano nel prompt insieme alla domanda, l'LLM genera la risposta ancorata alle fonti.</figcaption>\n</figure>\n\n## I mattoni (che servono a tutti i tipi)\n\nQualunque tipo di RAG, dal più ingenuo all'agentico, poggia sugli stessi mattoni. Se questi li hai chiari, ogni architettura è solo un modo diverso di combinarli.\n\n- **Chunking** (spezzettamento): un documento intero è troppo grande per essere passato al modello, e comunque diluirebbe il segnale. Lo spezzi in **chunk** — pezzi di testo di poche centinaia di token (es. 200–800 token, spesso con un piccolo *overlap* di sovrapposizione per non tagliare frasi a metà). **Token** = l'unità in cui il modello legge il testo (circa 3/4 di parola in inglese). Trade-off: chunk **piccoli** = recupero preciso ma rischi di perdere il contesto attorno; chunk **grandi** = più contesto ma più rumore e più token spesi. Tool tipici: gli `TextSplitter` di LangChain (es. `RecursiveCharacterTextSplitter`) o i `NodeParser` di LlamaIndex.\n- **Embedding** (immersione/vettorializzazione): trasformi ogni chunk in un **vettore** (una lista di numeri, es. 384, 768 o 1536 dimensioni) che rappresenta il suo *significato*. Testi con significato simile finiscono vicini nello spazio vettoriale. Modelli reali: **OpenAI `text-embedding-3`** (small e large), **Cohere** (`embed-v3`), e i modelli open **sentence-transformers** (es. `all-MiniLM-L6-v2`, `bge`, `e5`) che giri in locale gratis.\n- **Vector DB / indice** (database vettoriale): memorizza tutti i vettori dei chunk e, data una query vettorizzata, ti restituisce i più simili in fretta. Tool reali: **FAISS** (libreria in-memory di Facebook/Meta, ottima per iniziare), **Pinecone** (servizio gestito cloud), **Weaviate**, **Qdrant**, e **pgvector** (estensione di PostgreSQL: vettori dentro al tuo Postgres). Per cercare veloce non fa un confronto esatto con tutti i vettori (troppo lento su milioni), ma usa la **ANN** = **Approximate Nearest Neighbor** (ricerca dei vicini più prossimi in modo *approssimato*): trova quasi-sempre i più simili ma in tempo enormemente inferiore, tipicamente con indici tipo HNSW (grafi di vicinato).\n- **Similarità coseno** (cosine similarity): il modo standard per misurare \"quanto due vettori si somigliano\". A parole: guarda l'**angolo** tra i due vettori, non la loro lunghezza. Se puntano nella stessa direzione, la similarità è vicina a 1 (molto simili); se sono perpendicolari, vicina a 0 (scorrelati). È così che il Vector DB decide quali chunk sono \"vicini\" alla domanda.\n- **top-k**: il numero **k** di chunk più simili che decidi di recuperare (es. top-5 = i 5 chunk più vicini). Pochi = rischi di perdere il pezzo giusto; troppi = riempi il prompt di rumore e spendi token.\n\n## I tipi di RAG (dal più semplice al più sofisticato)\n\nLi vediamo in ordine crescente di sofisticazione. Per ciascuno: **come funziona**, il **difetto** che risolve rispetto al precedente, e **quando** usarlo.\n\n### 1. Naive RAG\n\nIl RAG \"da manuale\", la versione base. Flusso: **embed** (vettorizzi la domanda) → **retrieve** (prendi i top-k chunk più simili dal Vector DB) → **stuff** (li impacchetti tutti nel prompt) → **generate** (l'LLM risponde).\n\n- *Come funziona*: una sola ricerca semantica, k fisso, nessun ritocco della query né dei risultati.\n- *Difetti*: recupero **impreciso** (la similarità coseno può ingannarsi), spesso finiscono nel contesto **chunk irrilevanti**, e non gestisce **query complesse** o ambigue (una domanda che richiede più informazioni sparse fallisce).\n- *Quando usarlo*: prototipo, dominio piccolo e pulito, domande dirette \"cosa dice il documento su X\". È il punto di partenza corretto: fallo funzionare, poi migliora.\n\n### 2. Advanced RAG\n\nStesso scheletro, ma aggiungi migliorie **prima** del retrieval (pre-retrieval) e **dopo** (post-retrieval) per alzare la precisione.\n\n- **Query rewriting / expansion** (riscrittura / espansione della query): riformuli la domanda dell'utente in una o più query migliori per la ricerca (es. sciogli i pronomi, aggiungi sinonimi), così peschi meglio.\n- **HyDE** = **Hypothetical Document Embeddings** (embedding di documento ipotetico): invece di cercare con la *domanda*, chiedi prima all'LLM di **inventare una risposta plausibile** alla domanda, poi vettorizzi *quella risposta finta* e con essa cerchi nel Vector DB. Idea: una risposta ipotetica assomiglia (nello spazio vettoriale) ai chunk-risposta veri più di quanto vi assomigli la domanda.\n- **Reranking** (riordino): dopo aver recuperato, poniamo, i primi 20 chunk con la ricerca veloce, passi ognuno insieme alla domanda a un **cross-encoder**, un modello che legge *coppia (domanda, chunk) insieme* e assegna un punteggio di rilevanza fine. È più lento ma molto più accurato del confronto vettoriale, perciò lo usi solo per riordinare i pochi candidati e tenere i migliori (es. i top-5 dopo il rerank). Tool reali: **Cohere Rerank**, i cross-encoder di **sentence-transformers**, il reranker di **BGE**.\n- **Metadata filtering** (filtro sui metadati): ai chunk associ metadati (data, autore, cliente, tipo documento) e filtri la ricerca (es. \"solo documenti del 2025 del cliente X\"), riducendo il campo prima ancora di misurare la similarità.\n- **Chunk migliori**: chunking più intelligente (per struttura del documento, per paragrafo, gerarchico), così ogni chunk è auto-contenuto.\n- *Difetto del naive che risolve*: la scarsa precisione del recupero e i chunk irrilevanti.\n- *Quando usarlo*: quasi sempre in produzione seria; il **reranking** in particolare è spesso il singolo miglioramento con più ritorno rispetto allo sforzo.\n\n### 3. Hybrid RAG (retrieval ibrido)\n\nCombini due modi diversi di cercare e ne **fondi** i risultati.\n\n- **Ricerca densa** (dense retrieval): quella per **embedding**, cattura il *significato*. Trova chunk che parlano della stessa cosa anche con parole diverse (sinonimi, parafrasi).\n- **Ricerca sparsa / lessicale** (sparse / lexical retrieval): cerca per **parole chiave esatte**, tipicamente con **BM25**. **BM25** (Best Matching 25) è l'algoritmo classico dei motori di ricerca testuale: a parole, premia i documenti in cui compaiono i termini della query, dando più peso ai termini **rari** (discriminanti) e correggendo per la lunghezza del documento e per la ripetizione (un termine ripetuto 10 volte non vale 10 volte 1). Non capisce i sinonimi, ma è imbattibile su termini **esatti**: codici prodotto, sigle, nomi propri, numeri di articolo.\n- *Perché fondere le due*: la densa prende il **significato**, la lessicale prende i **termini esatti** che la densa spesso \"sfuma\". Query come \"errore E-4021 sul modulo Alba\" hanno bisogno di entrambe: il concetto *e* il codice preciso.\n- **Fusione con RRF** = **Reciprocal Rank Fusion** (fusione per rango reciproco): come unisci due classifiche diverse (una dalla densa, una dalla lessicale)? Con RRF: ad ogni documento dai un punteggio pari alla somma di `1 / (k + rango)` sulle due liste (k è una costante piccola, es. 60). Vale la **posizione** in classifica, non i punteggi (che sono su scale incomparabili). Un documento che sta in alto in *entrambe* le liste vince; così premi il consenso tra i due metodi senza dover normalizzare punteggi eterogenei. Supportato nativamente da Weaviate, Qdrant, Elasticsearch/OpenSearch e dai retriever ibridi di LangChain/LlamaIndex.\n- *Difetto dell'advanced che risolve*: la ricerca puramente semantica che manca i match esatti (codici, sigle, nomi).\n- *Quando usarlo*: domini con tanta terminologia tecnica, codici, ID, nomi propri — cioè quasi ogni base di conoscenza aziendale reale.\n\n### 4. Graph RAG\n\nInvece di cercare tra chunk isolati, costruisci un **knowledge graph** (grafo della conoscenza) dai documenti.\n\n- *Come funziona*: con l'LLM estrai dai testi le **entità** (persone, prodotti, aziende, concetti) come **nodi** e le **relazioni** tra loro come **archi** (es. \"Alba Trasporti\" —*fornisce*→ \"Cliente X\"). Al momento della domanda **navighi il grafo**: parti dalle entità citate e segui gli archi per raccogliere il contesto connesso, invece di sperare che stia tutto in un chunk.\n- *Difetto che risolve*: le domande **multi-hop** (a più salti) e sulle **relazioni**, dove la risposta si costruisce collegando informazioni sparse in documenti diversi. Esempio: \"quali clienti sono serviti da fornitori che hanno avuto un ritardo nel 2025?\" — un salto solo non basta.\n- *Costo*: **più costoso da costruire e mantenere** (devi estrarre entità/relazioni, tenere il grafo aggiornato). Tool/approcci reali: **Microsoft GraphRAG**, LangChain con **Neo4j** (database a grafo), i `KnowledgeGraphIndex` di LlamaIndex.\n- *Quando usarlo*: domande relazionali e multi-hop, sintesi globale su tutto il corpus (\"temi ricorrenti nei ticket\"). Non per semplici lookup: lì è overkill (e nel mio benchmark il graph puro ha proprio perso — vedi sotto).\n\n### 5. Agentic RAG\n\nIl retrieval smette di essere un passo fisso e diventa una **decisione** presa da un **agente**.\n\n- **Agente** (agent): un LLM messo in un ciclo in cui può **ragionare, scegliere azioni (tool) e usare i risultati** per decidere il passo successivo, iterando finché non ha abbastanza per rispondere (collega al topic **xc-llm-agents**).\n- *Come funziona*: l'agente decide **dinamicamente** se recuperare (a volte non serve), **cosa** cercare, **quante volte** iterare, se **riformulare** la query dopo un recupero deludente, e **quali fonti/tool** usare (Vector DB, ricerca web, chiamata a un'API, un database SQL). Può fare più giri: cerca, valuta se basta, cerca ancora meglio.\n- *Difetto che risolve*: la rigidità di tutti i precedenti — un solo giro, k fisso, una sola strategia. Su domande composte o che richiedono più fonti, un flusso fisso fallisce; l'agente adatta.\n- *Costo*: più chiamate all'LLM, più **latenza** e più **imprevedibilità** (può loopare o divagare). Va messo con guardrail e limiti di iterazione.\n- *Quando usarlo*: domande eterogenee e complesse, più fonti, quando serve decidere *se* e *come* recuperare invece di farlo sempre uguale. Framework reali: i costrutti agentici di **LangGraph**, gli agenti di **LlamaIndex**.\n\n<figure style=\"margin:18px 0;text-align:center\">\n<svg viewBox=\"0 0 720 260\" style=\"max-width:100%;height:auto;font-family:inherit\">\n  <defs><marker id=\"arRag2\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6\" fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.4\"/></marker></defs>\n  <g font-size=\"12\" fill=\"var(--ink)\" text-anchor=\"middle\">\n   <rect x=\"130\" y=\"14\" width=\"140\" height=\"38\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"200\" y=\"38\">Naive</text>\n   <rect x=\"230\" y=\"62\" width=\"150\" height=\"38\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"305\" y=\"86\">Advanced</text>\n   <rect x=\"330\" y=\"110\" width=\"150\" height=\"38\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--accent)\" stroke-width=\"1.7\"/><text x=\"405\" y=\"134\">Hybrid</text>\n   <rect x=\"430\" y=\"158\" width=\"150\" height=\"38\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"505\" y=\"182\">Graph</text>\n   <rect x=\"530\" y=\"206\" width=\"160\" height=\"38\" rx=\"9\" fill=\"var(--card)\" stroke=\"var(--rule)\"/><text x=\"610\" y=\"230\">Agentic</text>\n  </g>\n  <g stroke=\"var(--muted)\" stroke-width=\"1.3\" fill=\"none\" marker-end=\"url(#arRag2)\">\n   <path d=\"M270,33 L228,52\"/>\n   <path d=\"M380,81 L328,100\"/>\n   <path d=\"M480,129 L428,148\"/>\n   <path d=\"M580,177 L528,196\"/>\n  </g>\n  <g font-size=\"11\" fill=\"var(--muted)\" text-anchor=\"start\">\n   <text x=\"14\" y=\"40\">↑ semplicità</text>\n   <text x=\"14\" y=\"232\">↑ qualità potenziale,</text>\n   <text x=\"14\" y=\"246\">costo e latenza</text>\n  </g>\n</svg>\n<figcaption style=\"font-size:12px;color:var(--muted);margin-top:4px\">La scala dei 5 tipi: salendo cresce la qualità potenziale, ma anche costo, latenza e complessità. Più in alto non è automaticamente meglio — dipende dalle domande reali.</figcaption>\n</figure>\n\n## Un mio benchmark (case study reale)\n\nHo confrontato diverse architetture RAG sullo **stesso set di domande**, misurando token spesi per risposta e qualità della risposta.\n\nUn approccio **ibrido con router** ha ridotto i token usati per risposta di circa l'**88%** (da **~1284 a ~150 token**) **mantenendo** la qualità: punteggio qualità **4,00 su 5** contro **3,92** del baseline più pesante. Una variante **graph-RAG puro** invece ha **perso**, con qualità **3,17**.\n\nCos'è un **router** qui: è il componente che, ricevuta una domanda, **sceglie la strategia di retrieval** giusta per *quella* query — ad esempio decide se fare ricerca densa, lessicale, ibrida, o addirittura se serve recuperare. Invece di applicare sempre la pipeline più pesante a tutte le domande, il router indirizza ognuna verso il percorso minimo sufficiente. È così che l'ibrido+router taglia i token: non spreca contesto su domande semplici.\n\n**Lezione**: più sofisticato non è automaticamente meglio. L'**ibrido + router** vinceva sull'**efficienza a parità di qualità** (stessa qualità, un ottavo dei token), mentre il **graph-RAG puro** — più complesso — è risultato il peggiore in qualità su questo set. Misura sempre sulle tue domande vere, prima di scegliere l'architettura.\n\n## Notable use cases (grandi aziende)\n\nRAG è il pattern dietro a moltissimi prodotti reali:\n\n- **Assistenti sulla documentazione aziendale**: fai domande in linguaggio naturale al manuale interno, alle policy, alla knowledge base tecnica, e ricevi risposte con citazioni alle pagine.\n- **Customer support su knowledge base**: il bot risponde ai clienti pescando dagli articoli di supporto e dalla FAQ, riducendo i ticket che arrivano agli umani.\n- **Ricerca legale e medica con citazioni**: interrogare corpus di sentenze, normative o letteratura clinica, con la risposta ancorata alle fonti citate (dove la verificabilità è obbligatoria).\n- È il pattern dietro praticamente ogni **\"chatta col tuo PDF\" / \"chatta con la tua knowledge base\"**: sotto il cofano c'è chunking + embedding + Vector DB + generazione ancorata.\n\n## Quando NON serve RAG\n\nRAG aggiunge complessità e latenza: non è gratis. Evitalo quando:\n\n- **La conoscenza è già nel modello**: domande di cultura generale o su nozioni pubbliche ben note — l'LLM le sa già, recuperare è inutile.\n- **Basta il fine-tuning**: se ti serve *comportamento/stile/formato* costante (non fatti freschi), meglio addestrare il modello su esempi (aggancio a **xc-llm-finetune**). Regola pratica: RAG per la **conoscenza** che cambia, fine-tuning per il **comportamento** stabile.\n- **I dati stanno in un DB strutturato**: se la risposta è \"quanti ordini a giugno\", non spezzetti tabelle in chunk — usi **text-to-SQL** (l'LLM genera la query SQL, il database dà il numero esatto). RAG semantico su dati numerici/tabellari è lo strumento sbagliato.\n\n## Fonti\n\n- Lewis et al., *\"Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks\"*, arXiv 2020 — il paper che introduce RAG.\n- *\"Retrieval-Augmented Generation for Large Language Models: A Survey\"*, arXiv — survey che sistematizza Naive / Advanced / Modular RAG.\n- Documentazione **LangChain** — python.langchain.com (retriever, splitter, reranking, hybrid, LangGraph).\n- Documentazione **LlamaIndex** — docs.llamaindex.ai (node parser, query engine, knowledge graph index, agenti).\n\n## Concetti adiacenti\n\n- **xc-llm-vectordb**: come funzionano dentro gli indici vettoriali (HNSW, ANN) e i Vector DB che RAG usa per il retrieval.\n- **xc-llm-agents**: il ciclo ragiona-agisci-osserva che sta sotto l'Agentic RAG.\n- **xc-llm-fundamentals**: token, embedding, prompt e contesto — i concetti base su cui poggia tutto RAG.\n- **dm-ai**: fondamenti di data mining / machine learning (spazi vettoriali, similarità) che danno intuizione alla ricerca densa.", "quiz": [{"q": "Cosa significa la sigla RAG e cosa fa in una frase?", "a": "**RAG = Retrieval-Augmented Generation**. Recupera i pezzi di testo rilevanti da una base di conoscenza e li infila nel prompt come contesto, così l'LLM risponde ancorato a quelli (grounding) invece che alla sola memoria interna."}, {"q": "Cos'è un **chunk** e qual è il trade-off tra chunk piccoli e grandi?", "a": "Un **chunk** è un pezzo di documento (poche centinaia di token) in cui spezzi i testi per poterli vettorizzare e recuperare. Trade-off: chunk **piccoli** = recupero più preciso ma rischio di perdere il contesto attorno; chunk **grandi** = più contesto ma più rumore e più token spesi."}, {"q": "Cosa vuol dire **knowledge cutoff** e perché è un problema che RAG risolve?", "a": "**Knowledge cutoff** = la data oltre la quale il modello non ha conoscenza, perché l'addestramento si è fermato lì; non conosce eventi successivi né i tuoi documenti privati. RAG lo risolve fornendo quei documenti nel prompt al momento della domanda."}, {"q": "Qual è la differenza tra ricerca **densa** e ricerca **lessicale/sparsa**?", "a": "**Densa** = ricerca per embedding, cattura il *significato* (trova anche sinonimi e parafrasi). **Lessicale/sparsa** = ricerca per parole chiave esatte (es. BM25), imbattibile su codici, sigle, nomi propri, ma non capisce i sinonimi."}, {"q": "Cos'è il **reranking** e con quale tipo di modello si fa?", "a": "**Reranking** = riordinare i chunk recuperati per rilevanza fine, passando ogni coppia (domanda, chunk) a un **cross-encoder**, un modello che legge domanda e chunk *insieme* e dà un punteggio più accurato del confronto vettoriale; si tiene poi i migliori. Tool: Cohere Rerank, cross-encoder sentence-transformers, BGE reranker."}, {"q": "Cosa fa un **router** in un sistema RAG?", "a": "Un **router** riceve la domanda e **sceglie la strategia di retrieval** giusta per quella query (densa, lessicale, ibrida, o nessun recupero), indirizzandola verso il percorso minimo sufficiente invece di applicare sempre la pipeline più pesante."}, {"q": "Che differenza c'è tra **Graph RAG** e **Agentic RAG**?", "a": "**Graph RAG**: costruisci un knowledge graph (entità = nodi, relazioni = archi) dai documenti e recuperi navigando il grafo, utile per domande multi-hop e relazionali. **Agentic RAG**: un agente decide dinamicamente se/cosa/quante volte recuperare, riformula, usa più fonti/tool e itera. In breve: Graph cambia la *struttura dati* del recupero; Agentic cambia il *controllo* (chi decide come recuperare)."}, {"q": "Cos'è **RRF** e a cosa serve nel retrieval ibrido?", "a": "**RRF = Reciprocal Rank Fusion**. Serve a fondere due classifiche diverse (densa e lessicale) sommando per ogni documento `1/(k+rango)` sulle due liste: usa le posizioni, non i punteggi incomparabili, e premia i documenti in alto in entrambe le liste."}, {"q": "Nel mio benchmark, di quanto sono scesi i token con l'ibrido+router e la qualità è calata?", "a": "I token sono scesi di circa l'**88%** (da ~1284 a ~150 per risposta) e la qualità **NON** è calata: **4,00** su 5 contro **3,92** del baseline più pesante."}, {"q": "Cita due situazioni in cui **NON** conviene usare RAG.", "a": "Due tra: (a) la conoscenza è già nel modello (nozioni pubbliche note); (b) serve solo comportamento/stile/formato → meglio fine-tuning; (c) i dati stanno in un DB strutturato → meglio text-to-SQL."}]}, {"day": 5, "topic_id": "xc-llm-agents", "title": "Agenti LLM e sistemi multi-agente — tool use, ReAct, orchestrazione", "course": "LLM / AI Engineering", "area": "cross-cutting", "adjacent": ["xc-llm-rag", "xc-llm-fundamentals", "xc-llm-eval"], "body": "# Agenti LLM e sistemi multi-agente\n\n> **Perché oggi:** è esattamente ciò che stai progettando. Per **MaiCare** (la tua startup FemTech) hai disegnato un **team di agenti** — nome interno **\"Paperclip\"** — con ruoli separati e orchestrazione, invece di un unico mega-prompt. Il ruolo che punti (**AI/LLM Engineer**) è, in gran parte, *saper decidere quando e come mettere un LLM dentro un loop con degli strumenti*. Questa lezione mette in fila i concetti che stai già usando, così li sai nominare e difendere a un colloquio.\n\nPrima gli acronimi base: **LLM = Large Language Model**, il modello linguistico di grandi dimensioni (es. Claude, GPT) che, dato del testo in ingresso, produce testo in uscita. **API = Application Programming Interface**, l'interfacci
